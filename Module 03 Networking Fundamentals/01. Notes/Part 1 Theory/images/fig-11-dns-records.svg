<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 250" role="img" aria-label="A grid of seven DNS record types with what each one maps" font-family="Verdana, Geneva, DejaVu Sans, sans-serif"><rect x="0" y="0" width="100%" height="100%" fill="#1c1a17"/><defs><marker id="a-ochre" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#d1972f"/></marker><marker id="a-verd" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#3f9c8b"/></marker><marker id="a-terra" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#c0603f"/></marker><marker id="a-sage" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8aa06a"/></marker><marker id="a-plum" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a6f9c"/></marker><marker id="a-peri" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7f8fc0"/></marker><marker id="a-parch" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e7ddcb"/></marker><marker id="a-faint" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a8f7d"/></marker><marker id="a-rule" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#4a453d"/></marker></defs><rect x="40" y="30" width="210" height="52" rx="8" fill="#262320" stroke="#d1972f" stroke-width="1.4"/><text x="54" y="61" text-anchor="start" fill="#d1972f" font-size="15" font-weight="bold" font-family="Consolas, DejaVu Sans Mono, monospace">A</text><text x="122" y="61" text-anchor="start" fill="#e7ddcb" font-size="11.5">name → IPv4</text><rect x="264" y="30" width="210" height="52" rx="8" fill="#262320" stroke="#d1972f" stroke-width="1.4"/><text x="278" y="61" text-anchor="start" fill="#d1972f" font-size="15" font-weight="bold" font-family="Consolas, DejaVu Sans Mono, monospace">AAAA</text><text x="346" y="61" text-anchor="start" fill="#e7ddcb" font-size="11.5">name → IPv6</text><rect x="488" y="30" width="210" height="52" rx="8" fill="#262320" stroke="#3f9c8b" stroke-width="1.4"/><text x="502" y="61" text-anchor="start" fill="#3f9c8b" font-size="15" font-weight="bold" font-family="Consolas, DejaVu Sans Mono, monospace">CNAME</text><text x="570" y="61" text-anchor="start" fill="#e7ddcb" font-size="11.5">name → another name</text><rect x="40" y="96" width="210" height="52" rx="8" fill="#262320" stroke="#9a6f9c" stroke-width="1.4"/><text x="54" y="127" text-anchor="start" fill="#9a6f9c" font-size="15" font-weight="bold" font-family="Consolas, DejaVu Sans Mono, monospace">MX</text><text x="122" y="127" text-anchor="start" fill="#e7ddcb" font-size="11.5">name → mail server</text><rect x="264" y="96" width="210" height="52" rx="8" fill="#262320" stroke="#7f8fc0" stroke-width="1.4"/><text x="278" y="127" text-anchor="start" fill="#7f8fc0" font-size="15" font-weight="bold" font-family="Consolas, DejaVu Sans Mono, monospace">NS</text><text x="346" y="127" text-anchor="start" fill="#e7ddcb" font-size="11.5">name → nameserver</text><rect x="488" y="96" width="210" height="52" rx="8" fill="#262320" stroke="#8aa06a" stroke-width="1.4"/><text x="502" y="127" text-anchor="start" fill="#8aa06a" font-size="15" font-weight="bold" font-family="Consolas, DejaVu Sans Mono, monospace">TXT</text><text x="570" y="127" text-anchor="start" fill="#e7ddcb" font-size="11.5">name → text (SPF, DKIM)</text><rect x="40" y="162" width="210" height="52" rx="8" fill="#262320" stroke="#c0603f" stroke-width="1.4"/><text x="54" y="193" text-anchor="start" fill="#c0603f" font-size="15" font-weight="bold" font-family="Consolas, DejaVu Sans Mono, monospace">PTR</text><text x="122" y="193" text-anchor="start" fill="#e7ddcb" font-size="11.5">IP → name (reverse)</text></svg>