<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 322" role="img" aria-label="A four rung ladder from Layer 3 at the bottom to Layer 7 at the top with an upward arrow" font-family="Verdana, Geneva, DejaVu Sans, sans-serif"><rect x="0" y="0" width="100%" height="100%" fill="#1c1a17"/><defs><marker id="a-ochre" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#d1972f"/></marker><marker id="a-verd" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#3f9c8b"/></marker><marker id="a-terra" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#c0603f"/></marker><marker id="a-sage" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8aa06a"/></marker><marker id="a-plum" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a6f9c"/></marker><marker id="a-peri" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7f8fc0"/></marker><marker id="a-parch" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e7ddcb"/></marker><marker id="a-faint" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a8f7d"/></marker><marker id="a-rule" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#4a453d"/></marker></defs><rect x="120" y="30" width="470" height="58" rx="8" fill="#262320" stroke="#8aa06a" stroke-width="1.4"/><text x="136" y="54" text-anchor="start" fill="#8aa06a" font-size="13" font-weight="bold">Layer 7</text><text x="136" y="74" text-anchor="start" fill="#e7ddcb" font-size="12">Does the app answer correctly?</text><text x="574" y="54" text-anchor="end" fill="#9a8f7d" font-size="11" font-family="Consolas, DejaVu Sans Mono, monospace">curl · browser</text><rect x="120" y="104" width="470" height="58" rx="8" fill="#262320" stroke="#3f9c8b" stroke-width="1.4"/><text x="136" y="128" text-anchor="start" fill="#3f9c8b" font-size="13" font-weight="bold">Layer 6</text><text x="136" y="148" text-anchor="start" fill="#e7ddcb" font-size="12">Does the TLS handshake complete?</text><text x="574" y="128" text-anchor="end" fill="#9a8f7d" font-size="11" font-family="Consolas, DejaVu Sans Mono, monospace">openssl s_client</text><rect x="120" y="178" width="470" height="58" rx="8" fill="#262320" stroke="#d1972f" stroke-width="1.4"/><text x="136" y="202" text-anchor="start" fill="#d1972f" font-size="13" font-weight="bold">Layer 4</text><text x="136" y="222" text-anchor="start" fill="#e7ddcb" font-size="12">Is a process listening on the port?</text><text x="574" y="202" text-anchor="end" fill="#9a8f7d" font-size="11" font-family="Consolas, DejaVu Sans Mono, monospace">ss · nc · telnet</text><rect x="120" y="252" width="470" height="58" rx="8" fill="#262320" stroke="#c0603f" stroke-width="1.4"/><text x="136" y="276" text-anchor="start" fill="#c0603f" font-size="13" font-weight="bold">Layer 3</text><text x="136" y="296" text-anchor="start" fill="#e7ddcb" font-size="12">Can I reach the host at all?</text><text x="574" y="276" text-anchor="end" fill="#9a8f7d" font-size="11" font-family="Consolas, DejaVu Sans Mono, monospace">ping · traceroute</text><line x1="92" y1="310" x2="92" y2="40" stroke="#d1972f" stroke-width="2" fill="none" marker-end="url(#a-ochre)"/><text x="50" y="166.0" text-anchor="start" fill="#d1972f" font-size="11" font-weight="bold">climb</text><text x="50" y="181.0" text-anchor="start" fill="#d1972f" font-size="11" font-weight="bold">upward</text></svg>