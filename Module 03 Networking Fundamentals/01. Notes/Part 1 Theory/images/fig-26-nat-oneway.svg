<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 250" role="img" aria-label="A private instance reaching the internet through a NAT gateway while new inbound connections are blocked" font-family="Verdana, Geneva, DejaVu Sans, sans-serif"><rect x="0" y="0" width="100%" height="100%" fill="#1c1a17"/><defs><marker id="a-ochre" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#d1972f"/></marker><marker id="a-verd" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#3f9c8b"/></marker><marker id="a-terra" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#c0603f"/></marker><marker id="a-sage" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8aa06a"/></marker><marker id="a-plum" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a6f9c"/></marker><marker id="a-peri" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7f8fc0"/></marker><marker id="a-parch" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e7ddcb"/></marker><marker id="a-faint" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a8f7d"/></marker><marker id="a-rule" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#4a453d"/></marker></defs><rect x="40" y="90" width="150" height="64" rx="8" fill="#262320" stroke="#3f9c8b" stroke-width="1.4"/><text x="115" y="116" text-anchor="middle" fill="#e7ddcb" font-size="12" font-weight="bold">private instance</text><text x="115" y="136" text-anchor="middle" fill="#9a8f7d" font-size="10">no public address</text><rect x="280" y="80" width="150" height="84" rx="8" fill="#151310" stroke="#d1972f" stroke-width="1.4"/><text x="355" y="108" text-anchor="middle" fill="#d1972f" font-size="12" font-weight="bold">NAT gateway</text><text x="355" y="126" text-anchor="middle" fill="#9a8f7d" font-size="10">in the public</text><text x="355" y="140" text-anchor="middle" fill="#9a8f7d" font-size="10">subnet</text><rect x="520" y="90" width="140" height="64" rx="8" fill="#262320" stroke="#7f8fc0" stroke-width="1.4"/><text x="590" y="120" text-anchor="middle" fill="#e7ddcb" font-size="12" font-weight="bold">internet</text><line x1="190" y1="110" x2="278" y2="110" stroke="#d1972f" stroke-width="2" fill="none" marker-end="url(#a-ochre)"/><line x1="430" y1="110" x2="518" y2="110" stroke="#d1972f" stroke-width="2" fill="none" marker-end="url(#a-ochre)"/><text x="355" y="64" text-anchor="middle" fill="#d1972f" font-size="10.5">outbound: patches, packages, APIs</text><line x1="518" y1="138" x2="432" y2="138" stroke="#8aa06a" stroke-width="1.6" fill="none" stroke-dasharray="4 3" marker-end="url(#a-sage)"/><line x1="278" y1="138" x2="192" y2="138" stroke="#8aa06a" stroke-width="1.6" fill="none" stroke-dasharray="4 3" marker-end="url(#a-sage)"/><text x="355" y="182" text-anchor="middle" fill="#8aa06a" font-size="10.5">the reply is tracked back to the instance</text><line x1="516" y1="210" x2="436" y2="210" stroke="#c0603f" stroke-width="1.6" fill="none" stroke-dasharray="3 3" marker-end="url(#a-terra)"/><text x="430" y="214" text-anchor="end" fill="#c0603f" font-size="15">✕</text><text x="430" y="232" text-anchor="end" fill="#c0603f" font-size="11" font-weight="bold">no new inbound connection · the door swings one way</text></svg>