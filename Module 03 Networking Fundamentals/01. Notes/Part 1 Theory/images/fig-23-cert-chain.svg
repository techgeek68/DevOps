<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 180" role="img" aria-label="A certificate chain from leaf to intermediate to root with the root held by the client" font-family="Verdana, Geneva, DejaVu Sans, sans-serif"><rect x="0" y="0" width="100%" height="100%" fill="#1c1a17"/><defs><marker id="a-ochre" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#d1972f"/></marker><marker id="a-verd" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#3f9c8b"/></marker><marker id="a-terra" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#c0603f"/></marker><marker id="a-sage" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8aa06a"/></marker><marker id="a-plum" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a6f9c"/></marker><marker id="a-peri" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7f8fc0"/></marker><marker id="a-parch" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e7ddcb"/></marker><marker id="a-faint" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a8f7d"/></marker><marker id="a-rule" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#4a453d"/></marker></defs><rect x="90" y="70" width="170" height="70" rx="8" fill="#262320" stroke="#d1972f" stroke-width="1.4"/><text x="175" y="100" text-anchor="middle" fill="#d1972f" font-size="14" font-weight="bold">leaf</text><text x="175" y="122" text-anchor="middle" fill="#e7ddcb" font-size="10.5">your certificate</text><text x="175" y="160" text-anchor="middle" fill="#8aa06a" font-size="10.5" font-weight="bold">served</text><line x1="260" y1="105" x2="300" y2="105" stroke="#3f9c8b" stroke-width="1.6" fill="none" marker-end="url(#a-verd)"/><text x="280" y="96" text-anchor="middle" fill="#9a8f7d" font-size="9">signs</text><rect x="300" y="70" width="170" height="70" rx="8" fill="#262320" stroke="#3f9c8b" stroke-width="1.4"/><text x="385" y="100" text-anchor="middle" fill="#3f9c8b" font-size="14" font-weight="bold">intermediate</text><text x="385" y="122" text-anchor="middle" fill="#e7ddcb" font-size="10.5">signed by the root</text><text x="385" y="160" text-anchor="middle" fill="#8aa06a" font-size="10.5" font-weight="bold">served</text><line x1="470" y1="105" x2="510" y2="105" stroke="#3f9c8b" stroke-width="1.6" fill="none" marker-end="url(#a-verd)"/><text x="490" y="96" text-anchor="middle" fill="#9a8f7d" font-size="9">signs</text><rect x="510" y="70" width="170" height="70" rx="8" fill="#151310" stroke="#4a453d" stroke-width="1.4"/><text x="595" y="100" text-anchor="middle" fill="#9a8f7d" font-size="14" font-weight="bold">root</text><text x="595" y="122" text-anchor="middle" fill="#9a8f7d" font-size="10.5">in the client trust store</text><text x="595" y="160" text-anchor="middle" fill="#9a8f7d" font-size="10.5">client already has it</text><text x="300" y="44" text-anchor="middle" fill="#9a8f7d" font-size="11">send the leaf and every intermediate, never the root</text></svg>