xt-anchor="middle" fill="#e7ddcb" font-size="12" font-weight="bold">DHCP server</text><line x1="212" y1="100" x2="398" y2="100" stroke="#d1972f" stroke-width="1.6" fill="none" marker-end="url(#a-ochre)"/><text x="305.0" y="92" text-anchor="middle" fill="#d1972f" font-size="12" font-weight="bold">D · Discover</text><text x="305.0" y="112" text-anchor="middle" fill="#9a8f7d" font-size="9.5">broadcast</text><line x1="398" y1="142" x2="212" y2="142" stroke="#3f9c8b" stroke-width="1.6" fill="none" marker-end="url(#a-verd)"/><text x="305.0" y="134" text-anchor="middle" fill="#3f9c8b" font-size="12" font-weight="bold">O · Offer</text><text x="305.0" y="154" text-anchor="middle" fill="#9a8f7d" font-size="9.5">address on loan</text><line x1="212" y1="184" x2="398" y2="184" stroke="#d1972f" stroke-width="1.6" fill="none" marker-end="url(#a-ochre)"/><text x="305.0" y="176" text-anchor="middle" fill="#d1972f" font-size="12" font-weight="bold">R · Request</text><text x="305.0" y="196" text-anchor="middle" fill="#9a8f7d" font-size="9.5">I accept this one</text><line x1="398" y1="226" x2="212" y2="226" stroke="#3f9c8b" stroke-width="1.6" fill="none" marker-end="url(#a-verd)"/><text x="305.0" y="218" text-anchor="middle" fill="#3f9c8b" font-size="12" font-weight="bold">A · Acknowledge</text><text x="305.0" y="238" text-anchor="middle" fill="#9a8f7d" font-size="9.5">confirmed</text><text x="305.0" y="270" text-anchor="middle" fill="#9a8f7d" font-size="10.5" font-family="Consolas, DejaVu Sans Mono, monospace">UDP · server 67 · client 68</text></svg>