<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 264" role="img" aria-label="Five firewalld zones and the behaviour each one applies to an interface" font-family="Verdana, Geneva, DejaVu Sans, sans-serif"><rect x="0" y="0" width="100%" height="100%" fill="#1c1a17"/><defs><marker id="a-ochre" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#d1972f"/></marker><marker id="a-verd" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#3f9c8b"/></marker><marker id="a-terra" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#c0603f"/></marker><marker id="a-sage" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8aa06a"/></marker><marker id="a-plum" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a6f9c"/></marker><marker id="a-peri" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7f8fc0"/></marker><marker id="a-parch" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e7ddcb"/></marker><marker id="a-faint" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a8f7d"/></marker><marker id="a-rule" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#4a453d"/></marker></defs><text x="40" y="22" text-anchor="start" fill="#9a8f7d" font-size="11">interface</text><rect x="60" y="34" width="150" height="34" rx="8" fill="#262320" stroke="#d1972f" stroke-width="1.4"/><text x="135" y="56" text-anchor="middle" fill="#d1972f" font-size="13" font-weight="bold" font-family="Consolas, DejaVu Sans Mono, monospace">public</text><text x="230" y="56" text-anchor="start" fill="#e7ddcb" font-size="11.5">allow only listed services</text><line x1="52" y1="51" x2="59" y2="51" stroke="#d1972f" stroke-width="1.6" fill="none" marker-end="url(#a-ochre)"/><rect x="60" y="78" width="150" height="34" rx="8" fill="#262320" stroke="#8aa06a" stroke-width="1.4"/><text x="135" y="100" text-anchor="middle" fill="#8aa06a" font-size="13" font-weight="bold" font-family="Consolas, DejaVu Sans Mono, monospace">trusted</text><text x="230" y="100" text-anchor="start" fill="#e7ddcb" font-size="11.5">allow everything</text><line x1="52" y1="95" x2="59" y2="95" stroke="#8aa06a" stroke-width="1.6" fill="none" marker-end="url(#a-sage)"/><rect x="60" y="122" width="150" height="34" rx="8" fill="#262320" stroke="#7f8fc0" stroke-width="1.4"/><text x="135" y="144" text-anchor="middle" fill="#7f8fc0" font-size="13" font-weight="bold" font-family="Consolas, DejaVu Sans Mono, monospace">internal</text><text x="230" y="144" text-anchor="start" fill="#e7ddcb" font-size="11.5">trusted internal, a little looser</text><line x1="52" y1="139" x2="59" y2="139" stroke="#7f8fc0" stroke-width="1.6" fill="none" marker-end="url(#a-peri)"/><rect x="60" y="166" width="150" height="34" rx="8" fill="#262320" stroke="#c0603f" stroke-width="1.4"/><text x="135" y="188" text-anchor="middle" fill="#c0603f" font-size="13" font-weight="bold" font-family="Consolas, DejaVu Sans Mono, monospace">drop</text><text x="230" y="188" text-anchor="start" fill="#e7ddcb" font-size="11.5">incoming dropped in silence → timeout</text><line x1="52" y1="183" x2="59" y2="183" stroke="#c0603f" stroke-width="1.6" fill="none" marker-end="url(#a-terra)"/><rect x="60" y="210" width="150" height="34" rx="8" fill="#262320" stroke="#9a6f9c" stroke-width="1.4"/><text x="135" y="232" text-anchor="middle" fill="#9a6f9c" font-size="13" font-weight="bold" font-family="Consolas, DejaVu Sans Mono, monospace">block</text><text x="230" y="232" text-anchor="start" fill="#e7ddcb" font-size="11.5">incoming refused with an error → refused</text><line x1="52" y1="227" x2="59" y2="227" stroke="#9a6f9c" stroke-width="1.6" fill="none" marker-end="url(#a-plum)"/></svg>