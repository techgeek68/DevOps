<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 140" role="img" aria-label="Three panels contrasting a refused connection, a timed out connection, and a no route error" font-family="Verdana, Geneva, DejaVu Sans, sans-serif"><rect x="0" y="0" width="100%" height="100%" fill="#1c1a17"/><defs><marker id="a-ochre" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#d1972f"/></marker><marker id="a-verd" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#3f9c8b"/></marker><marker id="a-terra" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#c0603f"/></marker><marker id="a-sage" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8aa06a"/></marker><marker id="a-plum" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a6f9c"/></marker><marker id="a-peri" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7f8fc0"/></marker><marker id="a-parch" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e7ddcb"/></marker><marker id="a-faint" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a8f7d"/></marker><marker id="a-rule" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#4a453d"/></marker></defs><text x="90" y="30" text-anchor="middle" fill="#3f9c8b" font-size="13" font-weight="bold">Connection refused</text><rect x="8" y="48" width="54" height="34" rx="8" fill="#151310" stroke="#4a453d" stroke-width="1.4"/><text x="35" y="69" text-anchor="middle" fill="#9a8f7d" font-size="11">you</text><rect x="118" y="48" width="54" height="34" rx="8" fill="#262320" stroke="#3f9c8b" stroke-width="1.4"/><text x="145" y="69" text-anchor="middle" fill="#e7ddcb" font-size="11">host</text><line x1="64" y1="58" x2="116" y2="58" stroke="#3f9c8b" stroke-width="1.6" fill="none" marker-end="url(#a-verd)"/><line x1="116" y1="74" x2="64" y2="74" stroke="#c0603f" stroke-width="1.6" fill="none" stroke-dasharray="4 3" marker-end="url(#a-terra)"/><text x="90" y="104" text-anchor="middle" fill="#e7ddcb" font-size="11">answered, fast</text><text x="90" y="124" text-anchor="middle" fill="#9a8f7d" font-size="10.5">port open, no listener</text><text x="310" y="30" text-anchor="middle" fill="#c0603f" font-size="13" font-weight="bold">Connection timed out</text><rect x="228" y="48" width="54" height="34" rx="8" fill="#151310" stroke="#4a453d" stroke-width="1.4"/><text x="255" y="69" text-anchor="middle" fill="#9a8f7d" font-size="11">you</text><rect x="338" y="48" width="54" height="34" rx="8" fill="#262320" stroke="#c0603f" stroke-width="1.4"/><text x="365" y="69" text-anchor="middle" fill="#e7ddcb" font-size="11">host</text><line x1="284" y1="65" x2="332" y2="65" stroke="#c0603f" stroke-width="1.6" fill="none" stroke-dasharray="4 3" marker-end="url(#a-terra)"/><text x="365" y="90" text-anchor="middle" fill="#9a8f7d" font-size="11">…silence</text><text x="310" y="104" text-anchor="middle" fill="#e7ddcb" font-size="11">nothing came back</text><text x="310" y="124" text-anchor="middle" fill="#9a8f7d" font-size="10.5">firewall drop or no route</text><text x="530" y="30" text-anchor="middle" fill="#d1972f" font-size="13" font-weight="bold">No route to host</text><rect x="448" y="48" width="54" height="34" rx="8" fill="#151310" stroke="#4a453d" stroke-width="1.4"/><text x="475" y="69" text-anchor="middle" fill="#9a8f7d" font-size="11">you</text><rect x="558" y="48" width="54" height="34" rx="8" fill="#262320" stroke="#d1972f" stroke-width="1.4"/><text x="585" y="69" text-anchor="middle" fill="#e7ddcb" font-size="11">host</text><line x1="504" y1="65" x2="532" y2="65" stroke="#d1972f" stroke-width="1.6" fill="none" marker-end="url(#a-ochre)"/><text x="536" y="69" text-anchor="start" fill="#d1972f" font-size="15">✕</text><text x="530" y="104" text-anchor="middle" fill="#e7ddcb" font-size="11">never left the kernel</text><text x="530" y="124" text-anchor="middle" fill="#9a8f7d" font-size="10.5">your own routing table</text></svg>