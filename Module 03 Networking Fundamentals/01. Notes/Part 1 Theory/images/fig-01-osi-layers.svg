<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 356" role="img" aria-label="Vertical stack of the seven OSI layers with layers 3 to 7 highlighted as the engineer working range" font-family="Verdana, Geneva, DejaVu Sans, sans-serif"><rect x="0" y="0" width="100%" height="100%" fill="#1c1a17"/><defs><marker id="a-ochre" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#d1972f"/></marker><marker id="a-verd" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#3f9c8b"/></marker><marker id="a-terra" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#c0603f"/></marker><marker id="a-sage" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8aa06a"/></marker><marker id="a-plum" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a6f9c"/></marker><marker id="a-peri" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7f8fc0"/></marker><marker id="a-parch" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e7ddcb"/></marker><marker id="a-faint" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a8f7d"/></marker><marker id="a-rule" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#4a453d"/></marker></defs><rect x="70" y="34" width="500" height="34" rx="8" fill="#262320" stroke="#d1972f" stroke-width="1.4"/><text x="94" y="55.0" text-anchor="middle" fill="#d1972f" font-size="15" font-weight="bold">7</text><text x="180" y="55.0" text-anchor="start" fill="#e7ddcb" font-size="13" font-weight="bold">Application</text><text x="360" y="55.0" text-anchor="start" fill="#9a8f7d" font-size="11">curl · browser · app logs</text><rect x="70" y="78" width="500" height="34" rx="8" fill="#262320" stroke="#3f9c8b" stroke-width="1.4"/><text x="94" y="99.0" text-anchor="middle" fill="#3f9c8b" font-size="15" font-weight="bold">6</text><text x="180" y="99.0" text-anchor="start" fill="#e7ddcb" font-size="13" font-weight="bold">Presentation</text><text x="360" y="99.0" text-anchor="start" fill="#9a8f7d" font-size="11">openssl s_client · TLS certs</text><rect x="70" y="122" width="500" height="34" rx="8" fill="#262320" stroke="#9a6f9c" stroke-width="1.4"/><text x="94" y="143.0" text-anchor="middle" fill="#9a6f9c" font-size="15" font-weight="bold">5</text><text x="180" y="143.0" text-anchor="start" fill="#e7ddcb" font-size="13" font-weight="bold">Session</text><text x="360" y="143.0" text-anchor="start" fill="#9a8f7d" font-size="11">folded into L4 and L7</text><rect x="70" y="166" width="500" height="34" rx="8" fill="#262320" stroke="#d1972f" stroke-width="1.4"/><text x="94" y="187.0" text-anchor="middle" fill="#d1972f" font-size="15" font-weight="bold">4</text><text x="180" y="187.0" text-anchor="start" fill="#e7ddcb" font-size="13" font-weight="bold">Transport</text><text x="360" y="187.0" text-anchor="start" fill="#9a8f7d" font-size="11">ss · nc · telnet</text><rect x="70" y="210" width="500" height="34" rx="8" fill="#262320" stroke="#c0603f" stroke-width="1.4"/><text x="94" y="231.0" text-anchor="middle" fill="#c0603f" font-size="15" font-weight="bold">3</text><text x="180" y="231.0" text-anchor="start" fill="#e7ddcb" font-size="13" font-weight="bold">Network</text><text x="360" y="231.0" text-anchor="start" fill="#9a8f7d" font-size="11">ping · traceroute · ip route</text><rect x="70" y="254" width="500" height="34" rx="8" fill="#151310" stroke="#4a453d" stroke-width="1.4"/><text x="94" y="275.0" text-anchor="middle" fill="#9a8f7d" font-size="15" font-weight="bold">2</text><text x="180" y="275.0" text-anchor="start" fill="#9a8f7d" font-size="13" font-weight="bold">Data Link</text><text x="360" y="275.0" text-anchor="start" fill="#9a8f7d" font-size="11">handled by cloud or hypervisor</text><rect x="70" y="298" width="500" height="34" rx="8" fill="#151310" stroke="#4a453d" stroke-width="1.4"/><text x="94" y="319.0" text-anchor="middle" fill="#9a8f7d" font-size="15" font-weight="bold">1</text><text x="180" y="319.0" text-anchor="start" fill="#9a8f7d" font-size="13" font-weight="bold">Physical</text><text x="360" y="319.0" text-anchor="start" fill="#9a8f7d" font-size="11">handled by cloud or hypervisor</text><path d="M586,34 h12 v210 h-12" fill="none" stroke="#d1972f" stroke-width="1.6"/><text x="604" y="131.0" text-anchor="start" fill="#d1972f" font-size="11" font-weight="bold">your</text><text x="604" y="146.0" text-anchor="start" fill="#d1972f" font-size="11" font-weight="bold">working</text><text x="604" y="161.0" text-anchor="start" fill="#d1972f" font-size="11" font-weight="bold">range</text></svg>