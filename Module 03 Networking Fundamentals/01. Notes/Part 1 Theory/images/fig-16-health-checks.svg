"1.4"/><text x="435" y="52" text-anchor="middle" fill="#e7ddcb" font-size="12" font-weight="bold">backend 1</text><text x="435" y="70" text-anchor="middle" fill="#8aa06a" font-size="10.5">healthy</text><line x1="182" y1="115" x2="358" y2="55" stroke="#8aa06a" stroke-width="1.6" fill="none" stroke-dasharray="4 3" marker-end="url(#a-sage)"/><rect x="360" y="100" width="150" height="50" rx="8" fill="#262320" stroke="#c0603f" stroke-width="1.4"/><text x="435" y="122" text-anchor="middle" fill="#e7ddcb" font-size="12" font-weight="bold">backend 2</text><text x="435" y="140" text-anchor="middle" fill="#c0603f" font-size="10.5">failing</text><line x1="182" y1="115" x2="358" y2="125" stroke="#c0603f" stroke-width="1.6" fill="none" stroke-dasharray="4 3" marker-end="url(#a-terra)"/><text x="300" y="120" text-anchor="end" fill="#c0603f" font-size="10">removed from</text><text x="300" y="134" text-anchor="end" fill="#c0603f" font-size="10">rotation</text><rect x="360" y="170" width="150" height="50" rx="8" fill="#262320" stroke="#8aa06a" stroke-width="1.4"/><text x="435" y="192" text-anchor="middle" fill="#e7ddcb" font-size="12" font-weight="bold">backend 3</text><text x="435" y="210" text-anchor="middle" fill="#8aa06a" font-size="10.5">healthy</text><line x1="182" y1="115" x2="358" y2="195" stroke="#8aa06a" stroke-width="1.6" fill="none" stroke-dasharray="4 3" marker-end="url(#a-sage)"/></svg>