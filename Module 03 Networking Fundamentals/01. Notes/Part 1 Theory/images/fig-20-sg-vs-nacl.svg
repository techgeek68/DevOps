<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 252" role="img" aria-label="A subnet level NACL and an instance level security group contrasted" font-family="Verdana, Geneva, DejaVu Sans, sans-serif"><rect x="0" y="0" width="100%" height="100%" fill="#1c1a17"/><defs><marker id="a-ochre" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#d1972f"/></marker><marker id="a-verd" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#3f9c8b"/></marker><marker id="a-terra" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#c0603f"/></marker><marker id="a-sage" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8aa06a"/></marker><marker id="a-plum" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a6f9c"/></marker><marker id="a-peri" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7f8fc0"/></marker><marker id="a-parch" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e7ddcb"/></marker><marker id="a-faint" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a8f7d"/></marker><marker id="a-rule" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#4a453d"/></marker></defs><rect x="40" y="40" width="300" height="200" rx="12" fill="#151310" stroke="#7f8fc0" stroke-width="1.4" stroke-dasharray="6 4"/><text x="190" y="64" text-anchor="middle" fill="#7f8fc0" font-size="12" font-weight="bold">subnet</text><rect x="120" y="150" width="140" height="70" rx="8" fill="#262320" stroke="#3f9c8b" stroke-width="1.4"/><text x="190" y="182" text-anchor="middle" fill="#e7ddcb" font-size="12" font-weight="bold">instance</text><text x="190" y="86" text-anchor="middle" fill="#9a8f7d" font-size="9.5">NACL · stateless · allow and deny · numbered</text><rect x="96" y="126" width="188" height="118" rx="10" fill="none" stroke="#7f8fc0" stroke-width="1.4" stroke-dasharray="3 3"/><text x="190" y="204" text-anchor="middle" fill="#3f9c8b" font-size="9.5">security group · stateful · allow only</text><text x="380" y="60" text-anchor="start" fill="#3f9c8b" font-size="12.5" font-weight="bold">Security group</text><text x="388" y="76" text-anchor="start" fill="#e7ddcb" font-size="11">· guards the instance</text><text x="388" y="96" text-anchor="start" fill="#e7ddcb" font-size="11">· stateful: reply auto allowed</text><text x="388" y="116" text-anchor="start" fill="#e7ddcb" font-size="11">· allow rules only</text><text x="388" y="136" text-anchor="start" fill="#e7ddcb" font-size="11">· evaluated as a union</text><text x="380" y="168" text-anchor="start" fill="#7f8fc0" font-size="12.5" font-weight="bold">NACL</text><text x="388" y="184" text-anchor="start" fill="#e7ddcb" font-size="11">· guards the whole subnet</text><text x="388" y="204" text-anchor="start" fill="#e7ddcb" font-size="11">· stateless: reply needs a rule</text><text x="388" y="224" text-anchor="start" fill="#e7ddcb" font-size="11">· allow and deny rules</text><text x="388" y="244" text-anchor="start" fill="#e7ddcb" font-size="11">· first match by number wins</text></svg>