<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 220" role="img" aria-label="A comparison of a Layer 4 balancer forwarding blindly and a Layer 7 balancer routing by path" font-family="Verdana, Geneva, DejaVu Sans, sans-serif"><rect x="0" y="0" width="100%" height="100%" fill="#1c1a17"/><defs><marker id="a-ochre" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#d1972f"/></marker><marker id="a-verd" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#3f9c8b"/></marker><marker id="a-terra" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#c0603f"/></marker><marker id="a-sage" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8aa06a"/></marker><marker id="a-plum" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a6f9c"/></marker><marker id="a-peri" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7f8fc0"/></marker><marker id="a-parch" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e7ddcb"/></marker><marker id="a-faint" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a8f7d"/></marker><marker id="a-rule" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#4a453d"/></marker></defs><text x="60" y="30" text-anchor="start" fill="#d1972f" font-size="12" font-weight="bold">L4 · by address and port</text><rect x="40" y="44" width="70" height="40" rx="8" fill="#151310" stroke="#4a453d" stroke-width="1.4"/><text x="75" y="68" text-anchor="middle" fill="#9a8f7d" font-size="11">client</text><rect x="170" y="44" width="110" height="40" rx="8" fill="#262320" stroke="#d1972f" stroke-width="1.4"/><text x="225" y="62" text-anchor="middle" fill="#e7ddcb" font-size="11.5" font-weight="bold">L4 balancer</text><text x="225" y="78" text-anchor="middle" fill="#9a8f7d" font-size="9.5">does not read request</text><line x1="110" y1="64" x2="168" y2="64" stroke="#d1972f" stroke-width="1.6" fill="none" marker-end="url(#a-ochre)"/><rect x="360" y="44" width="120" height="26" rx="8" fill="#262320" stroke="#3f9c8b" stroke-width="1.4"/><text x="420" y="61" text-anchor="middle" fill="#e7ddcb" font-size="10.5">backend 1</text><line x1="280" y1="64" x2="358" y2="57" stroke="#3f9c8b" stroke-width="1.6" fill="none" stroke-dasharray="3 3" marker-end="url(#a-verd)"/><rect x="360" y="74" width="120" height="26" rx="8" fill="#262320" stroke="#3f9c8b" stroke-width="1.4"/><text x="420" y="91" text-anchor="middle" fill="#e7ddcb" font-size="10.5">backend 2</text><line x1="280" y1="64" x2="358" y2="87" stroke="#3f9c8b" stroke-width="1.6" fill="none" stroke-dasharray="3 3" marker-end="url(#a-verd)"/><text x="60" y="136" text-anchor="start" fill="#3f9c8b" font-size="12" font-weight="bold">L7 · by path, host, headers</text><rect x="40" y="150" width="70" height="40" rx="8" fill="#151310" stroke="#4a453d" stroke-width="1.4"/><text x="75" y="174" text-anchor="middle" fill="#9a8f7d" font-size="11">client</text><rect x="170" y="150" width="110" height="40" rx="8" fill="#262320" stroke="#3f9c8b" stroke-width="1.4"/><text x="225" y="168" text-anchor="middle" fill="#e7ddcb" font-size="11.5" font-weight="bold">L7 balancer</text><text x="225" y="184" text-anchor="middle" fill="#9a8f7d" font-size="9.5">reads /api vs /static</text><line x1="110" y1="170" x2="168" y2="170" stroke="#3f9c8b" stroke-width="1.6" fill="none" marker-end="url(#a-verd)"/><rect x="360" y="144" width="150" height="26" rx="8" fill="#262320" stroke="#d1972f" stroke-width="1.4"/><text x="435" y="161" text-anchor="middle" fill="#e7ddcb" font-size="10.5" font-family="Consolas, DejaVu Sans Mono, monospace">/api → app pool</text><rect x="360" y="180" width="150" height="26" rx="8" fill="#262320" stroke="#9a6f9c" stroke-width="1.4"/><text x="435" y="197" text-anchor="middle" fill="#e7ddcb" font-size="10.5" font-family="Consolas, DejaVu Sans Mono, monospace">/static → storage</text><line x1="280" y1="166" x2="358" y2="157" stroke="#d1972f" stroke-width="1.6" fill="none" marker-end="url(#a-ochre)"/><line x1="280" y1="174" x2="358" y2="193" stroke="#9a6f9c" stroke-width="1.6" fill="none" marker-end="url(#a-plum)"/></svg>