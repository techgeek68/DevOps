<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 310" role="img" aria-label="The TLS handshake steps from client hello through certificate check to an encrypted session" font-family="Verdana, Geneva, DejaVu Sans, sans-serif"><rect x="0" y="0" width="100%" height="100%" fill="#1c1a17"/><defs><marker id="a-ochre" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#d1972f"/></marker><marker id="a-verd" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#3f9c8b"/></marker><marker id="a-terra" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#c0603f"/></marker><marker id="a-sage" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8aa06a"/></marker><marker id="a-plum" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a6f9c"/></marker><marker id="a-peri" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7f8fc0"/></marker><marker id="a-parch" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e7ddcb"/></marker><marker id="a-faint" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a8f7d"/></marker><marker id="a-rule" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#4a453d"/></marker></defs><text x="140" y="32" text-anchor="middle" fill="#d1972f" font-size="13" font-weight="bold">Client</text><text x="480" y="32" text-anchor="middle" fill="#3f9c8b" font-size="13" font-weight="bold">Server</text><line x1="140" y1="46" x2="140" y2="300" stroke="#4a453d" stroke-width="1.6" fill="none" stroke-dasharray="2 4"/><line x1="480" y1="46" x2="480" y2="300" stroke="#4a453d" stroke-width="1.6" fill="none" stroke-dasharray="2 4"/><line x1="140" y1="70" x2="480" y2="70" stroke="#d1972f" stroke-width="1.6" fill="none" marker-end="url(#a-ochre)"/><text x="310.0" y="64" text-anchor="middle" fill="#d1972f" font-size="11.5">versions + cipher suites</text><line x1="480" y1="115" x2="140" y2="115" stroke="#3f9c8b" stroke-width="1.6" fill="none" marker-end="url(#a-verd)"/><text x="310.0" y="109" text-anchor="middle" fill="#3f9c8b" font-size="11.5">chosen cipher + certificate</text><path d="M134,152 q-40,10 0,20" fill="none" stroke="#c0603f" stroke-width="1.6" marker-end="url(#a-terra)"/><text x="310.0" y="154" text-anchor="middle" fill="#c0603f" font-size="11.5">verify cert against a trusted CA</text><line x1="140" y1="205" x2="480" y2="205" stroke="#d1972f" stroke-width="1.6" fill="none" marker-end="url(#a-ochre)"/><line x1="480" y1="213" x2="140" y2="213" stroke="#d1972f" stroke-width="1.6" fill="none" marker-end="url(#a-ochre)"/><text x="310.0" y="199" text-anchor="middle" fill="#d1972f" font-size="11.5">ephemeral key agreement (ECDHE)</text><rect x="200.0" y="239" width="220" height="26" rx="13" fill="#151310" stroke="#8aa06a" stroke-width="1.4"/><text x="310.0" y="255" text-anchor="middle" fill="#8aa06a" font-size="11.5" font-weight="bold">encrypted with the session key</text></svg>