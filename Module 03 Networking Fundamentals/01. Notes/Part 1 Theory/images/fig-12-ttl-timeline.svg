<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 210" role="img" aria-label="A four day timeline lowering the DNS TTL before a change and raising it afterward" font-family="Verdana, Geneva, DejaVu Sans, sans-serif"><rect x="0" y="0" width="100%" height="100%" fill="#1c1a17"/><defs><marker id="a-ochre" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#d1972f"/></marker><marker id="a-verd" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#3f9c8b"/></marker><marker id="a-terra" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#c0603f"/></marker><marker id="a-sage" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8aa06a"/></marker><marker id="a-plum" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a6f9c"/></marker><marker id="a-peri" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7f8fc0"/></marker><marker id="a-parch" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e7ddcb"/></marker><marker id="a-faint" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a8f7d"/></marker><marker id="a-rule" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#4a453d"/></marker></defs><line x1="60" y1="150" x2="640" y2="150" stroke="#4a453d" stroke-width="1.4" fill="none"/><path d="M60,70 L100,70 L100,120 L420,120 L580,120 L580,72 L640,72" fill="none" stroke="#d1972f" stroke-width="2"/><text x="70" y="60" text-anchor="start" fill="#d1972f" font-size="11" font-weight="bold">TTL</text><line x1="100" y1="144" x2="100" y2="156" stroke="#d1972f" stroke-width="1.6" fill="none"/><text x="100" y="176" text-anchor="middle" fill="#d1972f" font-size="12" font-weight="bold">Day 1</text><text x="100" y="194" text-anchor="middle" fill="#9a8f7d" font-size="10.5">lower TTL to 60s</text><line x1="260" y1="144" x2="260" y2="156" stroke="#9a8f7d" stroke-width="1.6" fill="none"/><text x="260" y="176" text-anchor="middle" fill="#9a8f7d" font-size="12" font-weight="bold">Day 2</text><text x="260" y="194" text-anchor="middle" fill="#9a8f7d" font-size="10.5">wait out the old TTL</text><line x1="420" y1="144" x2="420" y2="156" stroke="#c0603f" stroke-width="1.6" fill="none"/><text x="420" y="176" text-anchor="middle" fill="#c0603f" font-size="12" font-weight="bold">Day 3</text><text x="420" y="194" text-anchor="middle" fill="#9a8f7d" font-size="10.5">change the record</text><line x1="580" y1="144" x2="580" y2="156" stroke="#8aa06a" stroke-width="1.6" fill="none"/><text x="580" y="176" text-anchor="middle" fill="#8aa06a" font-size="12" font-weight="bold">Day 4</text><text x="580" y="194" text-anchor="middle" fill="#9a8f7d" font-size="10.5">raise TTL back</text></svg>