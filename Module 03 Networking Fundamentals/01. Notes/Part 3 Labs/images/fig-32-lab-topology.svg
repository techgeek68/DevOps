<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 214" role="img" aria-label="Lab topology with two hosts on separate subnets connected through a single router VM" font-family="Verdana, Geneva, DejaVu Sans, sans-serif"><rect x="0" y="0" width="100%" height="100%" fill="#1c1a17"/><defs><marker id="a-ochre" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#d1972f"/></marker><marker id="a-verd" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#3f9c8b"/></marker><marker id="a-terra" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#c0603f"/></marker><marker id="a-sage" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8aa06a"/></marker><marker id="a-plum" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a6f9c"/></marker><marker id="a-peri" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7f8fc0"/></marker><marker id="a-parch" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e7ddcb"/></marker><marker id="a-faint" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a8f7d"/></marker><marker id="a-rule" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#4a453d"/></marker></defs><rect x="40" y="90" width="150" height="70" rx="8" fill="#262320" stroke="#d1972f" stroke-width="1.4"/><text x="115" y="118" text-anchor="middle" fill="#e7ddcb" font-size="14" font-weight="bold">VM-A</text><text x="115" y="140" text-anchor="middle" fill="#d1972f" font-size="10.5" font-family="Consolas, DejaVu Sans Mono, monospace">10.10.1.10/24</text><rect x="285" y="80" width="170" height="90" rx="8" fill="#151310" stroke="#3f9c8b" stroke-width="1.4"/><text x="370" y="108" text-anchor="middle" fill="#e7ddcb" font-size="13" font-weight="bold">VM-R · router</text><text x="370" y="130" text-anchor="middle" fill="#3f9c8b" font-size="10" font-family="Consolas, DejaVu Sans Mono, monospace">10.10.1.1/24</text><text x="370" y="148" text-anchor="middle" fill="#3f9c8b" font-size="10" font-family="Consolas, DejaVu Sans Mono, monospace">10.10.2.1/24</text><rect x="550" y="90" width="150" height="70" rx="8" fill="#262320" stroke="#9a6f9c" stroke-width="1.4"/><text x="625" y="118" text-anchor="middle" fill="#e7ddcb" font-size="14" font-weight="bold">VM-B</text><text x="625" y="140" text-anchor="middle" fill="#9a6f9c" font-size="10.5" font-family="Consolas, DejaVu Sans Mono, monospace">10.10.2.10/24</text><line x1="190" y1="125" x2="283" y2="125" stroke="#d1972f" stroke-width="2" fill="none" marker-end="url(#a-ochre)"/><text x="237" y="116" text-anchor="middle" fill="#9a8f7d" font-size="10">net-1</text><line x1="455" y1="125" x2="548" y2="125" stroke="#9a6f9c" stroke-width="2" fill="none" marker-end="url(#a-plum)"/><text x="502" y="116" text-anchor="middle" fill="#9a8f7d" font-size="10">net-2</text><line x1="283" y1="145" x2="192" y2="145" stroke="#8aa06a" stroke-width="1.6" fill="none" stroke-dasharray="3 3" marker-end="url(#a-sage)"/><line x1="548" y1="145" x2="457" y2="145" stroke="#8aa06a" stroke-width="1.6" fill="none" stroke-dasharray="3 3" marker-end="url(#a-sage)"/><text x="370" y="196" text-anchor="middle" fill="#9a8f7d" font-size="11">the static routes you add on VM-A and VM-B point at VM-R</text></svg>