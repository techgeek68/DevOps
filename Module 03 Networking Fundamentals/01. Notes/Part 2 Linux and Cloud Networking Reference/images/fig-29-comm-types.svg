<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 165" role="img" aria-label="Four panels showing unicast, broadcast, multicast, and anycast delivery" font-family="Verdana, Geneva, DejaVu Sans, sans-serif"><rect x="0" y="0" width="100%" height="100%" fill="#1c1a17"/><defs><marker id="a-ochre" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#d1972f"/></marker><marker id="a-verd" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#3f9c8b"/></marker><marker id="a-terra" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#c0603f"/></marker><marker id="a-sage" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8aa06a"/></marker><marker id="a-plum" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a6f9c"/></marker><marker id="a-peri" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7f8fc0"/></marker><marker id="a-parch" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e7ddcb"/></marker><marker id="a-faint" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a8f7d"/></marker><marker id="a-rule" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#4a453d"/></marker></defs><text x="90" y="28" text-anchor="middle" fill="#d1972f" font-size="12" font-weight="bold">Unicast</text><circle cx="30" cy="90" r="8" fill="#d1972f"/><text x="30" y="114" text-anchor="middle" fill="#9a8f7d" font-size="9.5">source</text><circle cx="150" cy="90" r="8" fill="#3f9c8b"/><line x1="39" y1="90" x2="142" y2="90" stroke="#d1972f" stroke-width="1.6" fill="none" marker-end="url(#a-verd)"/><text x="90" y="132" text-anchor="middle" fill="#9a8f7d" font-size="10">one to one</text><text x="270" y="28" text-anchor="middle" fill="#c0603f" font-size="12" font-weight="bold">Broadcast</text><circle cx="210" cy="90" r="8" fill="#d1972f"/><text x="210" y="114" text-anchor="middle" fill="#9a8f7d" font-size="9.5">source</text><circle cx="330" cy="55" r="8" fill="#3f9c8b"/><line x1="219" y1="90" x2="322" y2="55" stroke="#c0603f" stroke-width="1.6" fill="none" marker-end="url(#a-verd)"/><circle cx="330" cy="90" r="8" fill="#3f9c8b"/><line x1="219" y1="90" x2="322" y2="90" stroke="#c0603f" stroke-width="1.6" fill="none" marker-end="url(#a-verd)"/><circle cx="330" cy="125" r="8" fill="#3f9c8b"/><line x1="219" y1="90" x2="322" y2="125" stroke="#c0603f" stroke-width="1.6" fill="none" marker-end="url(#a-verd)"/><text x="270" y="150" text-anchor="middle" fill="#9a8f7d" font-size="10">one to all</text><text x="450" y="28" text-anchor="middle" fill="#3f9c8b" font-size="12" font-weight="bold">Multicast</text><circle cx="390" cy="90" r="8" fill="#d1972f"/><text x="390" y="114" text-anchor="middle" fill="#9a8f7d" font-size="9.5">source</text><circle cx="510" cy="60" r="8" fill="#3f9c8b"/><line x1="399" y1="90" x2="502" y2="60" stroke="#3f9c8b" stroke-width="1.6" fill="none" marker-end="url(#a-verd)"/><circle cx="510" cy="120" r="8" fill="#3f9c8b"/><line x1="399" y1="90" x2="502" y2="120" stroke="#3f9c8b" stroke-width="1.6" fill="none" marker-end="url(#a-verd)"/><circle cx="510" cy="90" r="8" fill="#4a453d"/><text x="450" y="150" text-anchor="middle" fill="#9a8f7d" font-size="10">one to a group</text><text x="630" y="28" text-anchor="middle" fill="#9a6f9c" font-size="12" font-weight="bold">Anycast</text><circle cx="570" cy="90" r="8" fill="#d1972f"/><text x="570" y="114" text-anchor="middle" fill="#9a8f7d" font-size="9.5">source</text><circle cx="690" cy="70" r="8" fill="#3f9c8b"/><circle cx="690" cy="110" r="8" fill="#4a453d"/><line x1="579" y1="90" x2="682" y2="72" stroke="#9a6f9c" stroke-width="1.6" fill="none" marker-end="url(#a-verd)"/><text x="630" y="150" text-anchor="middle" fill="#9a8f7d" font-size="10">one to the nearest</text></svg>