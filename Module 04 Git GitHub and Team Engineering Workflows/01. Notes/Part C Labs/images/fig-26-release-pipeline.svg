<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 200" role="img" aria-label="The Lab 4C pipeline from a conventional commit through checks and merge to an automated release" font-family="Verdana, Geneva, DejaVu Sans, sans-serif"><rect x="0" y="0" width="100%" height="100%" fill="#1c1a17"/><defs><marker id="a-ochre" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#d1972f"/></marker><marker id="a-verd" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#3f9c8b"/></marker><marker id="a-terra" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#c0603f"/></marker><marker id="a-sage" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8aa06a"/></marker><marker id="a-plum" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a6f9c"/></marker><marker id="a-peri" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7f8fc0"/></marker><marker id="a-parch" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e7ddcb"/></marker><marker id="a-faint" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a8f7d"/></marker><marker id="a-rule" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#4a453d"/></marker></defs><rect x="20" y="90" width="78" height="50" rx="8" fill="#262320" stroke="#d1972f" stroke-width="1.4"/><text x="59.0" y="112" text-anchor="middle" fill="#e7ddcb" font-size="10" font-weight="bold">conventional</text><text x="59.0" y="127" text-anchor="middle" fill="#e7ddcb" font-size="10" font-weight="bold">commit</text><line x1="98" y1="115" x2="106" y2="115" stroke="#4a453d" stroke-width="1.3" fill="none" marker-end="url(#a-faint)"/><rect x="106" y="90" width="78" height="50" rx="8" fill="#262320" stroke="#3f9c8b" stroke-width="1.4"/><text x="145.0" y="120" text-anchor="middle" fill="#e7ddcb" font-size="10" font-weight="bold">pre-commit</text><line x1="184" y1="115" x2="192" y2="115" stroke="#4a453d" stroke-width="1.3" fill="none" marker-end="url(#a-faint)"/><rect x="192" y="90" width="78" height="50" rx="8" fill="#262320" stroke="#7f8fc0" stroke-width="1.4"/><text x="231.0" y="120" text-anchor="middle" fill="#e7ddcb" font-size="10" font-weight="bold">pull request</text><line x1="270" y1="115" x2="278" y2="115" stroke="#4a453d" stroke-width="1.3" fill="none" marker-end="url(#a-faint)"/><rect x="278" y="90" width="78" height="50" rx="8" fill="#262320" stroke="#9a6f9c" stroke-width="1.4"/><text x="317.0" y="120" text-anchor="middle" fill="#e7ddcb" font-size="10" font-weight="bold">CI + ruleset</text><line x1="356" y1="115" x2="364" y2="115" stroke="#4a453d" stroke-width="1.3" fill="none" marker-end="url(#a-faint)"/><rect x="364" y="90" width="78" height="50" rx="8" fill="#262320" stroke="#8aa06a" stroke-width="1.4"/><text x="403.0" y="120" text-anchor="middle" fill="#e7ddcb" font-size="10" font-weight="bold">merge</text><line x1="442" y1="115" x2="450" y2="115" stroke="#4a453d" stroke-width="1.3" fill="none" marker-end="url(#a-faint)"/><rect x="450" y="90" width="78" height="50" rx="8" fill="#262320" stroke="#d1972f" stroke-width="1.4"/><text x="489.0" y="120" text-anchor="middle" fill="#e7ddcb" font-size="10" font-weight="bold">release-please</text><line x1="528" y1="115" x2="536" y2="115" stroke="#4a453d" stroke-width="1.3" fill="none" marker-end="url(#a-faint)"/><rect x="536" y="90" width="78" height="50" rx="8" fill="#262320" stroke="#3f9c8b" stroke-width="1.4"/><text x="575.0" y="120" text-anchor="middle" fill="#e7ddcb" font-size="10" font-weight="bold">Release PR</text><line x1="614" y1="115" x2="622" y2="115" stroke="#4a453d" stroke-width="1.3" fill="none" marker-end="url(#a-faint)"/><rect x="622" y="90" width="78" height="50" rx="8" fill="#262320" stroke="#c0603f" stroke-width="1.4"/><text x="661.0" y="120" text-anchor="middle" fill="#e7ddcb" font-size="10" font-weight="bold">tag + release</text><text x="350" y="68" text-anchor="middle" fill="#9a8f7d" font-size="11">one conventional commit sets the whole pipeline in motion</text><text x="350" y="174" text-anchor="middle" fill="#9a8f7d" font-size="10.5">nobody types a version number, writes a changelog, or remembers to tag</text></svg>