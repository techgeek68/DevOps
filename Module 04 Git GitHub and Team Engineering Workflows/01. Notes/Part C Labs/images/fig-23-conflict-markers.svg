<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 292" role="img" aria-label="The anatomy of a Git merge conflict block with its three marker lines labelled" font-family="Verdana, Geneva, DejaVu Sans, sans-serif"><rect x="0" y="0" width="100%" height="100%" fill="#1c1a17"/><defs><marker id="a-ochre" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#d1972f"/></marker><marker id="a-verd" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#3f9c8b"/></marker><marker id="a-terra" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#c0603f"/></marker><marker id="a-sage" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8aa06a"/></marker><marker id="a-plum" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a6f9c"/></marker><marker id="a-peri" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7f8fc0"/></marker><marker id="a-parch" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e7ddcb"/></marker><marker id="a-faint" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a8f7d"/></marker><marker id="a-rule" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#4a453d"/></marker></defs><rect x="60" y="60" width="360" height="30" rx="8" fill="#151310" stroke="#4a453d" stroke-width="1.4"/><text x="74" y="81" text-anchor="start" fill="#c0603f" font-size="12" font-family="Consolas, DejaVu Sans Mono, monospace">&lt;&lt;&lt;&lt;&lt;&lt;&lt; HEAD</text><text x="440" y="81" text-anchor="start" fill="#c0603f" font-size="10.5">the branch you are on</text><rect x="60" y="100" width="360" height="30" rx="8" fill="#151310" stroke="#4a453d" stroke-width="1.4"/><text x="74" y="121" text-anchor="start" fill="#e7ddcb" font-size="12" font-family="Consolas, DejaVu Sans Mono, monospace">| Pro  | 15    |</text><text x="440" y="121" text-anchor="start" fill="#9a8f7d" font-size="10.5">your side</text><rect x="60" y="140" width="360" height="30" rx="8" fill="#151310" stroke="#4a453d" stroke-width="1.4"/><text x="74" y="161" text-anchor="start" fill="#9a8f7d" font-size="12" font-family="Consolas, DejaVu Sans Mono, monospace">=======</text><text x="440" y="161" text-anchor="start" fill="#9a8f7d" font-size="10.5">the divider</text><rect x="60" y="180" width="360" height="30" rx="8" fill="#151310" stroke="#4a453d" stroke-width="1.4"/><text x="74" y="201" text-anchor="start" fill="#e7ddcb" font-size="12" font-family="Consolas, DejaVu Sans Mono, monospace">| Pro  | 12    |</text><text x="440" y="201" text-anchor="start" fill="#9a8f7d" font-size="10.5">their side</text><rect x="60" y="220" width="360" height="30" rx="8" fill="#151310" stroke="#4a453d" stroke-width="1.4"/><text x="74" y="241" text-anchor="start" fill="#3f9c8b" font-size="12" font-family="Consolas, DejaVu Sans Mono, monospace">&gt;&gt;&gt;&gt;&gt;&gt;&gt; feat: raise Pro to 12</text><text x="440" y="241" text-anchor="start" fill="#3f9c8b" font-size="10.5">which commit brought it</text><text x="350" y="270" text-anchor="middle" fill="#9a8f7d" font-size="10.5">delete all three marker lines, keep the content you want, then stage the file</text></svg>