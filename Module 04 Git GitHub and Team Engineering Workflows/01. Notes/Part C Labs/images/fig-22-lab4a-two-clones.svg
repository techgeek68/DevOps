<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-label="Two clones editing the same line from different bases, causing a rejected push and a conflict" font-family="Verdana, Geneva, DejaVu Sans, sans-serif"><rect x="0" y="0" width="100%" height="100%" fill="#1c1a17"/><defs><marker id="a-ochre" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#d1972f"/></marker><marker id="a-verd" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#3f9c8b"/></marker><marker id="a-terra" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#c0603f"/></marker><marker id="a-sage" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8aa06a"/></marker><marker id="a-plum" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a6f9c"/></marker><marker id="a-peri" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7f8fc0"/></marker><marker id="a-parch" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e7ddcb"/></marker><marker id="a-faint" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a8f7d"/></marker><marker id="a-rule" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#4a453d"/></marker></defs><rect x="270" y="30" width="180" height="54" rx="8" fill="#151310" stroke="#7f8fc0" stroke-width="1.4"/><text x="360" y="58" text-anchor="middle" fill="#e7ddcb" font-size="13" font-weight="bold">remote</text><text x="360" y="76" text-anchor="middle" fill="#9a8f7d" font-size="9.5">Pro = 10 at the start</text><rect x="40" y="150" width="220" height="80" rx="8" fill="#262320" stroke="#d1972f" stroke-width="1.4"/><text x="150" y="176" text-anchor="middle" fill="#d1972f" font-size="12" font-weight="bold">Alice's clone</text><text x="150" y="198" text-anchor="middle" fill="#e7ddcb" font-size="11">edits Pro to 12</text><text x="150" y="216" text-anchor="middle" fill="#9a8f7d" font-size="9.5">pulled, up to date</text><rect x="460" y="150" width="220" height="80" rx="8" fill="#262320" stroke="#9a6f9c" stroke-width="1.4"/><text x="570" y="176" text-anchor="middle" fill="#9a6f9c" font-size="12" font-weight="bold">Bob's clone</text><text x="570" y="198" text-anchor="middle" fill="#e7ddcb" font-size="11">edits Pro to 15</text><text x="570" y="216" text-anchor="middle" fill="#9a8f7d" font-size="9.5">never pulled, stale base</text><line x1="150" y1="148" x2="320" y2="86" stroke="#d1972f" stroke-width="1.8" fill="none" marker-end="url(#a-ochre)"/><text x="200" y="110" text-anchor="middle" fill="#d1972f" font-size="9.5">pushes first</text><line x1="460" y1="190" x2="410" y2="86" stroke="#c0603f" stroke-width="1.8" fill="none" stroke-dasharray="4 3" marker-end="url(#a-terra)"/><text x="455" y="120" text-anchor="start" fill="#c0603f" font-size="9.5">push rejected</text><circle cx="360" cy="120" r="10" fill="#c0603f"/><text x="360" y="124" text-anchor="middle" fill="#1c1a17" font-size="12" font-weight="bold">!</text><text x="360" y="258" text-anchor="middle" fill="#9a8f7d" font-size="10.5">two edits to the same line from different bases: that is every conflict you will ever have</text></svg>