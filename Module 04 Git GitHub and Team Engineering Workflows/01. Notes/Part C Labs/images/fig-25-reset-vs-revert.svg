<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 276" role="img" aria-label="Revert adding an inverse commit on the left versus reset orphaning a commit on the right" font-family="Verdana, Geneva, DejaVu Sans, sans-serif"><rect x="0" y="0" width="100%" height="100%" fill="#1c1a17"/><defs><marker id="a-ochre" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#d1972f"/></marker><marker id="a-verd" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#3f9c8b"/></marker><marker id="a-terra" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#c0603f"/></marker><marker id="a-sage" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8aa06a"/></marker><marker id="a-plum" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a6f9c"/></marker><marker id="a-peri" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7f8fc0"/></marker><marker id="a-parch" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e7ddcb"/></marker><marker id="a-faint" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a8f7d"/></marker><marker id="a-rule" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#4a453d"/></marker></defs><rect x="30" y="40" width="320" height="220" rx="12" fill="#151310" stroke="#8aa06a" stroke-width="1.4"/><text x="190" y="66" text-anchor="middle" fill="#8aa06a" font-size="13" font-weight="bold">revert · safe on shared</text><line x1="60" y1="130" x2="300" y2="130" stroke="#d1972f" stroke-width="2" fill="none"/><circle cx="80" cy="130" r="8" fill="#d1972f"/><circle cx="150" cy="130" r="8" fill="#d1972f"/><circle cx="220" cy="130" r="8" fill="#d1972f"/><circle cx="285" cy="130" r="9" fill="#8aa06a"/><text x="285" y="114" text-anchor="middle" fill="#8aa06a" font-size="9">inverse</text><text x="190" y="170" text-anchor="middle" fill="#e7ddcb" font-size="10.5">the bad commit stays in history</text><text x="190" y="190" text-anchor="middle" fill="#e7ddcb" font-size="10.5">a new commit undoes it</text><text x="190" y="222" text-anchor="middle" fill="#8aa06a" font-size="11" font-weight="bold">push is a fast forward</text><rect x="380" y="40" width="320" height="220" rx="12" fill="#151310" stroke="#c0603f" stroke-width="1.4"/><text x="540" y="66" text-anchor="middle" fill="#c0603f" font-size="13" font-weight="bold">reset · rewrites history</text><line x1="410" y1="130" x2="600" y2="130" stroke="#d1972f" stroke-width="2" fill="none"/><circle cx="430" cy="130" r="8" fill="#d1972f"/><circle cx="500" cy="130" r="8" fill="#d1972f"/><circle cx="570" cy="130" r="8" fill="#d1972f"/><circle cx="640" cy="130" r="8" fill="#4a453d"/><line x1="570" y1="130" x2="640" y2="130" stroke="#4a453d" stroke-width="1.6" fill="none" stroke-dasharray="3 3"/><text x="640" y="114" text-anchor="middle" fill="#9a8f7d" font-size="9">orphaned</text><line x1="570" y1="130" x2="570" y2="100" stroke="#c0603f" stroke-width="1.5" fill="none" marker-end="url(#a-terra)"/><text x="575" y="96" text-anchor="start" fill="#c0603f" font-size="9">pointer moved back</text><text x="540" y="190" text-anchor="middle" fill="#e7ddcb" font-size="10.5">the commit is orphaned, not undone</text><text x="540" y="222" text-anchor="middle" fill="#c0603f" font-size="11" font-weight="bold">push needs --force</text></svg>