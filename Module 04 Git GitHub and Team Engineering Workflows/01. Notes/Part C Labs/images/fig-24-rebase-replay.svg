="150" stroke="#4a453d" stroke-width="1.6" fill="none" stroke-dasharray="3 3"/><circle cx="200" cy="150" r="8" fill="#4a453d"/><circle cx="270" cy="150" r="8" fill="#4a453d"/><line x1="200" y1="150" x2="270" y2="150" stroke="#4a453d" stroke-width="1.6" fill="none" stroke-dasharray="3 3"/><text x="235" y="172" text-anchor="middle" fill="#9a8f7d" font-size="9.5" font-family="Consolas, DejaVu Sans Mono, monospace">originals, abandoned  a1b2</text><line x1="300" y1="90" x2="380" y2="90" stroke="#c0603f" stroke-width="2" fill="none"/><line x1="380" y1="90" x2="460" y2="90" stroke="#c0603f" stroke-width="2" fill="none"/><circle cx="380" cy="90" r="8" fill="#c0603f"/><circle cx="460" cy="90" r="8" fill="#c0603f"/><text x="420" y="74" text-anchor="middle" fill="#c0603f" font-size="9.5" font-family="Consolas, DejaVu Sans Mono, monospace">replayed  9c8d</text><text x="360" y="220" text-anchor="middle" fill="#9a8f7d" font-size="10.5">git rebase main copies your commits onto the new tip with new SHAs; the old ones are left behind</text></svg>