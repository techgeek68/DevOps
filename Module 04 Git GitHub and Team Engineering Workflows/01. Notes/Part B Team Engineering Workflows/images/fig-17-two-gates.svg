<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 220" role="img" aria-label="A commit passing a bypassable local hook gate and then an authoritative CI gate" font-family="Verdana, Geneva, DejaVu Sans, sans-serif"><rect x="0" y="0" width="100%" height="100%" fill="#1c1a17"/><defs><marker id="a-ochre" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#d1972f"/></marker><marker id="a-verd" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#3f9c8b"/></marker><marker id="a-terra" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#c0603f"/></marker><marker id="a-sage" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8aa06a"/></marker><marker id="a-plum" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a6f9c"/></marker><marker id="a-peri" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7f8fc0"/></marker><marker id="a-parch" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e7ddcb"/></marker><marker id="a-faint" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a8f7d"/></marker><marker id="a-rule" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#4a453d"/></marker></defs><rect x="30" y="90" width="110" height="50" rx="8" fill="#262320" stroke="#d1972f" stroke-width="1.4"/><text x="85" y="120" text-anchor="middle" fill="#e7ddcb" font-size="11.5" font-weight="bold">your commit</text><rect x="230" y="70" width="120" height="90" rx="10" fill="#151310" stroke="#3f9c8b" stroke-width="1.4"/><text x="290" y="58" text-anchor="middle" fill="#3f9c8b" font-size="11.5" font-weight="bold">pre-commit hook</text><text x="290" y="100" text-anchor="middle" fill="#e7ddcb" font-size="10">fast, on the laptop</text><text x="290" y="120" text-anchor="middle" fill="#9a8f7d" font-size="9.5">skippable with</text><text x="290" y="136" text-anchor="middle" fill="#c0603f" font-size="10" font-family="Consolas, DejaVu Sans Mono, monospace">--no-verify</text><rect x="450" y="70" width="120" height="90" rx="10" fill="#151310" stroke="#9a6f9c" stroke-width="1.4"/><text x="510" y="58" text-anchor="middle" fill="#9a6f9c" font-size="11.5" font-weight="bold">CI check</text><text x="510" y="100" text-anchor="middle" fill="#e7ddcb" font-size="10">in the pipeline</text><text x="510" y="120" text-anchor="middle" fill="#9a8f7d" font-size="9.5">the authority,</text><text x="510" y="136" text-anchor="middle" fill="#8aa06a" font-size="10">cannot be skipped</text><rect x="640" y="90" width="110" height="50" rx="8" fill="#262320" stroke="#8aa06a" stroke-width="1.4"/><text x="695" y="120" text-anchor="middle" fill="#e7ddcb" font-size="11.5" font-weight="bold">merged</text><line x1="140" y1="115" x2="228" y2="115" stroke="#d1972f" stroke-width="1.6" fill="none" marker-end="url(#a-ochre)"/><line x1="350" y1="115" x2="448" y2="115" stroke="#d1972f" stroke-width="1.6" fill="none" marker-end="url(#a-ochre)"/><line x1="570" y1="115" x2="638" y2="115" stroke="#d1972f" stroke-width="1.6" fill="none" marker-end="url(#a-ochre)"/><text x="390" y="200" text-anchor="middle" fill="#9a8f7d" font-size="10.5">run the same checks twice: locally for speed, in CI for authority</text></svg>