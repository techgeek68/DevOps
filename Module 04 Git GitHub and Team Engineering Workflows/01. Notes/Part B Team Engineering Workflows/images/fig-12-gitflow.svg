<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 306" role="img" aria-label="The Git Flow model with main, develop, feature, and release lanes" font-family="Verdana, Geneva, DejaVu Sans, sans-serif"><rect x="0" y="0" width="100%" height="100%" fill="#1c1a17"/><defs><marker id="a-ochre" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#d1972f"/></marker><marker id="a-verd" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#3f9c8b"/></marker><marker id="a-terra" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#c0603f"/></marker><marker id="a-sage" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8aa06a"/></marker><marker id="a-plum" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a6f9c"/></marker><marker id="a-peri" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7f8fc0"/></marker><marker id="a-parch" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e7ddcb"/></marker><marker id="a-faint" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a8f7d"/></marker><marker id="a-rule" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#4a453d"/></marker></defs><line x1="60" y1="70" x2="640" y2="70" stroke="#d1972f" stroke-width="1.6" fill="none" stroke-dasharray="1 0"/><text x="52" y="74" text-anchor="end" fill="#d1972f" font-size="11" font-weight="bold">main</text><line x1="60" y1="130" x2="640" y2="130" stroke="#c0603f" stroke-width="1.6" fill="none" stroke-dasharray="1 0"/><text x="52" y="134" text-anchor="end" fill="#c0603f" font-size="11" font-weight="bold">release</text><line x1="60" y1="190" x2="640" y2="190" stroke="#3f9c8b" stroke-width="1.6" fill="none" stroke-dasharray="1 0"/><text x="52" y="194" text-anchor="end" fill="#3f9c8b" font-size="11" font-weight="bold">develop</text><line x1="60" y1="250" x2="640" y2="250" stroke="#9a6f9c" stroke-width="1.6" fill="none" stroke-dasharray="1 0"/><text x="52" y="254" text-anchor="end" fill="#9a6f9c" font-size="11" font-weight="bold">feature</text><circle cx="110" cy="190" r="8" fill="#3f9c8b"/><circle cx="200" cy="190" r="8" fill="#3f9c8b"/><circle cx="300" cy="190" r="8" fill="#3f9c8b"/><circle cx="420" cy="190" r="8" fill="#3f9c8b"/><circle cx="520" cy="190" r="8" fill="#3f9c8b"/><line x1="200" y1="190" x2="260" y2="250" stroke="#9a6f9c" stroke-width="1.6" fill="none"/><line x1="260" y1="250" x2="340" y2="250" stroke="#9a6f9c" stroke-width="1.6" fill="none"/><line x1="340" y1="250" x2="420" y2="190" stroke="#9a6f9c" stroke-width="1.6" fill="none"/><circle cx="260" cy="250" r="8" fill="#9a6f9c"/><circle cx="340" cy="250" r="8" fill="#9a6f9c"/><line x1="420" y1="190" x2="470" y2="130" stroke="#c0603f" stroke-width="1.6" fill="none"/><line x1="470" y1="130" x2="540" y2="130" stroke="#c0603f" stroke-width="1.6" fill="none"/><circle cx="470" cy="130" r="8" fill="#c0603f"/><circle cx="540" cy="130" r="8" fill="#c0603f"/><line x1="540" y1="130" x2="590" y2="70" stroke="#c0603f" stroke-width="1.6" fill="none"/><line x1="540" y1="130" x2="590" y2="190" stroke="#c0603f" stroke-width="1.6" fill="none" stroke-dasharray="3 3"/><circle cx="110" cy="70" r="9" fill="#d1972f"/><circle cx="590" cy="70" r="9" fill="#d1972f"/><text x="110" y="58" text-anchor="middle" fill="#d1972f" font-size="9">v1.0</text><text x="590" y="58" text-anchor="middle" fill="#d1972f" font-size="9">v1.1</text><text x="350" y="290" text-anchor="middle" fill="#9a8f7d" font-size="10">two permanent lanes, main and develop, with feature, release, and hotfix branches passing through</text></svg>