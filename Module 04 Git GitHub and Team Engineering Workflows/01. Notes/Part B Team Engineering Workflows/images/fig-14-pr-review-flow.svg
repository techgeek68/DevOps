dth="1.4"/><text x="360" y="84" text-anchor="middle" fill="#7f8fc0" font-size="13" font-weight="bold">pull request</text><text x="360" y="108" text-anchor="middle" fill="#e7ddcb" font-size="11">status checks</text><text x="360" y="130" text-anchor="middle" fill="#e7ddcb" font-size="11">reviewer approval</text><text x="360" y="152" text-anchor="middle" fill="#e7ddcb" font-size="11">branch protection</text><rect x="560" y="90" width="120" height="54" rx="8" fill="#262320" stroke="#d1972f" stroke-width="1.4"/><text x="620" y="114" text-anchor="middle" fill="#e7ddcb" font-size="12" font-weight="bold">main</text><text x="620" y="132" text-anchor="middle" fill="#9a8f7d" font-size="10">deployable</text><line x1="160" y1="117" x2="248" y2="117" stroke="#3f9c8b" stroke-width="1.6" fill="none" marker-end="url(#a-verd)"/><line x1="470" y1="117" x2="558" y2="117" stroke="#d1972f" stroke-width="1.6" fill="none" marker-end="url(#a-ochre)"/><text x="514" y="108" text-anchor="middle" fill="#d1972f" font-size="10" font-family="Consolas, DejaVu Sans Mono, monospace">merge</text><text x="360" y="206" text-anchor="middle" fill="#9a8f7d" font-size="10.5">the PR is a platform wrapper around an ordinary merge, plus review and policy</text></svg>