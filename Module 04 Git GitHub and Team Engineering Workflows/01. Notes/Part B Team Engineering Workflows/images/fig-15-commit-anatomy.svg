<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 262" role="img" aria-label="A conventional commit message labelled with its type, scope, breaking marker, and description" font-family="Verdana, Geneva, DejaVu Sans, sans-serif"><rect x="0" y="0" width="100%" height="100%" fill="#1c1a17"/><defs><marker id="a-ochre" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#d1972f"/></marker><marker id="a-verd" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#3f9c8b"/></marker><marker id="a-terra" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#c0603f"/></marker><marker id="a-sage" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8aa06a"/></marker><marker id="a-plum" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a6f9c"/></marker><marker id="a-peri" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7f8fc0"/></marker><marker id="a-parch" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e7ddcb"/></marker><marker id="a-faint" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a8f7d"/></marker><marker id="a-rule" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#4a453d"/></marker></defs><rect x="60" y="70" width="580" height="40" rx="8" fill="#151310" stroke="#4a453d" stroke-width="1.4"/><text x="80" y="96" text-anchor="start" fill="#d1972f" font-size="15" font-weight="bold" font-family="Consolas, DejaVu Sans Mono, monospace">feat</text><text x="128" y="96" text-anchor="start" fill="#3f9c8b" font-size="15" font-family="Consolas, DejaVu Sans Mono, monospace">(auth)</text><text x="198" y="96" text-anchor="start" fill="#c0603f" font-size="15" font-weight="bold" font-family="Consolas, DejaVu Sans Mono, monospace">!</text><text x="210" y="96" text-anchor="start" fill="#e7ddcb" font-size="15" font-family="Consolas, DejaVu Sans Mono, monospace">: add TOTP second factor</text><line x1="92" y1="112" x2="92" y2="132" stroke="#d1972f" stroke-width="1" fill="none"/><text x="92" y="146" text-anchor="middle" fill="#d1972f" font-size="10" font-weight="bold">type</text><line x1="150" y1="112" x2="150" y2="132" stroke="#3f9c8b" stroke-width="1" fill="none"/><text x="150" y="146" text-anchor="middle" fill="#3f9c8b" font-size="10" font-weight="bold">scope</text><line x1="200" y1="112" x2="200" y2="132" stroke="#c0603f" stroke-width="1" fill="none"/><text x="200" y="146" text-anchor="middle" fill="#c0603f" font-size="10" font-weight="bold">breaking</text><line x1="360" y1="112" x2="360" y2="132" stroke="#9a8f7d" stroke-width="1" fill="none"/><text x="360" y="146" text-anchor="middle" fill="#9a8f7d" font-size="10" font-weight="bold">description</text><rect x="60" y="170" width="580" height="44" rx="8" fill="#151310" stroke="#4a453d" stroke-width="1.4"/><text x="80" y="190" text-anchor="start" fill="#9a8f7d" font-size="11">body: explains why, wrapped at the usual width</text><text x="80" y="206" text-anchor="start" fill="#9a8f7d" font-size="11" font-family="Consolas, DejaVu Sans Mono, monospace">footer: Refs: #142   or   BREAKING CHANGE: ...</text><text x="350" y="244" text-anchor="middle" fill="#9a8f7d" font-size="10.5">the type and the breaking marker are read by machines, not just people</text></svg>