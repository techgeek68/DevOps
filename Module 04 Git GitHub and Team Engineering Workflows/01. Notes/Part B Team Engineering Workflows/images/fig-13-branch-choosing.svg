<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" role="img" aria-label="A comparison of branching models by typical branch lifetime, from trunk based to Git Flow" font-family="Verdana, Geneva, DejaVu Sans, sans-serif"><rect x="0" y="0" width="100%" height="100%" fill="#1c1a17"/><defs><marker id="a-ochre" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#d1972f"/></marker><marker id="a-verd" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#3f9c8b"/></marker><marker id="a-terra" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#c0603f"/></marker><marker id="a-sage" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8aa06a"/></marker><marker id="a-plum" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a6f9c"/></marker><marker id="a-peri" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7f8fc0"/></marker><marker id="a-parch" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e7ddcb"/></marker><marker id="a-faint" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a8f7d"/></marker><marker id="a-rule" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#4a453d"/></marker></defs><text x="350" y="28" text-anchor="middle" fill="#9a8f7d" font-size="11">branch lifetime drives merge pain</text><text x="156" y="74" text-anchor="end" fill="#8aa06a" font-size="11.5" font-weight="bold">Trunk based</text><rect x="170" y="60" width="120" height="24" rx="5" fill="#262320" stroke="#8aa06a" stroke-width="1.4"/><text x="300" y="76" text-anchor="start" fill="#9a8f7d" font-size="10.5">hours</text><text x="156" y="116" text-anchor="end" fill="#3f9c8b" font-size="11.5" font-weight="bold">GitHub Flow</text><rect x="170" y="102" width="210" height="24" rx="5" fill="#262320" stroke="#3f9c8b" stroke-width="1.4"/><text x="390" y="118" text-anchor="start" fill="#9a8f7d" font-size="10.5">1 to 3 days</text><text x="156" y="158" text-anchor="end" fill="#d1972f" font-size="11.5" font-weight="bold">Feature branch</text><rect x="170" y="144" width="340" height="24" rx="5" fill="#262320" stroke="#d1972f" stroke-width="1.4"/><text x="520" y="160" text-anchor="start" fill="#9a8f7d" font-size="10.5">varies</text><text x="156" y="200" text-anchor="end" fill="#c0603f" font-size="11.5" font-weight="bold">Git Flow</text><rect x="170" y="186" width="560" height="24" rx="5" fill="#262320" stroke="#c0603f" stroke-width="1.4"/><text x="740" y="202" text-anchor="start" fill="#9a8f7d" font-size="10.5">weeks</text><text x="350" y="236" text-anchor="middle" fill="#9a8f7d" font-size="10.5">shorter lived branches conflict less, so shrink the lifetime and the rest follows</text></svg>