<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" role="img" aria-label="The Git object model: commit to tree to blobs, with the commit linked to its parent" font-family="Verdana, Geneva, DejaVu Sans, sans-serif"><rect x="0" y="0" width="100%" height="100%" fill="#1c1a17"/><defs><marker id="a-ochre" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#d1972f"/></marker><marker id="a-verd" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#3f9c8b"/></marker><marker id="a-terra" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#c0603f"/></marker><marker id="a-sage" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8aa06a"/></marker><marker id="a-plum" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a6f9c"/></marker><marker id="a-peri" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7f8fc0"/></marker><marker id="a-parch" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e7ddcb"/></marker><marker id="a-faint" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a8f7d"/></marker><marker id="a-rule" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#4a453d"/></marker></defs><rect x="60" y="40" width="150" height="54" rx="8" fill="#262320" stroke="#d1972f" stroke-width="1.4"/><text x="135" y="64" text-anchor="middle" fill="#d1972f" font-size="13" font-weight="bold">commit</text><text x="135" y="82" text-anchor="middle" fill="#9a8f7d" font-size="10" font-family="Consolas, DejaVu Sans Mono, monospace">a1b2c3</text><rect x="60" y="150" width="150" height="54" rx="8" fill="#262320" stroke="#4a453d" stroke-width="1.4"/><text x="135" y="174" text-anchor="middle" fill="#9a8f7d" font-size="11">parent commit</text><text x="135" y="192" text-anchor="middle" fill="#9a8f7d" font-size="10" font-family="Consolas, DejaVu Sans Mono, monospace">9f8e7d</text><line x1="135" y1="94" x2="135" y2="148" stroke="#d1972f" stroke-width="1.6" fill="none" marker-end="url(#a-ochre)"/><text x="150" y="124" text-anchor="start" fill="#9a8f7d" font-size="9">parent</text><rect x="300" y="40" width="150" height="54" rx="8" fill="#262320" stroke="#3f9c8b" stroke-width="1.4"/><text x="375" y="64" text-anchor="middle" fill="#3f9c8b" font-size="13" font-weight="bold">tree</text><text x="375" y="82" text-anchor="middle" fill="#9a8f7d" font-size="9.5">directory listing</text><line x1="210" y1="67" x2="298" y2="67" stroke="#3f9c8b" stroke-width="1.6" fill="none" marker-end="url(#a-verd)"/><text x="254" y="58" text-anchor="middle" fill="#9a8f7d" font-size="9">tree</text><rect x="540" y="40" width="150" height="44" rx="8" fill="#262320" stroke="#9a6f9c" stroke-width="1.4"/><text x="615" y="67" text-anchor="middle" fill="#e7ddcb" font-size="10.5" font-family="Consolas, DejaVu Sans Mono, monospace">blob · README</text><line x1="450" y1="67" x2="538" y2="62" stroke="#9a6f9c" stroke-width="1.6" fill="none" stroke-dasharray="3 3" marker-end="url(#a-plum)"/><rect x="540" y="110" width="150" height="44" rx="8" fill="#262320" stroke="#9a6f9c" stroke-width="1.4"/><text x="615" y="137" text-anchor="middle" fill="#e7ddcb" font-size="10.5" font-family="Consolas, DejaVu Sans Mono, monospace">blob · index.js</text><line x1="450" y1="67" x2="538" y2="132" stroke="#9a6f9c" stroke-width="1.6" fill="none" stroke-dasharray="3 3" marker-end="url(#a-plum)"/><rect x="540" y="180" width="150" height="44" rx="8" fill="#262320" stroke="#9a6f9c" stroke-width="1.4"/><text x="615" y="207" text-anchor="middle" fill="#e7ddcb" font-size="10.5" font-family="Consolas, DejaVu Sans Mono, monospace">blob · style.css</text><line x1="450" y1="67" x2="538" y2="202" stroke="#9a6f9c" stroke-width="1.6" fill="none" stroke-dasharray="3 3" marker-end="url(#a-plum)"/><text x="375" y="230" text-anchor="middle" fill="#9a8f7d" font-size="10">a commit points at one tree, the tree points at the file blobs, and every object is named by the SHA of its content</text></svg>