<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 200" role="img" aria-label="The traceability chain linking an epic through story, branch, commit, PR, merge, release, and deploy" font-family="Verdana, Geneva, DejaVu Sans, sans-serif"><rect x="0" y="0" width="100%" height="100%" fill="#1c1a17"/><defs><marker id="a-ochre" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#d1972f"/></marker><marker id="a-verd" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#3f9c8b"/></marker><marker id="a-terra" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#c0603f"/></marker><marker id="a-sage" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8aa06a"/></marker><marker id="a-plum" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a6f9c"/></marker><marker id="a-peri" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7f8fc0"/></marker><marker id="a-parch" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e7ddcb"/></marker><marker id="a-faint" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a8f7d"/></marker><marker id="a-rule" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#4a453d"/></marker></defs><rect x="24" y="90" width="72" height="44" rx="8" fill="#262320" stroke="#d1972f" stroke-width="1.4"/><text x="60.0" y="117" text-anchor="middle" fill="#e7ddcb" font-size="11" font-weight="bold">Epic</text><line x1="96" y1="112" x2="108" y2="112" stroke="#4a453d" stroke-width="1.4" fill="none" marker-end="url(#a-faint)"/><rect x="108" y="90" width="72" height="44" rx="8" fill="#262320" stroke="#3f9c8b" stroke-width="1.4"/><text x="144.0" y="117" text-anchor="middle" fill="#e7ddcb" font-size="11" font-weight="bold">Story</text><line x1="180" y1="112" x2="192" y2="112" stroke="#4a453d" stroke-width="1.4" fill="none" marker-end="url(#a-faint)"/><rect x="192" y="90" width="72" height="44" rx="8" fill="#262320" stroke="#7f8fc0" stroke-width="1.4"/><text x="228.0" y="117" text-anchor="middle" fill="#e7ddcb" font-size="11" font-weight="bold">branch</text><line x1="264" y1="112" x2="276" y2="112" stroke="#4a453d" stroke-width="1.4" fill="none" marker-end="url(#a-faint)"/><rect x="276" y="90" width="72" height="44" rx="8" fill="#262320" stroke="#9a6f9c" stroke-width="1.4"/><text x="312.0" y="117" text-anchor="middle" fill="#e7ddcb" font-size="11" font-weight="bold">commit</text><line x1="348" y1="112" x2="360" y2="112" stroke="#4a453d" stroke-width="1.4" fill="none" marker-end="url(#a-faint)"/><rect x="360" y="90" width="72" height="44" rx="8" fill="#262320" stroke="#7f8fc0" stroke-width="1.4"/><text x="396.0" y="117" text-anchor="middle" fill="#e7ddcb" font-size="11" font-weight="bold">PR</text><line x1="432" y1="112" x2="444" y2="112" stroke="#4a453d" stroke-width="1.4" fill="none" marker-end="url(#a-faint)"/><rect x="444" y="90" width="72" height="44" rx="8" fill="#262320" stroke="#8aa06a" stroke-width="1.4"/><text x="480.0" y="117" text-anchor="middle" fill="#e7ddcb" font-size="11" font-weight="bold">merge</text><line x1="516" y1="112" x2="528" y2="112" stroke="#4a453d" stroke-width="1.4" fill="none" marker-end="url(#a-faint)"/><rect x="528" y="90" width="72" height="44" rx="8" fill="#262320" stroke="#d1972f" stroke-width="1.4"/><text x="564.0" y="117" text-anchor="middle" fill="#e7ddcb" font-size="11" font-weight="bold">release</text><line x1="600" y1="112" x2="612" y2="112" stroke="#4a453d" stroke-width="1.4" fill="none" marker-end="url(#a-faint)"/><rect x="612" y="90" width="72" height="44" rx="8" fill="#262320" stroke="#c0603f" stroke-width="1.4"/><text x="648.0" y="117" text-anchor="middle" fill="#e7ddcb" font-size="11" font-weight="bold">deploy</text><text x="350" y="68" text-anchor="middle" fill="#9a8f7d" font-size="11">every arrow is a link a machine can follow</text><text x="350" y="172" text-anchor="middle" fill="#9a8f7d" font-size="10.5">from any line in production you can walk back to the reason it exists in ninety seconds</text></svg>