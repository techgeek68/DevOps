<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 226" role="img" aria-label="An unsigned commit whose author is an unverifiable string beside a signed commit marked Verified" font-family="Verdana, Geneva, DejaVu Sans, sans-serif"><rect x="0" y="0" width="100%" height="100%" fill="#1c1a17"/><defs><marker id="a-ochre" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#d1972f"/></marker><marker id="a-verd" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#3f9c8b"/></marker><marker id="a-terra" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#c0603f"/></marker><marker id="a-sage" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8aa06a"/></marker><marker id="a-plum" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a6f9c"/></marker><marker id="a-peri" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7f8fc0"/></marker><marker id="a-parch" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e7ddcb"/></marker><marker id="a-faint" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a8f7d"/></marker><marker id="a-rule" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#4a453d"/></marker></defs><rect x="40" y="70" width="290" height="140" rx="12" fill="#151310" stroke="#c0603f" stroke-width="1.4"/><text x="185" y="96" text-anchor="middle" fill="#c0603f" font-size="13" font-weight="bold">unsigned</text><text x="185" y="128" text-anchor="middle" fill="#e7ddcb" font-size="11">author is a self typed string</text><text x="185" y="150" text-anchor="middle" fill="#9a8f7d" font-size="12" font-family="Consolas, DejaVu Sans Mono, monospace">Linus Torvalds</text><text x="185" y="172" text-anchor="middle" fill="#9a8f7d" font-size="10">anyone with push access</text><text x="185" y="188" text-anchor="middle" fill="#9a8f7d" font-size="10">can claim any name</text><rect x="400" y="70" width="300" height="140" rx="12" fill="#151310" stroke="#8aa06a" stroke-width="1.4"/><text x="550" y="96" text-anchor="middle" fill="#8aa06a" font-size="13" font-weight="bold">signed</text><text x="550" y="128" text-anchor="middle" fill="#e7ddcb" font-size="11">a key vouches for the author</text><rect x="470" y="142" width="160" height="30" rx="8" fill="#262320" stroke="#8aa06a" stroke-width="1.4"/><text x="550" y="162" text-anchor="middle" fill="#8aa06a" font-size="12" font-weight="bold">Verified ✓</text><text x="550" y="192" text-anchor="middle" fill="#9a8f7d" font-size="10">identity becomes evidence, not a claim</text></svg>