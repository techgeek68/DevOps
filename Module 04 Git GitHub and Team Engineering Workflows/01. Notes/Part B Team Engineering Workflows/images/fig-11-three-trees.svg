<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 310" role="img" aria-label="HEAD, index, and working tree with which of them each reset mode rewrites" font-family="Verdana, Geneva, DejaVu Sans, sans-serif"><rect x="0" y="0" width="100%" height="100%" fill="#1c1a17"/><defs><marker id="a-ochre" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#d1972f"/></marker><marker id="a-verd" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#3f9c8b"/></marker><marker id="a-terra" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#c0603f"/></marker><marker id="a-sage" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8aa06a"/></marker><marker id="a-plum" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a6f9c"/></marker><marker id="a-peri" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7f8fc0"/></marker><marker id="a-parch" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e7ddcb"/></marker><marker id="a-faint" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a8f7d"/></marker><marker id="a-rule" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#4a453d"/></marker></defs><rect x="0" y="70" width="180" height="60" rx="8" fill="#262320" stroke="#d1972f" stroke-width="1.4"/><text x="90" y="96" text-anchor="middle" fill="#d1972f" font-size="13" font-weight="bold">HEAD</text><text x="90" y="116" text-anchor="middle" fill="#9a8f7d" font-size="10">last commit</text><rect x="230" y="70" width="180" height="60" rx="8" fill="#262320" stroke="#3f9c8b" stroke-width="1.4"/><text x="320" y="96" text-anchor="middle" fill="#3f9c8b" font-size="13" font-weight="bold">Index</text><text x="320" y="116" text-anchor="middle" fill="#9a8f7d" font-size="10">proposed commit</text><rect x="460" y="70" width="180" height="60" rx="8" fill="#262320" stroke="#9a6f9c" stroke-width="1.4"/><text x="550" y="96" text-anchor="middle" fill="#9a6f9c" font-size="13" font-weight="bold">Working tree</text><text x="550" y="116" text-anchor="middle" fill="#9a8f7d" font-size="10">files on disk</text><text x="20" y="164" text-anchor="start" fill="#d1972f" font-size="11.5" font-weight="bold" font-family="Consolas, DejaVu Sans Mono, monospace">reset --soft</text><line x1="90" y1="132" x2="90" y2="160" stroke="#d1972f" stroke-width="1.2" fill="none" stroke-dasharray="2 3"/><circle cx="90" cy="160" r="4" fill="#d1972f"/><text x="20" y="204" text-anchor="start" fill="#3f9c8b" font-size="11.5" font-weight="bold" font-family="Consolas, DejaVu Sans Mono, monospace">reset --mixed</text><line x1="90" y1="132" x2="90" y2="200" stroke="#3f9c8b" stroke-width="1.2" fill="none" stroke-dasharray="2 3"/><circle cx="90" cy="200" r="4" fill="#3f9c8b"/><line x1="320" y1="132" x2="320" y2="200" stroke="#3f9c8b" stroke-width="1.2" fill="none" stroke-dasharray="2 3"/><circle cx="320" cy="200" r="4" fill="#3f9c8b"/><text x="20" y="244" text-anchor="start" fill="#c0603f" font-size="11.5" font-weight="bold" font-family="Consolas, DejaVu Sans Mono, monospace">reset --hard</text><line x1="90" y1="132" x2="90" y2="240" stroke="#c0603f" stroke-width="1.2" fill="none" stroke-dasharray="2 3"/><circle cx="90" cy="240" r="4" fill="#c0603f"/><line x1="320" y1="132" x2="320" y2="240" stroke="#c0603f" stroke-width="1.2" fill="none" stroke-dasharray="2 3"/><circle cx="320" cy="240" r="4" fill="#c0603f"/><line x1="550" y1="132" x2="550" y2="240" stroke="#c0603f" stroke-width="1.2" fill="none" stroke-dasharray="2 3"/><circle cx="550" cy="240" r="4" fill="#c0603f"/><text x="360" y="290" text-anchor="middle" fill="#9a8f7d" font-size="10">--hard is the only one that touches the working tree, so it is the only one that destroys uncommitted work</text></svg>