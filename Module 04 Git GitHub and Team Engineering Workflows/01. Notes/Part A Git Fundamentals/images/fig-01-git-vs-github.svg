<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 250" role="img" aria-label="Git as a local version control system beside GitHub as a hosting platform, linked by push and pull" font-family="Verdana, Geneva, DejaVu Sans, sans-serif"><rect x="0" y="0" width="100%" height="100%" fill="#1c1a17"/><defs><marker id="a-ochre" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#d1972f"/></marker><marker id="a-verd" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#3f9c8b"/></marker><marker id="a-terra" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#c0603f"/></marker><marker id="a-sage" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8aa06a"/></marker><marker id="a-plum" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a6f9c"/></marker><marker id="a-peri" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7f8fc0"/></marker><marker id="a-parch" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e7ddcb"/></marker><marker id="a-faint" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a8f7d"/></marker><marker id="a-rule" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#4a453d"/></marker></defs><rect x="30" y="50" width="270" height="180" rx="12" fill="#151310" stroke="#d1972f" stroke-width="1.4"/><text x="165" y="78" text-anchor="middle" fill="#d1972f" font-size="14" font-weight="bold">Git · local VCS</text><text x="165" y="108" text-anchor="middle" fill="#e7ddcb" font-size="11.5">commit, branch, merge</text><text x="165" y="134" text-anchor="middle" fill="#e7ddcb" font-size="11.5">full history on disk</text><text x="165" y="160" text-anchor="middle" fill="#e7ddcb" font-size="11.5">works with no network</text><text x="165" y="186" text-anchor="middle" fill="#e7ddcb" font-size="11.5">one clone per machine</text><rect x="400" y="50" width="270" height="180" rx="12" fill="#151310" stroke="#7f8fc0" stroke-width="1.4"/><text x="535" y="78" text-anchor="middle" fill="#7f8fc0" font-size="14" font-weight="bold">GitHub · platform</text><text x="535" y="108" text-anchor="middle" fill="#e7ddcb" font-size="11.5">pull requests, review</text><text x="535" y="134" text-anchor="middle" fill="#e7ddcb" font-size="11.5">issues and projects</text><text x="535" y="160" text-anchor="middle" fill="#e7ddcb" font-size="11.5">Actions, CI and CD</text><text x="535" y="186" text-anchor="middle" fill="#e7ddcb" font-size="11.5">hosts the shared remote</text><line x1="300" y1="120" x2="400" y2="120" stroke="#3f9c8b" stroke-width="2" fill="none" marker-end="url(#a-verd)"/><line x1="400" y1="160" x2="300" y2="160" stroke="#3f9c8b" stroke-width="2" fill="none" marker-end="url(#a-verd)"/><text x="350" y="112" text-anchor="middle" fill="#3f9c8b" font-size="10" font-family="Consolas, DejaVu Sans Mono, monospace">push</text><text x="350" y="178" text-anchor="middle" fill="#3f9c8b" font-size="10" font-family="Consolas, DejaVu Sans Mono, monospace">pull</text></svg>