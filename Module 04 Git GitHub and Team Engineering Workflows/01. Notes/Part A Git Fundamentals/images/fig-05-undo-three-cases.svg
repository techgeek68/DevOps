<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 246" role="img" aria-label="Undo commands matched to whether a change is in the working tree, the staging area, or already committed" font-family="Verdana, Geneva, DejaVu Sans, sans-serif"><rect x="0" y="0" width="100%" height="100%" fill="#1c1a17"/><defs><marker id="a-ochre" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#d1972f"/></marker><marker id="a-verd" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#3f9c8b"/></marker><marker id="a-terra" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#c0603f"/></marker><marker id="a-sage" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8aa06a"/></marker><marker id="a-plum" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a6f9c"/></marker><marker id="a-peri" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7f8fc0"/></marker><marker id="a-parch" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e7ddcb"/></marker><marker id="a-faint" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a8f7d"/></marker><marker id="a-rule" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#4a453d"/></marker></defs><rect x="40" y="30" width="620" height="54" rx="8" fill="#262320" stroke="#d1972f" stroke-width="1.4"/><text x="58" y="52" text-anchor="start" fill="#d1972f" font-size="12.5" font-weight="bold">Edited, not staged</text><text x="58" y="72" text-anchor="start" fill="#9a8f7d" font-size="10.5">lives in the working tree</text><text x="642" y="61" text-anchor="end" fill="#e7ddcb" font-size="11.5" font-family="Consolas, DejaVu Sans Mono, monospace">git restore &lt;file&gt;</text><rect x="40" y="96" width="620" height="54" rx="8" fill="#262320" stroke="#3f9c8b" stroke-width="1.4"/><text x="58" y="118" text-anchor="start" fill="#3f9c8b" font-size="12.5" font-weight="bold">Staged, not committed</text><text x="58" y="138" text-anchor="start" fill="#9a8f7d" font-size="10.5">lives in the staging area</text><text x="642" y="127" text-anchor="end" fill="#e7ddcb" font-size="11.5" font-family="Consolas, DejaVu Sans Mono, monospace">git restore --staged &lt;file&gt;</text><rect x="40" y="162" width="620" height="54" rx="8" fill="#262320" stroke="#9a6f9c" stroke-width="1.4"/><text x="58" y="184" text-anchor="start" fill="#9a6f9c" font-size="12.5" font-weight="bold">Already committed</text><text x="58" y="204" text-anchor="start" fill="#9a8f7d" font-size="10.5">lives in the local repo</text><text x="642" y="193" text-anchor="end" fill="#e7ddcb" font-size="11.5" font-family="Consolas, DejaVu Sans Mono, monospace">git reset  or  git revert</text><text x="350" y="230" text-anchor="middle" fill="#9a8f7d" font-size="10.5">undo the least amount that gets the job done</text></svg>