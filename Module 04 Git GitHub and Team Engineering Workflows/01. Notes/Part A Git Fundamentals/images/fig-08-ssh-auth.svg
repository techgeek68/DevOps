<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 216" role="img" aria-label="SSH key pair with the private key held by the agent and the public key uploaded to GitHub" font-family="Verdana, Geneva, DejaVu Sans, sans-serif"><rect x="0" y="0" width="100%" height="100%" fill="#1c1a17"/><defs><marker id="a-ochre" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#d1972f"/></marker><marker id="a-verd" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#3f9c8b"/></marker><marker id="a-terra" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#c0603f"/></marker><marker id="a-sage" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8aa06a"/></marker><marker id="a-plum" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a6f9c"/></marker><marker id="a-peri" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7f8fc0"/></marker><marker id="a-parch" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e7ddcb"/></marker><marker id="a-faint" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a8f7d"/></marker><marker id="a-rule" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#4a453d"/></marker></defs><rect x="30" y="90" width="180" height="90" rx="8" fill="#151310" stroke="#d1972f" stroke-width="1.4"/><text x="120" y="116" text-anchor="middle" fill="#d1972f" font-size="12" font-weight="bold">your machine</text><rect x="50" y="130" width="70" height="34" rx="8" fill="#262320" stroke="#3f9c8b" stroke-width="1.4"/><text x="85" y="152" text-anchor="middle" fill="#e7ddcb" font-size="10.5">private</text><rect x="130" y="130" width="70" height="34" rx="8" fill="#262320" stroke="#7f8fc0" stroke-width="1.4"/><text x="165" y="152" text-anchor="middle" fill="#e7ddcb" font-size="10.5">public</text><text x="120" y="196" text-anchor="middle" fill="#9a8f7d" font-size="9.5">ssh-keygen makes the pair</text><rect x="300" y="70" width="150" height="50" rx="8" fill="#262320" stroke="#3f9c8b" stroke-width="1.4"/><text x="375" y="92" text-anchor="middle" fill="#e7ddcb" font-size="12" font-weight="bold">ssh-agent</text><text x="375" y="108" text-anchor="middle" fill="#9a8f7d" font-size="9">holds the private key</text><line x1="90" y1="128" x2="340" y2="120" stroke="#3f9c8b" stroke-width="1.6" fill="none" stroke-dasharray="3 3" marker-end="url(#a-verd)"/><rect x="520" y="110" width="150" height="60" rx="8" fill="#262320" stroke="#7f8fc0" stroke-width="1.4"/><text x="595" y="136" text-anchor="middle" fill="#e7ddcb" font-size="13" font-weight="bold">GitHub</text><text x="595" y="156" text-anchor="middle" fill="#9a8f7d" font-size="9">stores the public key</text><line x1="200" y1="147" x2="518" y2="140" stroke="#7f8fc0" stroke-width="1.6" fill="none" marker-end="url(#a-peri)"/><text x="360" y="196" text-anchor="middle" fill="#8aa06a" font-size="10.5" font-family="Consolas, DejaVu Sans Mono, monospace">ssh -T git@github.com  proves the pairing without a password</text></svg>