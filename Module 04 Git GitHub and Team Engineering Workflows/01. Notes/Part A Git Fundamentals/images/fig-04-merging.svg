"80" r="8" fill="#d1972f"/><circle cx="430" cy="80" r="8" fill="#d1972f"/><circle cx="180" cy="170" r="8" fill="#3f9c8b"/><circle cx="300" cy="170" r="8" fill="#3f9c8b"/><circle cx="430" cy="80" r="10" fill="#8aa06a"/><text x="430" y="62" text-anchor="middle" fill="#8aa06a" font-size="11" font-weight="bold">merge commit</text><text x="430" y="100" text-anchor="middle" fill="#9a8f7d" font-size="9.5">two parents</text><text x="70" y="64" text-anchor="start" fill="#d1972f" font-size="12" font-weight="bold">main</text><text x="180" y="194" text-anchor="start" fill="#3f9c8b" font-size="11" font-weight="bold">feature</text><text x="500" y="120" text-anchor="start" fill="#e7ddcb" font-size="11">the merge commit ties</text><text x="500" y="138" text-anchor="start" fill="#e7ddcb" font-size="11">both histories together</text><text x="500" y="160" text-anchor="start" fill="#9a8f7d" font-size="10.5">and records when and why</text></svg>