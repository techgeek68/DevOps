<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 220" role="img" aria-label="Git hooks placed along the lifecycle from edit to commit to push to the server" font-family="Verdana, Geneva, DejaVu Sans, sans-serif"><rect x="0" y="0" width="100%" height="100%" fill="#1c1a17"/><defs><marker id="a-ochre" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#d1972f"/></marker><marker id="a-verd" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#3f9c8b"/></marker><marker id="a-terra" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#c0603f"/></marker><marker id="a-sage" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8aa06a"/></marker><marker id="a-plum" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a6f9c"/></marker><marker id="a-peri" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7f8fc0"/></marker><marker id="a-parch" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e7ddcb"/></marker><marker id="a-faint" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a8f7d"/></marker><marker id="a-rule" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#4a453d"/></marker></defs><rect x="45" y="110" width="90" height="40" rx="8" fill="#262320" stroke="#4a453d" stroke-width="1.4"/><text x="90" y="135" text-anchor="middle" fill="#e7ddcb" font-size="12" font-weight="bold">edit</text><rect x="195" y="110" width="90" height="40" rx="8" fill="#262320" stroke="#4a453d" stroke-width="1.4"/><text x="240" y="135" text-anchor="middle" fill="#e7ddcb" font-size="12" font-weight="bold">commit</text><rect x="355" y="110" width="90" height="40" rx="8" fill="#262320" stroke="#4a453d" stroke-width="1.4"/><text x="400" y="135" text-anchor="middle" fill="#e7ddcb" font-size="12" font-weight="bold">push</text><rect x="515" y="110" width="90" height="40" rx="8" fill="#262320" stroke="#4a453d" stroke-width="1.4"/><text x="560" y="135" text-anchor="middle" fill="#e7ddcb" font-size="12" font-weight="bold">server</text><line x1="136" y1="130" x2="194" y2="130" stroke="#d1972f" stroke-width="1.6" fill="none" marker-end="url(#a-ochre)"/><line x1="286" y1="130" x2="354" y2="130" stroke="#d1972f" stroke-width="1.6" fill="none" marker-end="url(#a-ochre)"/><line x1="446" y1="130" x2="514" y2="130" stroke="#d1972f" stroke-width="1.6" fill="none" marker-end="url(#a-ochre)"/><text x="165" y="64" text-anchor="middle" fill="#d1972f" font-size="11" font-weight="bold" font-family="Consolas, DejaVu Sans Mono, monospace">pre-commit</text><text x="165" y="78" text-anchor="middle" fill="#9a8f7d" font-size="9.5">before the message</text><line x1="165" y1="130" x2="165" y2="66" stroke="#d1972f" stroke-width="1" fill="none" stroke-dasharray="2 3"/><text x="240" y="190" text-anchor="middle" fill="#3f9c8b" font-size="11" font-weight="bold" font-family="Consolas, DejaVu Sans Mono, monospace">commit-msg</text><text x="240" y="204" text-anchor="middle" fill="#9a8f7d" font-size="9.5">checks the message</text><line x1="240" y1="130" x2="240" y2="172" stroke="#3f9c8b" stroke-width="1" fill="none" stroke-dasharray="2 3"/><text x="320" y="64" text-anchor="middle" fill="#9a6f9c" font-size="11" font-weight="bold" font-family="Consolas, DejaVu Sans Mono, monospace">pre-push</text><text x="320" y="78" text-anchor="middle" fill="#9a8f7d" font-size="9.5">before objects leave</text><line x1="320" y1="130" x2="320" y2="66" stroke="#9a6f9c" stroke-width="1" fill="none" stroke-dasharray="2 3"/><text x="560" y="190" text-anchor="middle" fill="#c0603f" font-size="11" font-weight="bold" font-family="Consolas, DejaVu Sans Mono, monospace">post-receive</text><text x="560" y="204" text-anchor="middle" fill="#9a8f7d" font-size="9.5">deploy on the server</text><line x1="560" y1="130" x2="560" y2="172" stroke="#c0603f" stroke-width="1" fill="none" stroke-dasharray="2 3"/><text x="560" y="86" text-anchor="middle" fill="#9a8f7d" font-size="10">pre-receive rejects here, and it cannot be bypassed</text></svg>