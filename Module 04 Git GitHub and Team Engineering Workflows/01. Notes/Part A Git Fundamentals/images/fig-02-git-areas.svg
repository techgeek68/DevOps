<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 280" role="img" aria-label="Working tree, staging area, local repository, and remote repository with the commands that move changes between them" font-family="Verdana, Geneva, DejaVu Sans, sans-serif"><rect x="0" y="0" width="100%" height="100%" fill="#1c1a17"/><defs><marker id="a-ochre" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#d1972f"/></marker><marker id="a-verd" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#3f9c8b"/></marker><marker id="a-terra" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#c0603f"/></marker><marker id="a-sage" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8aa06a"/></marker><marker id="a-plum" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a6f9c"/></marker><marker id="a-peri" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7f8fc0"/></marker><marker id="a-parch" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e7ddcb"/></marker><marker id="a-faint" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a8f7d"/></marker><marker id="a-rule" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#4a453d"/></marker></defs><rect x="20" y="76" width="140" height="64" rx="8" fill="#262320" stroke="#d1972f" stroke-width="1.4"/><text x="90.0" y="106" text-anchor="middle" fill="#e7ddcb" font-size="12.5" font-weight="bold">Working tree</text><text x="90.0" y="126" text-anchor="middle" fill="#9a8f7d" font-size="9.5">files on disk</text><rect x="190" y="76" width="140" height="64" rx="8" fill="#262320" stroke="#3f9c8b" stroke-width="1.4"/><text x="260.0" y="106" text-anchor="middle" fill="#e7ddcb" font-size="12.5" font-weight="bold">Staging area</text><text x="260.0" y="126" text-anchor="middle" fill="#9a8f7d" font-size="9.5">proposed commit</text><rect x="360" y="76" width="140" height="64" rx="8" fill="#262320" stroke="#9a6f9c" stroke-width="1.4"/><text x="430.0" y="106" text-anchor="middle" fill="#e7ddcb" font-size="12.5" font-weight="bold">Local repo</text><text x="430.0" y="126" text-anchor="middle" fill="#9a8f7d" font-size="9.5">.git database</text><rect x="530" y="76" width="140" height="64" rx="8" fill="#262320" stroke="#7f8fc0" stroke-width="1.4"/><text x="600.0" y="106" text-anchor="middle" fill="#e7ddcb" font-size="12.5" font-weight="bold">Remote repo</text><text x="600.0" y="126" text-anchor="middle" fill="#9a8f7d" font-size="9.5">GitHub</text><line x1="160" y1="100" x2="190" y2="100" stroke="#d1972f" stroke-width="1.6" fill="none" marker-end="url(#a-ochre)"/><text x="175.0" y="92" text-anchor="middle" fill="#d1972f" font-size="10" font-family="Consolas, DejaVu Sans Mono, monospace">git add</text><line x1="330" y1="100" x2="360" y2="100" stroke="#d1972f" stroke-width="1.6" fill="none" marker-end="url(#a-ochre)"/><text x="345.0" y="92" text-anchor="middle" fill="#d1972f" font-size="10" font-family="Consolas, DejaVu Sans Mono, monospace">git commit</text><line x1="500" y1="100" x2="530" y2="100" stroke="#d1972f" stroke-width="1.6" fill="none" marker-end="url(#a-ochre)"/><text x="515.0" y="92" text-anchor="middle" fill="#d1972f" font-size="10" font-family="Consolas, DejaVu Sans Mono, monospace">git push</text><path d="M600.0,140 C 490,226 60,226 90.0,140" fill="none" stroke="#c0603f" stroke-width="1.7" marker-end="url(#a-terra)"/><text x="345.0" y="234" text-anchor="middle" fill="#c0603f" font-size="10.5" font-family="Consolas, DejaVu Sans Mono, monospace">git fetch · pull</text><text x="350" y="264" text-anchor="middle" fill="#9a8f7d" font-size="10.5">git restore and git reset move changes back toward the working tree</text></svg>