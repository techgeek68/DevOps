<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 160" role="img" aria-label="Manual SSH fix leads to drift and a later Terraform run reverting it and breaking production"><rect x="0" y="0" width="100%" height="100%" fill="#1c1a17"/><defs><marker id="ard6" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#c0603f"/></marker></defs><g font-size="9.5" fill="#e7ddcb"><rect x="16" y="55" width="150" height="52" rx="8" fill="#1c1a17" stroke="#c0603f"/><text x="91" y="76" text-anchor="middle" font-size="9">SSH in, edit nginx</text><text x="91" y="90" text-anchor="middle" font-size="9">to fix incident</text><rect x="188" y="55" width="150" height="52" rx="8" fill="#1c1a17" stroke="#4a453d"/><text x="263" y="76" text-anchor="middle" font-size="9">works · nobody</text><text x="263" y="90" text-anchor="middle" font-size="9">documents it</text><rect x="360" y="55" width="150" height="52" rx="8" fill="#1c1a17" stroke="#4a453d"/><text x="435" y="76" text-anchor="middle" font-size="9">3 months later,</text><text x="435" y="90" text-anchor="middle" font-size="9">terraform runs</text><rect x="532" y="55" width="160" height="52" rx="8" fill="#1c1a17" stroke="#c0603f"/><text x="612" y="76" text-anchor="middle" font-size="9">reverts config to</text><text x="612" y="90" text-anchor="middle" font-size="9">state file</text><rect x="714" y="55" width="160" height="52" rx="8" fill="#1c1a17" stroke="#c0603f"/><text x="794" y="76" text-anchor="middle" font-size="9">production breaks ·</text><text x="794" y="90" text-anchor="middle" font-size="9">nobody knows why</text></g><g stroke="#c0603f" stroke-width="1.4"><line x1="166" y1="81" x2="186" y2="81" marker-end="url(#ard6)"/><line x1="338" y1="81" x2="358" y2="81" marker-end="url(#ard6)"/><line x1="510" y1="81" x2="530" y2="81" marker-end="url(#ard6)"/><line x1="692" y1="81" x2="712" y2="81" marker-end="url(#ard6)"/></g><text x="16" y="35" fill="#9a8f7d" font-size="10">drift accumulates