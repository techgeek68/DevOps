<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-label="Pipeline from feature branch through PR, merge, staging and production canary"><rect x="0" y="0" width="100%" height="100%" fill="#1c1a17"/><defs><marker id="arf" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#d1972f"/></marker></defs><g font-size="10" fill="#e7ddcb"><!-- lane labels --><text x="20" y="34" fill="#d1972f" font-size="11">① feature branch</text><rect x="20" y="44" width="200" height="40" rx="7" fill="#1c1a17" stroke="#4a453d"/><text x="120" y="68" text-anchor="middle" font-size="9.5">lint · unit · SAST</text><text x="20" y="112" fill="#d1972f" font-size="11">② pull request → main</text><rect x="20" y="122" width="200" height="40" rx="7" fill="#1c1a17" stroke="#4a453d"/><text x="120" y="141" text-anchor="middle" font-size="9">full tests · integration</text><text x="120" y="154" text-anchor="middle" font-size="9">Docker build · Trivy · 1 review</text><text x="20" y="190" fill="#3f9c8b" font-size="11">③ merge to main (automated)</text><rect x="20" y="200" width="200" height="40" rx="7" fill="#1c1a17" stroke="#3f9c8b"/><text x="120" y="219" text-anchor="middle" font-size="9">push versioned image → ECR</text><text x="120" y="232" text-anchor="middle" font-size="9">ArgoCD syncs staging · smoke</text><text x="480" y="34" fill="#c0603f" font-size="11">④ human: click "promote"</text><rect x="480" y="44" width="390" height="196" rx="10" fill="#1c1a17" stroke="#c0603f"/><text x="500" y="72" fill="#e7ddcb" font-size="9.5">ArgoCD syncs prod with same image tag</text><rect x="500" y="86" width="350" height="30" rx="6" fill="#262320" stroke="#4a453d"/><rect x="500" y="86" width="60" height="30" rx="6" fill="#c0603f" opacity="0.7"/><text x="530" y="106" text-anchor="middle" font-size="9" fill="#fff">10%</text><text x="580" y="106" fill="#9a8f7d" font-size="9">canary 15 min · watch error rate + p99</text><text x="500" y="146" fill="#8aa06a" font-size="9.5">healthy ▸ promote to 100%</text><text x="500" y="168" fill="#c0603f" font-size="9.5">degraded ▸ automatic rollback</text><text x="500" y="206" fill="#9a8f7d" font-size="9">Argo Rollouts + Prometheus AnalysisTemplate</text></g><g stroke="#d1972f" stroke-width="1.5" fill="none"><path d="M200 84 L200 120" marker-end="url(#arf)"/><path d="M200 162 L200 198" marker-end="url(#arf)"/><path d="M220 220 L470 150 L478 145" marker-end="url(#arf)"/></g><text x="20" y="278" fill="#9a8f7d" font-size="10">human steps: write code · open PR · review PR · click promote · everything else is automated</text></svg>
