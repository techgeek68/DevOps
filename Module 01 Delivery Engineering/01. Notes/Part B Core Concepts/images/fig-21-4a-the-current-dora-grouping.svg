<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 210" role="img" aria-label="Throughput metrics and stability metrics as of the 2024 and 2025 DORA reports"><rect x="0" y="0" width="100%" height="100%" fill="#1c1a17"/><rect x="20" y="24" width="420" height="160" rx="12" fill="#1c1a17" stroke="#d1972f"/><text x="40" y="52" fill="#d1972f" font-size="14">THROUGHPUT</text><g font-size="10.5" fill="#e7ddcb"><rect x="40" y="66" width="380" height="32" rx="6" fill="#262320" stroke="#4a453d"/><text x="55" y="86">Deployment frequency</text><rect x="40" y="104" width="380" height="32" rx="6" fill="#262320" stroke="#4a453d"/><text x="55" y="124">Lead time for changes</text><rect x="40" y="142" width="380" height="32" rx="6" fill="#262320" stroke="#4a453d"/><text x="55" y="162">Failed deployment recovery time<tspan fill="#9a8f7d" font-size="8.5">(moved here in 2024)</tspan></text></g><rect x="460" y="24" width="420" height="160" rx="12" fill="#1c1a17" stroke="#c0603f"/><text x="480" y="52" fill="#c0603f" font-size="14">STABILITY</text><g font-size="10.5" fill="#e7ddcb"><rect x="480" y="66" width="380" height="32" rx="6" fill="#262320" stroke="#4a453d"/><text x="495" y="86">Change failure rate</text><rect x="480" y="104" width="380" height="32" rx="6" fill="#262320" stroke="#4a453d"/><text x="495" y="124">Rework rate<tspan fill="#9a8f7d" font-size="8.5">(added in 2024)</tspan></text></g></svg>
