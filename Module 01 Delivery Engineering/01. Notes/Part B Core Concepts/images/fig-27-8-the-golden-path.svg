<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" role="img" aria-label="A paved self-service path from idea to running in production with monitoring and policy"><rect x="0" y="0" width="100%" height="100%" fill="#1c1a17"/><defs><marker id="arg8" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#3f9c8b"/></marker></defs><rect x="20" y="70" width="140" height="54" rx="10" fill="#1c1a17" stroke="#d1972f"/><text x="90" y="102" text-anchor="middle" fill="#d1972f" font-size="11">"I have an idea"</text><!-- paved path --><rect x="180" y="76" width="500" height="42" rx="21" fill="#262320" stroke="#3f9c8b" stroke-width="1.6"/><g font-size="9" fill="#e7ddcb" text-anchor="middle"><text x="240" y="101">CI template</text><text x="330" y="101">K8s manifests</text><text x="430" y="101">TF modules</text><text x="525" y="101">Kyverno policy</text><text x="625" y="101">Grafana</text></g><rect x="700" y="70" width="180" height="54" rx="10" fill="#1c1a17" stroke="#8aa06a"/><text x="790" y="96" text-anchor="middle" fill="#8aa06a" font-size="10.5">running in prod</text><text x="790" y="112" text-anchor="middle" fill="#9a8f7d" font-size="8.5">+ monitoring · alerts · policy</text><g stroke="#3f9c8b" stroke-width="1.6" fill="none"><line x1="160" y1="97" x2="178" y2="97" marker-end="url(#arg8)"/><line x1="680" y1="97" x2="698" y2="97" marker-end="url(#arg8)"/></g><text x="90" y="150" fill="#9a8f7d" font-size="10">a developer uses the path without understanding every layer of the stack</text><text x="430" y="52" text-anchor="middle" fill="#9a8f7d" font-size="10">Team Topologies (2019) · commonly built on Backstage</text></svg>
