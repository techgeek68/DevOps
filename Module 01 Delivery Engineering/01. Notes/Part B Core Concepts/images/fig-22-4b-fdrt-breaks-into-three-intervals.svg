<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 160" role="img" aria-label="Failed deployment recovery time as detection plus response plus recovery"><rect x="0" y="0" width="100%" height="100%" fill="#1c1a17"/><line x1="40" y1="90" x2="860" y2="90" stroke="#4a453d" stroke-width="2"/><g font-size="10.5" fill="#e7ddcb"><rect x="40" y="60" width="260" height="30" rx="5" fill="#d1972f" opacity="0.55"/><text x="170" y="80" text-anchor="middle" fill="#fff">detection</text><rect x="300" y="60" width="220" height="30" rx="5" fill="#3f9c8b" opacity="0.55"/><text x="410" y="80" text-anchor="middle" fill="#fff">response</text><rect x="520" y="60" width="340" height="30" rx="5" fill="#c0603f" opacity="0.6"/><text x="690" y="80" text-anchor="middle" fill="#fff">recovery (fix or rollback)</text></g><text x="40" y="42" fill="#9a8f7d" font-size="10">deploy breaks</text><text x="860" y="42" fill="#9a8f7d" font-size="10" text-anchor="end">service restored</text><g font-size="9" fill="#9a8f7d"><text x="170" y="118" text-anchor="middle">how fast monitoring</text><text x="170" y="130" text-anchor="middle">spots it</text><text x="410" y="118" text-anchor="middle">how fast on call</text><text x="410" y="130" text-anchor="middle">engages</text><text x="690" y="118" text-anchor="middle">how fast a fix ships or</text><text x="690" y="130" text-anchor="middle">rollback executes</text></g></svg>
