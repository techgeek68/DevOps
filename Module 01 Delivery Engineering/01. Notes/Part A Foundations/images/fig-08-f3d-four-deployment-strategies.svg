<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" role="img" aria-label="Rolling, blue-green, canary and feature flag deployment strategies"><rect x="0" y="0" width="100%" height="100%" fill="#1c1a17"/><g font-size="10.5" fill="#e7ddcb"><!-- Rolling --><text x="20" y="26" fill="#d1972f" font-size="12">Rolling</text><rect x="20" y="38" width="26" height="26" rx="4" fill="#3f9c8b"/><rect x="52" y="38" width="26" height="26" rx="4" fill="#3f9c8b"/><rect x="84" y="38" width="26" height="26" rx="4" fill="#c0603f"/><rect x="116" y="38" width="26" height="26" rx="4" fill="#4a453d"/><text x="20" y="82" fill="#9a8f7d">replace instances one at a time</text><!-- Blue/Green --><text x="470" y="26" fill="#d1972f" font-size="12">Blue / Green</text><rect x="470" y="38" width="70" height="30" rx="5" fill="#d1972f"/><text x="505" y="58" text-anchor="middle" fill="#fff">BLUE</text><rect x="470" y="74" width="70" height="30" rx="5" fill="#3f9c8b"/><text x="505" y="94" text-anchor="middle" fill="#fff">GREEN</text><path d="M550 60 L590 60 L590 84" stroke="#c0603f" stroke-width="1.6" fill="none"/><text x="600" y="76" fill="#9a8f7d">flip traffic at LB instantly</text><!-- Canary --><text x="20" y="140" fill="#d1972f" font-size="12">Canary</text><rect x="20" y="152" width="180" height="24" rx="5" fill="#4a453d"/><rect x="20" y="152" width="30" height="24" rx="5" fill="#c0603f"/><text x="35" y="169" fill="#fff" font-size="9">10%</text><text x="20" y="196" fill="#9a8f7d">small % first, promote gradually</text><!-- Feature flag --><text x="470" y="140" fill="#d1972f" font-size="12">Feature Flag</text><rect x="470" y="152" width="120" height="26" rx="13" fill="#4a453d"/><circle cx="483" cy="165" r="9" fill="#9a8f7d"/><text x="600" y="170" fill="#9a8f7d">deployed but hidden by a toggle</text></g><line x1="450" y1="16" x2="450" y2="220" stroke="#4a453d" stroke-dasharray="3 3"/><line x1="20" y1="115" x2="880" y2="115" stroke="#4a453d" stroke-dasharray="3 3"/></svg>
