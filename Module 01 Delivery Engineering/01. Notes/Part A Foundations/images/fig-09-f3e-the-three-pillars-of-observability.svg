<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" role="img" aria-label="Metrics, logs and traces as three pillars of observability"><rect x="0" y="0" width="100%" height="100%" fill="#1c1a17"/><g font-size="11" fill="#e7ddcb"><rect x="20" y="30" width="270" height="140" rx="10" fill="#262320" stroke="#d1972f"/><text x="40" y="58" fill="#d1972f" font-size="14">METRICS</text><text x="40" y="82" fill="#9a8f7d" font-size="10.5">"what is the system doing now?"</text><text x="40" y="110" font-size="10.5">numeric time series</text><text x="40" y="128" font-size="10.5">CPU · req/s · error count</text><!-- mini sparkline --><polyline points="40,150 70,142 100,155 130,138 160,150 190,132 220,148 250,140" fill="none" stroke="#d1972f" stroke-width="1.5"/><rect x="315" y="30" width="270" height="140" rx="10" fill="#262320" stroke="#3f9c8b"/><text x="335" y="58" fill="#3f9c8b" font-size="14">LOGS</text><text x="335" y="82" fill="#9a8f7d" font-size="10.5">"what happened at 14:32 UTC?"</text><text x="335" y="110" font-size="10.5">timestamped discrete events</text><text x="335" y="128" font-size="10.5">access · errors · audit trails</text><text x="335" y="152" font-size="9" fill="#9a8f7d">14:32:07 ERROR db timeout ...</text><rect x="610" y="30" width="270" height="140" rx="10" fill="#262320" stroke="#c0603f"/><text x="630" y="58" fill="#c0603f" font-size="14">TRACES</text><text x="630" y="82" fill="#9a8f7d" font-size="10.5">"where did the time go?"</text><text x="630" y="110" font-size="10.5">request path across services</text><!-- span bars --><rect x="630" y="122" width="200" height="9" rx="2" fill="#4a453d"/><rect x="630" y="134" width="120" height="9" rx="2" fill="#4a453d"/><rect x="750" y="146" width="80" height="9" rx="2" fill="#c0603f"/><text x="760" y="153" font-size="8" fill="#fff">800ms db</text></g></svg>
