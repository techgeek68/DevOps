<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-label="Agile sprint as a repeating cycle of planning, standup, review, retrospective"><rect x="0" y="0" width="100%" height="100%" fill="#1c1a17"/><defs><marker id="arc" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#3f9c8b"/></marker></defs><circle cx="300" cy="150" r="110" fill="none" stroke="#4a453d" stroke-width="1"/><!-- 4 nodes around circle --><g font-size="12" fill="#e7ddcb"><rect x="230" y="18" width="140" height="46" rx="8" fill="#262320" stroke="#3f9c8b"/><text x="300" y="40" text-anchor="middle" font-size="11.5">Sprint Planning</text><text x="300" y="55" text-anchor="middle" font-size="9.5" fill="#9a8f7d">select from backlog</text><rect x="410" y="126" width="140" height="46" rx="8" fill="#262320" stroke="#3f9c8b"/><text x="480" y="148" text-anchor="middle" font-size="11.5">Daily Standup</text><text x="480" y="163" text-anchor="middle" font-size="9.5" fill="#9a8f7d">15 min sync</text><rect x="230" y="236" width="140" height="46" rx="8" fill="#262320" stroke="#3f9c8b"/><text x="300" y="258" text-anchor="middle" font-size="11.5">Sprint Review</text><text x="300" y="273" text-anchor="middle" font-size="9.5" fill="#9a8f7d">demo to stakeholders</text><rect x="50" y="126" width="140" height="46" rx="8" fill="#262320" stroke="#3f9c8b"/><text x="120" y="148" text-anchor="middle" font-size="11.5">Retrospective</text><text x="120" y="163" text-anchor="middle" font-size="9.5" fill="#9a8f7d">improve the process</text></g><g stroke="#3f9c8b" stroke-width="1.6" fill="none"><path d="M375 55 A 110 110 0 0 1 460 120" marker-end="url(#arc)"/><path d="M475 175 A 110 110 0 0 1 375 250" marker-end="url(#arc)"/><path d="M225 255 A 110 110 0 0 1 130 175" marker-end="url(#arc)"/><path d="M120 120 A 110 110 0 0 1 225 50" marker-end="url(#arc)"/></g><text x="300" y="147" text-anchor="middle" fill="#c0603f" font-size="12">1–2 week</text><text x="300" y="164" text-anchor="middle" fill="#c0603f" font-size="12">sprint</text><text x="720" y="120" fill="#9a8f7d" font-size="11" text-anchor="middle">Sprint 1 feedback</text><text x="720" y="138" fill="#9a8f7d" font-size="11" text-anchor="middle">becomes a Sprint 2</text><text x="720" y="156" fill="#9a8f7d" font-size="11" text-anchor="middle">story · no formal</text><text x="720" y="174" fill="#9a8f7d" font-size="11" text-anchor="middle">change request</text></svg>
