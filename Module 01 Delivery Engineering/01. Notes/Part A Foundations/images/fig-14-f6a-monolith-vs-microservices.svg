<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" role="img" aria-label="Single monolith unit versus independently deployed services each with its own database"><rect x="0" y="0" width="100%" height="100%" fill="#1c1a17"/><text x="20" y="26" fill="#c0603f" font-size="12">MONOLITH · one deploy unit</text><rect x="20" y="40" width="330" height="150" rx="10" fill="#1c1a17" stroke="#c0603f"/><g font-size="10" fill="#e7ddcb"><rect x="40" y="60" width="130" height="40" rx="5" fill="#262320" stroke="#4a453d"/><text x="105" y="85" text-anchor="middle">Users</text><rect x="185" y="60" width="130" height="40" rx="5" fill="#262320" stroke="#4a453d"/><text x="250" y="85" text-anchor="middle">Payments</text><rect x="40" y="110" width="130" height="40" rx="5" fill="#262320" stroke="#4a453d"/><text x="105" y="135" text-anchor="middle">Catalog</text><rect x="185" y="110" width="130" height="40" rx="5" fill="#262320" stroke="#4a453d"/><text x="250" y="135" text-anchor="middle">Search</text></g><rect x="120" y="162" width="130" height="20" rx="4" fill="#c0603f" opacity="0.35"/><text x="185" y="176" text-anchor="middle" fill="#c0603f" font-size="9">shared database</text><line x1="450" y1="20" x2="450" y2="210" stroke="#4a453d" stroke-dasharray="3 3"/><text x="490" y="26" fill="#3f9c8b" font-size="12">MICROSERVICES · deploy independently</text><g font-size="9.5" fill="#e7ddcb"><g><rect x="490" y="44" width="110" height="46" rx="7" fill="#1c1a17" stroke="#3f9c8b"/><text x="545" y="72" text-anchor="middle">Users</text><rect x="512" y="96" width="66" height="14" rx="3" fill="#262320" stroke="#4a453d"/><text x="545" y="106" text-anchor="middle" font-size="7.5" fill="#9a8f7d">db</text></g><g><rect x="620" y="44" width="110" height="46" rx="7" fill="#1c1a17" stroke="#3f9c8b"/><text x="675" y="72" text-anchor="middle">Payments</text><rect x="642" y="96" width="66" height="14" rx="3" fill="#262320" stroke="#4a453d"/><text x="675" y="106" text-anchor="middle" font-size="7.5" fill="#9a8f7d">db</text></g><g><rect x="750" y="44" width="120" height="46" rx="7" fill="#1c1a17" stroke="#3f9c8b"/><text x="810" y="72" text-anchor="middle">Catalog</text><rect x="777" y="96" width="66" height="14" rx="3" fill="#262320" stroke="#4a453d"/><text x="810" y="106" text-anchor="middle" font-size="7.5" fill="#9a8f7d">db</text></g><g><rect x="555" y="130" width="110" height="46" rx="7" fill="#1c1a17" stroke="#3f9c8b"/><text x="610" y="158" text-anchor="middle">Search</text><rect x="577" y="182" width="66" height="14" rx="3" fill="#262320" stroke="#4a453d"/><text x="610" y="192" text-anchor="middle" font-size="7.5" fill="#9a8f7d">db</text></g></g><text x="490" y="216" fill="#9a8f7d" font-size="9.5">each owns its own data · talks over APIs · fails in isolation</text></svg>
