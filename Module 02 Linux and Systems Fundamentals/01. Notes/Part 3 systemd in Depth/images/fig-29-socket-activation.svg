<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" role="img" aria-label="systemd holding a socket and starting its service on demand when a client first connects" font-family="Verdana, Geneva, DejaVu Sans, sans-serif"><rect x="0" y="0" width="100%" height="100%" fill="#1c1a17"/><defs><marker id="a-ochre" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#d1972f"/></marker><marker id="a-verd" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#3f9c8b"/></marker><marker id="a-terra" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#c0603f"/></marker><marker id="a-sage" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8aa06a"/></marker><marker id="a-plum" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a6f9c"/></marker><marker id="a-peri" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7f8fc0"/></marker><marker id="a-parch" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e7ddcb"/></marker><marker id="a-faint" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a8f7d"/></marker><marker id="a-rule" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#4a453d"/></marker></defs><rect x="40" y="100" width="150" height="60" rx="8" fill="#262320" stroke="#7f8fc0" stroke-width="1.4"/><text x="115" y="126" text-anchor="middle" fill="#e7ddcb" font-size="12" font-weight="bold">client</text><text x="115" y="146" text-anchor="middle" fill="#9a8f7d" font-size="9">first connection</text><rect x="280" y="90" width="170" height="80" rx="8" fill="#151310" stroke="#d1972f" stroke-width="1.4"/><text x="365" y="116" text-anchor="middle" fill="#d1972f" font-size="12" font-weight="bold">systemd holds</text><text x="365" y="136" text-anchor="middle" fill="#d1972f" font-size="12" font-weight="bold" font-family="Consolas, DejaVu Sans Mono, monospace">the .socket</text><text x="365" y="156" text-anchor="middle" fill="#9a8f7d" font-size="8.5">always listening, costs nothing</text><rect x="540" y="100" width="150" height="60" rx="8" fill="#262320" stroke="#3f9c8b" stroke-width="1.4"/><text x="615" y="126" text-anchor="middle" fill="#e7ddcb" font-size="12" font-weight="bold" font-family="Consolas, DejaVu Sans Mono, monospace">the .service</text><text x="615" y="146" text-anchor="middle" fill="#9a8f7d" font-size="9">started on demand</text><line x1="190" y1="130" x2="278" y2="130" stroke="#7f8fc0" stroke-width="1.6" fill="none" marker-end="url(#a-peri)"/><line x1="450" y1="130" x2="538" y2="130" stroke="#d1972f" stroke-width="1.6" fill="none" marker-end="url(#a-ochre)"/><text x="494" y="120" text-anchor="middle" fill="#d1972f" font-size="9">starts</text><text x="360" y="200" text-anchor="middle" fill="#9a8f7d" font-size="10.5">systemd owns the port and launches the service only when the first request arrives</text></svg>