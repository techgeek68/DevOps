<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 236" role="img" aria-label="The boot process reaching the default target which starts a group of service units" font-family="Verdana, Geneva, DejaVu Sans, sans-serif"><rect x="0" y="0" width="100%" height="100%" fill="#1c1a17"/><defs><marker id="a-ochre" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#d1972f"/></marker><marker id="a-verd" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#3f9c8b"/></marker><marker id="a-terra" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#c0603f"/></marker><marker id="a-sage" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8aa06a"/></marker><marker id="a-plum" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a6f9c"/></marker><marker id="a-peri" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7f8fc0"/></marker><marker id="a-parch" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e7ddcb"/></marker><marker id="a-faint" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a8f7d"/></marker><marker id="a-rule" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#4a453d"/></marker></defs><rect x="30" y="110" width="110" height="50" rx="8" fill="#262320" stroke="#7f8fc0" stroke-width="1.4"/><text x="85" y="140" text-anchor="middle" fill="#e7ddcb" font-size="12" font-weight="bold">boot</text><rect x="210" y="100" width="180" height="70" rx="8" fill="#151310" stroke="#d1972f" stroke-width="1.4"/><text x="300" y="124" text-anchor="middle" fill="#d1972f" font-size="12" font-weight="bold" font-family="Consolas, DejaVu Sans Mono, monospace">default.target</text><text x="300" y="146" text-anchor="middle" fill="#9a8f7d" font-size="9.5">usually multi-user</text><rect x="500" y="60" width="150" height="40" rx="8" fill="#262320" stroke="#3f9c8b" stroke-width="1.4"/><text x="575" y="84" text-anchor="middle" fill="#e7ddcb" font-size="10.5" font-family="Consolas, DejaVu Sans Mono, monospace">sshd.service</text><line x1="390" y1="135" x2="498" y2="80" stroke="#3f9c8b" stroke-width="1.6" fill="none" stroke-dasharray="3 3" marker-end="url(#a-verd)"/><rect x="500" y="115" width="150" height="40" rx="8" fill="#262320" stroke="#3f9c8b" stroke-width="1.4"/><text x="575" y="139" text-anchor="middle" fill="#e7ddcb" font-size="10.5" font-family="Consolas, DejaVu Sans Mono, monospace">nginx.service</text><line x1="390" y1="135" x2="498" y2="135" stroke="#3f9c8b" stroke-width="1.6" fill="none" stroke-dasharray="3 3" marker-end="url(#a-verd)"/><rect x="500" y="170" width="150" height="40" rx="8" fill="#262320" stroke="#3f9c8b" stroke-width="1.4"/><text x="575" y="194" text-anchor="middle" fill="#e7ddcb" font-size="10.5" font-family="Consolas, DejaVu Sans Mono, monospace">cron.service</text><line x1="390" y1="135" x2="498" y2="190" stroke="#3f9c8b" stroke-width="1.6" fill="none" stroke-dasharray="3 3" marker-end="url(#a-verd)"/><line x1="140" y1="135" x2="208" y2="135" stroke="#d1972f" stroke-width="1.6" fill="none" marker-end="url(#a-ochre)"/><text x="360" y="214" text-anchor="middle" fill="#9a8f7d" font-size="10.5">a target is a named system state that pulls in a set of units, the modern replacement for runlevels</text></svg>