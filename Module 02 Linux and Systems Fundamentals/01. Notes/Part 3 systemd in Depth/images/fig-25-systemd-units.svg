<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 238" role="img" aria-label="The systemd unit types: service, socket, timer, target, mount, and path" font-family="Verdana, Geneva, DejaVu Sans, sans-serif"><rect x="0" y="0" width="100%" height="100%" fill="#1c1a17"/><defs><marker id="a-ochre" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#d1972f"/></marker><marker id="a-verd" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#3f9c8b"/></marker><marker id="a-terra" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#c0603f"/></marker><marker id="a-sage" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8aa06a"/></marker><marker id="a-plum" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a6f9c"/></marker><marker id="a-peri" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7f8fc0"/></marker><marker id="a-parch" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e7ddcb"/></marker><marker id="a-faint" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a8f7d"/></marker><marker id="a-rule" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#4a453d"/></marker></defs><rect x="30" y="50" width="210" height="70" rx="8" fill="#262320" stroke="#d1972f" stroke-width="1.4"/><text x="135" y="80" text-anchor="middle" fill="#d1972f" font-size="13" font-weight="bold" font-family="Consolas, DejaVu Sans Mono, monospace">.service</text><text x="135" y="100" text-anchor="middle" fill="#9a8f7d" font-size="10">a long running process</text><rect x="260" y="50" width="210" height="70" rx="8" fill="#262320" stroke="#3f9c8b" stroke-width="1.4"/><text x="365" y="80" text-anchor="middle" fill="#3f9c8b" font-size="13" font-weight="bold" font-family="Consolas, DejaVu Sans Mono, monospace">.socket</text><text x="365" y="100" text-anchor="middle" fill="#9a8f7d" font-size="10">a listening socket</text><rect x="490" y="50" width="210" height="70" rx="8" fill="#262320" stroke="#9a6f9c" stroke-width="1.4"/><text x="595" y="80" text-anchor="middle" fill="#9a6f9c" font-size="13" font-weight="bold" font-family="Consolas, DejaVu Sans Mono, monospace">.timer</text><text x="595" y="100" text-anchor="middle" fill="#9a8f7d" font-size="10">a schedule</text><rect x="30" y="140" width="210" height="70" rx="8" fill="#262320" stroke="#7f8fc0" stroke-width="1.4"/><text x="135" y="170" text-anchor="middle" fill="#7f8fc0" font-size="13" font-weight="bold" font-family="Consolas, DejaVu Sans Mono, monospace">.target</text><text x="135" y="190" text-anchor="middle" fill="#9a8f7d" font-size="10">a group of units</text><rect x="260" y="140" width="210" height="70" rx="8" fill="#262320" stroke="#8aa06a" stroke-width="1.4"/><text x="365" y="170" text-anchor="middle" fill="#8aa06a" font-size="13" font-weight="bold" font-family="Consolas, DejaVu Sans Mono, monospace">.mount</text><text x="365" y="190" text-anchor="middle" fill="#9a8f7d" font-size="10">a filesystem mount</text><rect x="490" y="140" width="210" height="70" rx="8" fill="#262320" stroke="#c0603f" stroke-width="1.4"/><text x="595" y="170" text-anchor="middle" fill="#c0603f" font-size="13" font-weight="bold" font-family="Consolas, DejaVu Sans Mono, monospace">.path</text><text x="595" y="190" text-anchor="middle" fill="#9a8f7d" font-size="10">watch a file or dir</text><text x="360" y="30" text-anchor="middle" fill="#9a8f7d" font-size="11">a unit is anything systemd knows how to manage</text></svg>