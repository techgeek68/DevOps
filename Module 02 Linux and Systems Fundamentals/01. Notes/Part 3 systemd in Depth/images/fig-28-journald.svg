ight="40" rx="8" fill="#262320" stroke="#3f9c8b" stroke-width="1.4"/><text x="100" y="134" text-anchor="middle" fill="#e7ddcb" font-size="11" font-family="Consolas, DejaVu Sans Mono, monospace">nginx</text><line x1="160" y1="130" x2="258" y2="120" stroke="#3f9c8b" stroke-width="1.6" fill="none" marker-end="url(#a-verd)"/><rect x="40" y="170" width="120" height="40" rx="8" fill="#262320" stroke="#3f9c8b" stroke-width="1.4"/><text x="100" y="194" text-anchor="middle" fill="#e7ddcb" font-size="11" font-family="Consolas, DejaVu Sans Mono, monospace">kernel</text><line x1="160" y1="190" x2="258" y2="120" stroke="#3f9c8b" stroke-width="1.6" fill="none" marker-end="url(#a-verd)"/><rect x="260" y="90" width="180" height="80" rx="8" fill="#151310" stroke="#d1972f" stroke-width="1.4"/><text x="350" y="116" text-anchor="middle" fill="#d1972f" font-size="13" font-weight="bold">journald</text><text x="350" y="138" text-anchor="middle" fill="#e7ddcb" font-size="10">one structured journal</text><text x="350" y="156" text-anchor="middle" fill="#9a8f7d" font-size="8.5">binary, indexed, timestamped</text><text x="560" y="70" text-anchor="end" fill="#9a6f9c" font-size="11" font-weight="bold" font-family="Consolas, DejaVu Sans Mono, monospace">-u sshd</text><text x="575" y="70" text-anchor="start" fill="#9a8f7d" font-size="9.5">one unit</text><line x1="455" y1="66" x2="545" y2="66" stroke="#9a6f9c" stroke-width="1" fill="none" marker-end="url(#a-plum)"/><text x="560" y="110" text-anchor="end" fill="#9a6f9c" font-size="11" font-weight="bold" font-family="Consolas, DejaVu Sans Mono, monospace">-f</text><text x="575" y="110" text-anchor="start" fill="#9a8f7d" font-size="9.5">follow live</text><line x1="455" y1="106" x2="545" y2="106" stroke="#9a6f9c" stroke-width="1" fill="none" marker-end="url(#a-plum)"/><text x="560" y="150" text-anchor="end" fill="#9a6f9c" font-size="11" font-weight="bold" font-family="Consolas, DejaVu Sans Mono, monospace">-p err</text><text x="575" y="150" text-anchor="start" fill="#9a8f7d" font-size="9.5">errors only</text><line x1="455" y1="146" x2="545" y2="146" stroke="#9a6f9c" stroke-width="1" fill="none" marker-end="url(#a-plum)"/><text x="560" y="190" text-anchor="end" fill="#9a6f9c" font-size="11" font-weight="bold" font-family="Consolas, DejaVu Sans Mono, monospace">--since</text><text x="575" y="190" text-anchor="start" fill="#9a8f7d" font-size="9.5">a time window</text><line x1="455" y1="186" x2="545" y2="186" stroke="#9a6f9c" stroke-width="1" fill="none" marker-end="url(#a-plum)"/><text x="360" y="232" text-anchor="middle" fill="#9a8f7d" font-size="10.5">everything logs to one indexed journal, and journalctl filters it by unit, priority, and time</text></svg>