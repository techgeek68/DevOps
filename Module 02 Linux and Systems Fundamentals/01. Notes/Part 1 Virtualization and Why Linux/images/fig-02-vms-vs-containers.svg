ct x="190" y="44" width="130" height="44" rx="8" fill="#262320" stroke="#3f9c8b" stroke-width="1.4"/><text x="255" y="62" text-anchor="middle" fill="#e7ddcb" font-size="10" font-weight="bold">app</text><text x="255" y="80" text-anchor="middle" fill="#9a8f7d" font-size="8.5">guest OS</text><rect x="40" y="96" width="280" height="26" rx="8" fill="#262320" stroke="#d1972f" stroke-width="1.4"/><text x="180" y="113" text-anchor="middle" fill="#e7ddcb" font-size="10.5">hypervisor</text><rect x="40" y="128" width="280" height="24" rx="8" fill="#262320" stroke="#4a453d" stroke-width="1.4"/><text x="180" y="144" text-anchor="middle" fill="#9a8f7d" font-size="10">hardware</text><text x="535" y="28" text-anchor="middle" fill="#9a6f9c" font-size="13" font-weight="bold">containers</text><rect x="400" y="44" width="90" height="30" rx="8" fill="#262320" stroke="#8aa06a" stroke-width="1.4"/><text x="445" y="63" text-anchor="middle" fill="#e7ddcb" font-size="10" font-weight="bold">app</text><rect x="500" y="44" width="90" height="30" rx="8" fill="#262320" stroke="#8aa06a" stroke-width="1.4"/><text x="545" y="63" text-anchor="middle" fill="#e7ddcb" font-size="10" font-weight="bold">app</text><rect x="600" y="44" width="90" height="30" rx="8" fill="#262320" stroke="#8aa06a" stroke-width="1.4"/><text x="645" y="63" text-anchor="middle" fill="#e7ddcb" font-size="10" font-weight="bold">app</text><rect x="400" y="82" width="290" height="24" rx="8" fill="#262320" stroke="#9a6f9c" stroke-width="1.4"/><text x="545" y="98" text-anchor="middle" fill="#e7ddcb" font-size="10">container engine</text><rect x="400" y="112" width="290" height="26" rx="8" fill="#262320" stroke="#d1972f" stroke-width="1.4"/><text x="545" y="129" text-anchor="middle" fill="#e7ddcb" font-size="10">host OS · one shared kernel</text><rect x="400" y="144" width="290" height="22" rx="8" fill="#262320" stroke="#4a453d" stroke-width="1.4"/><text x="545" y="159" text-anchor="middle" fill="#9a8f7d" font-size="9.5">hardware</text><text x="360" y="192" text-anchor="middle" fill="#9a8f7d" font-size="10.5">a VM ships a whole guest OS; a container shares the host kernel and ships only the app</text></svg>