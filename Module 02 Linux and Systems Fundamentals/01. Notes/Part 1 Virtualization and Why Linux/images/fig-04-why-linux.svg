<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 226" role="img" aria-label="Four reasons Linux dominates DevOps: tooling, SSH first management, minimal attack surface, native containers" font-family="Verdana, Geneva, DejaVu Sans, sans-serif"><rect x="0" y="0" width="100%" height="100%" fill="#1c1a17"/><defs><marker id="a-ochre" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#d1972f"/></marker><marker id="a-verd" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#3f9c8b"/></marker><marker id="a-terra" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#c0603f"/></marker><marker id="a-sage" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8aa06a"/></marker><marker id="a-plum" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a6f9c"/></marker><marker id="a-peri" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7f8fc0"/></marker><marker id="a-parch" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e7ddcb"/></marker><marker id="a-faint" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a8f7d"/></marker><marker id="a-rule" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#4a453d"/></marker></defs><rect x="30" y="40" width="330" height="80" rx="8" fill="#262320" stroke="#d1972f" stroke-width="1.4"/><text x="195" y="72" text-anchor="middle" fill="#d1972f" font-size="12.5" font-weight="bold">the tooling ecosystem</text><text x="195" y="96" text-anchor="middle" fill="#9a8f7d" font-size="10.5">the tools are built here first</text><rect x="380" y="40" width="330" height="80" rx="8" fill="#262320" stroke="#3f9c8b" stroke-width="1.4"/><text x="545" y="72" text-anchor="middle" fill="#3f9c8b" font-size="12.5" font-weight="bold">SSH first management</text><text x="545" y="96" text-anchor="middle" fill="#9a8f7d" font-size="10.5">run a fleet from one terminal</text><rect x="30" y="140" width="330" height="80" rx="8" fill="#262320" stroke="#9a6f9c" stroke-width="1.4"/><text x="195" y="172" text-anchor="middle" fill="#9a6f9c" font-size="12.5" font-weight="bold">a minimal attack surface</text><text x="195" y="196" text-anchor="middle" fill="#9a8f7d" font-size="10.5">install only what you need</text><rect x="380" y="140" width="330" height="80" rx="8" fill="#262320" stroke="#7f8fc0" stroke-width="1.4"/><text x="545" y="172" text-anchor="middle" fill="#7f8fc0" font-size="12.5" font-weight="bold">containers are native</text><text x="545" y="196" text-anchor="middle" fill="#9a8f7d" font-size="10.5">namespaces and cgroups are kernel features</text></svg>