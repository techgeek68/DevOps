<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 328" role="img" aria-label="A performance triage separating the real disk saturation cause from three red herrings" font-family="Verdana, Geneva, DejaVu Sans, sans-serif"><rect x="0" y="0" width="100%" height="100%" fill="#1c1a17"/><defs><marker id="a-ochre" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#d1972f"/></marker><marker id="a-verd" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#3f9c8b"/></marker><marker id="a-terra" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#c0603f"/></marker><marker id="a-sage" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8aa06a"/></marker><marker id="a-plum" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a6f9c"/></marker><marker id="a-peri" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7f8fc0"/></marker><marker id="a-parch" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e7ddcb"/></marker><marker id="a-faint" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a8f7d"/></marker><marker id="a-rule" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#4a453d"/></marker></defs><rect x="230" y="110" width="260" height="80" rx="8" fill="#262320" stroke="#c0603f" stroke-width="1.4"/><text x="360" y="140" text-anchor="middle" fill="#c0603f" font-size="13" font-weight="bold">the real cause</text><text x="360" y="162" text-anchor="middle" fill="#e7ddcb" font-size="10.5">disk writes saturating the vdisk</text><text x="360" y="180" text-anchor="middle" fill="#9a8f7d" font-size="8.5" font-family="Consolas, DejaVu Sans Mono, monospace">iostat: %util near 100, await high</text><rect x="60" y="40" width="190" height="60" rx="8" fill="#151310" stroke="#4a453d" stroke-width="1.4"/><text x="155" y="66" text-anchor="middle" fill="#d1972f" font-size="11" font-weight="bold">one busy core</text><text x="155" y="85" text-anchor="middle" fill="#9a8f7d" font-size="9">the box has many</text><text x="155" y="70" text-anchor="middle" fill="#c0603f" font-size="30" font-weight="bold">✕</text><rect x="470" y="40" width="190" height="60" rx="8" fill="#151310" stroke="#4a453d" stroke-width="1.4"/><text x="565" y="66" text-anchor="middle" fill="#9a6f9c" font-size="11" font-weight="bold">large page cache</text><text x="565" y="85" text-anchor="middle" fill="#9a8f7d" font-size="9">'free' looks low but is not</text><text x="565" y="70" text-anchor="middle" fill="#c0603f" font-size="30" font-weight="bold">✕</text><rect x="470" y="230" width="190" height="60" rx="8" fill="#151310" stroke="#4a453d" stroke-width="1.4"/><text x="565" y="256" text-anchor="middle" fill="#7f8fc0" font-size="11" font-weight="bold">idle connections</text><text x="565" y="275" text-anchor="middle" fill="#9a8f7d" font-size="9">established, doing nothing</text><text x="565" y="260" text-anchor="middle" fill="#c0603f" font-size="30" font-weight="bold">✕</text><text x="60" y="230" text-anchor="start" fill="#9a8f7d" font-size="10" font-weight="bold">red herrings</text><rect x="60" y="250" width="190" height="40" rx="8" fill="#151310" stroke="#4a453d" stroke-width="1.4"/><text x="155" y="275" text-anchor="middle" fill="#9a8f7d" font-size="9.5">look, but rule each out</text><text x="360" y="308" text-anchor="middle" fill="#9a8f7d" font-size="10.5">measure each resource, discard what does not move under load, and name the one that does</text></svg>