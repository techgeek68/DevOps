<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270" role="img" aria-label="Login shells reading the profile files versus non login shells reading only bashrc" font-family="Verdana, Geneva, DejaVu Sans, sans-serif"><rect x="0" y="0" width="100%" height="100%" fill="#1c1a17"/><defs><marker id="a-ochre" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#d1972f"/></marker><marker id="a-verd" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#3f9c8b"/></marker><marker id="a-terra" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#c0603f"/></marker><marker id="a-sage" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8aa06a"/></marker><marker id="a-plum" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a6f9c"/></marker><marker id="a-peri" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7f8fc0"/></marker><marker id="a-parch" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e7ddcb"/></marker><marker id="a-faint" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a8f7d"/></marker><marker id="a-rule" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#4a453d"/></marker></defs><rect x="40" y="50" width="300" height="200" rx="12" fill="#151310" stroke="#d1972f" stroke-width="1.4"/><text x="190" y="76" text-anchor="middle" fill="#d1972f" font-size="13" font-weight="bold">login shell</text><text x="190" y="94" text-anchor="middle" fill="#9a8f7d" font-size="9">ssh in, or console login</text><rect x="60" y="110" width="260" height="32" rx="8" fill="#262320" stroke="#d1972f" stroke-width="1.4"/><text x="190" y="131" text-anchor="middle" fill="#e7ddcb" font-size="10.5" font-family="Consolas, DejaVu Sans Mono, monospace">/etc/profile</text><line x1="190" y1="142" x2="190" y2="154" stroke="#d1972f" stroke-width="1.6" fill="none" marker-end="url(#a-ochre)"/><rect x="60" y="154" width="260" height="32" rx="8" fill="#262320" stroke="#d1972f" stroke-width="1.4"/><text x="190" y="175" text-anchor="middle" fill="#e7ddcb" font-size="10.5" font-family="Consolas, DejaVu Sans Mono, monospace">~/.bash_profile</text><line x1="190" y1="186" x2="190" y2="198" stroke="#d1972f" stroke-width="1.6" fill="none" marker-end="url(#a-ochre)"/><rect x="60" y="198" width="260" height="32" rx="8" fill="#262320" stroke="#d1972f" stroke-width="1.4"/><text x="190" y="219" text-anchor="middle" fill="#e7ddcb" font-size="10.5" font-family="Consolas, DejaVu Sans Mono, monospace">~/.bashrc  (usually sourced from it)</text><rect x="380" y="50" width="300" height="200" rx="12" fill="#151310" stroke="#3f9c8b" stroke-width="1.4"/><text x="530" y="76" text-anchor="middle" fill="#3f9c8b" font-size="13" font-weight="bold">non login shell</text><text x="530" y="94" text-anchor="middle" fill="#9a8f7d" font-size="9">a new terminal in a session</text><rect x="430" y="130" width="200" height="40" rx="8" fill="#262320" stroke="#3f9c8b" stroke-width="1.4"/><text x="530" y="155" text-anchor="middle" fill="#e7ddcb" font-size="11" font-family="Consolas, DejaVu Sans Mono, monospace">~/.bashrc  only</text><text x="530" y="210" text-anchor="middle" fill="#9a8f7d" font-size="9.5">so shared settings go in bashrc,</text><text x="530" y="226" text-anchor="middle" fill="#9a8f7d" font-size="9.5">and login only setup in profile</text></svg>