<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 312" role="img" aria-label="The Linux filesystem hierarchy as a tree from root with etc, var, usr, home, and other top level directories" font-family="Verdana, Geneva, DejaVu Sans, sans-serif"><rect x="0" y="0" width="100%" height="100%" fill="#1c1a17"/><defs><marker id="a-ochre" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#d1972f"/></marker><marker id="a-verd" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#3f9c8b"/></marker><marker id="a-terra" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#c0603f"/></marker><marker id="a-sage" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8aa06a"/></marker><marker id="a-plum" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a6f9c"/></marker><marker id="a-peri" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7f8fc0"/></marker><marker id="a-parch" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e7ddcb"/></marker><marker id="a-faint" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a8f7d"/></marker><marker id="a-rule" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#4a453d"/></marker></defs><rect x="320" y="30" width="80" height="34" rx="8" fill="#262320" stroke="#d1972f" stroke-width="1.4"/><text x="360" y="52" text-anchor="middle" fill="#d1972f" font-size="16" font-weight="bold">/</text><rect x="30" y="120" width="155" height="54" rx="8" fill="#262320" stroke="#3f9c8b" stroke-width="1.4"/><text x="107" y="142" text-anchor="middle" fill="#3f9c8b" font-size="13" font-weight="bold" font-family="Consolas, DejaVu Sans Mono, monospace">/etc</text><text x="107" y="160" text-anchor="middle" fill="#9a8f7d" font-size="10">config</text><line x1="360" y1="64" x2="107" y2="120" stroke="#3f9c8b" stroke-width="1" fill="none" stroke-dasharray="2 3" marker-end="url(#a-verd)"/><rect x="205" y="120" width="155" height="54" rx="8" fill="#262320" stroke="#c0603f" stroke-width="1.4"/><text x="282" y="142" text-anchor="middle" fill="#c0603f" font-size="13" font-weight="bold" font-family="Consolas, DejaVu Sans Mono, monospace">/var</text><text x="282" y="160" text-anchor="middle" fill="#9a8f7d" font-size="10">logs, data</text><line x1="360" y1="64" x2="282" y2="120" stroke="#c0603f" stroke-width="1" fill="none" stroke-dasharray="2 3" marker-end="url(#a-terra)"/><rect x="380" y="120" width="155" height="54" rx="8" fill="#262320" stroke="#9a6f9c" stroke-width="1.4"/><text x="457" y="142" text-anchor="middle" fill="#9a6f9c" font-size="13" font-weight="bold" font-family="Consolas, DejaVu Sans Mono, monospace">/usr</text><text x="457" y="160" text-anchor="middle" fill="#9a8f7d" font-size="10">programs</text><line x1="360" y1="64" x2="457" y2="120" stroke="#9a6f9c" stroke-width="1" fill="none" stroke-dasharray="2 3" marker-end="url(#a-plum)"/><rect x="555" y="120" width="155" height="54" rx="8" fill="#262320" stroke="#8aa06a" stroke-width="1.4"/><text x="632" y="142" text-anchor="middle" fill="#8aa06a" font-size="13" font-weight="bold" font-family="Consolas, DejaVu Sans Mono, monospace">/home</text><text x="632" y="160" text-anchor="middle" fill="#9a8f7d" font-size="10">user files</text><line x1="360" y1="64" x2="632" y2="120" stroke="#8aa06a" stroke-width="1" fill="none" stroke-dasharray="2 3" marker-end="url(#a-sage)"/><rect x="30" y="200" width="155" height="54" rx="8" fill="#262320" stroke="#7f8fc0" stroke-width="1.4"/><text x="107" y="222" text-anchor="middle" fill="#7f8fc0" font-size="13" font-weight="bold" font-family="Consolas, DejaVu Sans Mono, monospace">/bin</text><text x="107" y="240" text-anchor="middle" fill="#9a8f7d" font-size="10">core tools</text><line x1="360" y1="64" x2="107" y2="200" stroke="#7f8fc0" stroke-width="1" fill="none" stroke-dasharray="2 3" marker-end="url(#a-peri)"/><rect x="205" y="200" width="155" height="54" rx="8" fill="#262320" stroke="#d1972f" stroke-width="1.4"/><text x="282" y="222" text-anchor="middle" fill="#d1972f" font-size="13" font-weight="bold" font-family="Consolas, DejaVu Sans Mono, monospace">/tmp</text><text x="282" y="240" text-anchor="middle" fill="#9a8f7d" font-size="10">scratch</text><line x1="360" y1="64" x2="282" y2="200" stroke="#d1972f" stroke-width="1" fill="none" stroke-dasharray="2 3" marker-end="url(#a-ochre)"/><rect x="380" y="200" width="155" height="54" rx="8" fill="#262320" stroke="#4a453d" stroke-width="1.4"/><text x="457" y="222" text-anchor="middle" fill="#4a453d" font-size="13" font-weight="bold" font-family="Consolas, DejaVu Sans Mono, monospace">/proc</text><text x="457" y="240" text-anchor="middle" fill="#9a8f7d" font-size="10">kernel view</text><line x1="360" y1="64" x2="457" y2="200" stroke="#4a453d" stroke-width="1" fill="none" stroke-dasharray="2 3" marker-end="url(#a-faint)"/><rect x="555" y="200" width="155" height="54" rx="8" fill="#262320" stroke="#3f9c8b" stroke-width="1.4"/><text x="632" y="222" text-anchor="middle" fill="#3f9c8b" font-size="13" font-weight="bold" font-family="Consolas, DejaVu Sans Mono, monospace">/opt</text><text x="632" y="240" text-anchor="middle" fill="#9a8f7d" font-size="10">add ons</text><line x1="360" y1="64" x2="632" y2="200" stroke="#3f9c8b" stroke-width="1" fill="none" stroke-dasharray="2 3" marker-end="url(#a-verd)"/><text x="360" y="296" text-anchor="middle" fill="#9a8f7d" font-size="10.5">everything hangs off a single root, and each top level directory has one job</text></svg>