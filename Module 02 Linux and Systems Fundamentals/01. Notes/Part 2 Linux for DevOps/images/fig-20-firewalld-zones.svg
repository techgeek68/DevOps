<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 256" role="img" aria-label="An interface assigned to the public firewalld zone allowing only listed services" font-family="Verdana, Geneva, DejaVu Sans, sans-serif"><rect x="0" y="0" width="100%" height="100%" fill="#1c1a17"/><defs><marker id="a-ochre" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#d1972f"/></marker><marker id="a-verd" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#3f9c8b"/></marker><marker id="a-terra" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#c0603f"/></marker><marker id="a-sage" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8aa06a"/></marker><marker id="a-plum" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a6f9c"/></marker><marker id="a-peri" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7f8fc0"/></marker><marker id="a-parch" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e7ddcb"/></marker><marker id="a-faint" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a8f7d"/></marker><marker id="a-rule" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#4a453d"/></marker></defs><rect x="40" y="110" width="140" height="60" rx="8" fill="#262320" stroke="#7f8fc0" stroke-width="1.4"/><text x="110" y="136" text-anchor="middle" fill="#e7ddcb" font-size="12" font-weight="bold">interface</text><text x="110" y="156" text-anchor="middle" fill="#9a8f7d" font-size="9.5" font-family="Consolas, DejaVu Sans Mono, monospace">enp1s0</text><rect x="280" y="90" width="170" height="100" rx="8" fill="#151310" stroke="#d1972f" stroke-width="1.4"/><text x="365" y="116" text-anchor="middle" fill="#d1972f" font-size="13" font-weight="bold">zone: public</text><text x="365" y="140" text-anchor="middle" fill="#e7ddcb" font-size="10">default deny inbound</text><text x="365" y="160" text-anchor="middle" fill="#9a8f7d" font-size="9">allow only what you list</text><rect x="540" y="80" width="160" height="40" rx="8" fill="#262320" stroke="#8aa06a" stroke-width="1.4"/><text x="620" y="98" text-anchor="middle" fill="#e7ddcb" font-size="10.5" font-family="Consolas, DejaVu Sans Mono, monospace">ssh  22/tcp</text><text x="620" y="114" text-anchor="middle" fill="#8aa06a" font-size="9">allowed</text><line x1="450" y1="140" x2="538" y2="100" stroke="#8aa06a" stroke-width="1.6" fill="none" marker-end="url(#a-sage)"/><rect x="540" y="130" width="160" height="40" rx="8" fill="#262320" stroke="#8aa06a" stroke-width="1.4"/><text x="620" y="148" text-anchor="middle" fill="#e7ddcb" font-size="10.5" font-family="Consolas, DejaVu Sans Mono, monospace">http  80/tcp</text><text x="620" y="164" text-anchor="middle" fill="#8aa06a" font-size="9">allowed</text><line x1="450" y1="140" x2="538" y2="150" stroke="#8aa06a" stroke-width="1.6" fill="none" marker-end="url(#a-sage)"/><rect x="540" y="180" width="160" height="40" rx="8" fill="#262320" stroke="#c0603f" stroke-width="1.4"/><text x="620" y="198" text-anchor="middle" fill="#e7ddcb" font-size="10.5" font-family="Consolas, DejaVu Sans Mono, monospace">everything else</text><text x="620" y="214" text-anchor="middle" fill="#c0603f" font-size="9">dropped</text><line x1="450" y1="140" x2="538" y2="200" stroke="#c0603f" stroke-width="1.6" fill="none" stroke-dasharray="3 3" marker-end="url(#a-terra)"/><line x1="180" y1="140" x2="278" y2="140" stroke="#d1972f" stroke-width="1.6" fill="none" marker-end="url(#a-ochre)"/><text x="360" y="236" text-anchor="middle" fill="#9a8f7d" font-size="10.5">an interface belongs to a zone, and the zone decides which services and ports are allowed</text></svg>