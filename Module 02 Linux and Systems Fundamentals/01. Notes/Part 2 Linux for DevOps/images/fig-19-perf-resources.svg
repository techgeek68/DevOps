<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 262" role="img" aria-label="The four system resources CPU, memory, disk, and network with the tools that measure each" font-family="Verdana, Geneva, DejaVu Sans, sans-serif"><rect x="0" y="0" width="100%" height="100%" fill="#1c1a17"/><defs><marker id="a-ochre" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#d1972f"/></marker><marker id="a-verd" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#3f9c8b"/></marker><marker id="a-terra" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#c0603f"/></marker><marker id="a-sage" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8aa06a"/></marker><marker id="a-plum" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a6f9c"/></marker><marker id="a-peri" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7f8fc0"/></marker><marker id="a-parch" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e7ddcb"/></marker><marker id="a-faint" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a8f7d"/></marker><marker id="a-rule" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#4a453d"/></marker></defs><rect x="30" y="40" width="330" height="75" rx="8" fill="#262320" stroke="#d1972f" stroke-width="1.4"/><text x="195" y="66" text-anchor="middle" fill="#d1972f" font-size="13" font-weight="bold">CPU</text><text x="195" y="86" text-anchor="middle" fill="#e7ddcb" font-size="10.5" font-family="Consolas, DejaVu Sans Mono, monospace">top · htop · uptime</text><text x="195" y="103" text-anchor="middle" fill="#9a8f7d" font-size="9.5">load average, run queue</text><rect x="380" y="40" width="330" height="75" rx="8" fill="#262320" stroke="#3f9c8b" stroke-width="1.4"/><text x="545" y="66" text-anchor="middle" fill="#3f9c8b" font-size="13" font-weight="bold">memory</text><text x="545" y="86" text-anchor="middle" fill="#e7ddcb" font-size="10.5" font-family="Consolas, DejaVu Sans Mono, monospace">free · vmstat</text><text x="545" y="103" text-anchor="middle" fill="#9a8f7d" font-size="9.5">used vs cache vs swap</text><rect x="30" y="135" width="330" height="75" rx="8" fill="#262320" stroke="#c0603f" stroke-width="1.4"/><text x="195" y="161" text-anchor="middle" fill="#c0603f" font-size="13" font-weight="bold">disk I/O</text><text x="195" y="181" text-anchor="middle" fill="#e7ddcb" font-size="10.5" font-family="Consolas, DejaVu Sans Mono, monospace">iostat · iotop</text><text x="195" y="198" text-anchor="middle" fill="#9a8f7d" font-size="9.5">%util and await</text><rect x="380" y="135" width="330" height="75" rx="8" fill="#262320" stroke="#7f8fc0" stroke-width="1.4"/><text x="545" y="161" text-anchor="middle" fill="#7f8fc0" font-size="13" font-weight="bold">network</text><text x="545" y="181" text-anchor="middle" fill="#e7ddcb" font-size="10.5" font-family="Consolas, DejaVu Sans Mono, monospace">ss · iftop</text><text x="545" y="198" text-anchor="middle" fill="#9a8f7d" font-size="9.5">sockets and throughput</text><text x="360" y="246" text-anchor="middle" fill="#9a8f7d" font-size="10.5">triage by resource: find which of the four is the bottleneck before changing anything</text></svg>