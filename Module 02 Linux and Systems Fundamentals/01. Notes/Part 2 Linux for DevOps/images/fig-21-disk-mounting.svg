<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" role="img" aria-label="The path from a physical disk through a partition and filesystem to a mount point in the directory tree" font-family="Verdana, Geneva, DejaVu Sans, sans-serif"><rect x="0" y="0" width="100%" height="100%" fill="#1c1a17"/><defs><marker id="a-ochre" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#d1972f"/></marker><marker id="a-verd" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#3f9c8b"/></marker><marker id="a-terra" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#c0603f"/></marker><marker id="a-sage" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8aa06a"/></marker><marker id="a-plum" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a6f9c"/></marker><marker id="a-peri" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7f8fc0"/></marker><marker id="a-parch" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e7ddcb"/></marker><marker id="a-faint" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a8f7d"/></marker><marker id="a-rule" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#4a453d"/></marker></defs><rect x="30" y="100" width="155" height="60" rx="8" fill="#262320" stroke="#7f8fc0" stroke-width="1.4"/><text x="107.5" y="128" text-anchor="middle" fill="#7f8fc0" font-size="12.5" font-weight="bold" font-family="Consolas, DejaVu Sans Mono, monospace">/dev/sda</text><text x="107.5" y="147" text-anchor="middle" fill="#9a8f7d" font-size="9">the physical disk</text><line x1="185" y1="130" x2="205" y2="130" stroke="#d1972f" stroke-width="1.6" fill="none" marker-end="url(#a-ochre)"/><rect x="205" y="100" width="155" height="60" rx="8" fill="#262320" stroke="#d1972f" stroke-width="1.4"/><text x="282.5" y="128" text-anchor="middle" fill="#d1972f" font-size="12.5" font-weight="bold" font-family="Consolas, DejaVu Sans Mono, monospace">/dev/sda1</text><text x="282.5" y="147" text-anchor="middle" fill="#9a8f7d" font-size="9">a partition</text><line x1="360" y1="130" x2="380" y2="130" stroke="#d1972f" stroke-width="1.6" fill="none" marker-end="url(#a-ochre)"/><rect x="380" y="100" width="155" height="60" rx="8" fill="#262320" stroke="#3f9c8b" stroke-width="1.4"/><text x="457.5" y="128" text-anchor="middle" fill="#3f9c8b" font-size="12.5" font-weight="bold" font-family="Consolas, DejaVu Sans Mono, monospace">xfs</text><text x="457.5" y="147" text-anchor="middle" fill="#9a8f7d" font-size="9">a filesystem on it</text><line x1="535" y1="130" x2="555" y2="130" stroke="#d1972f" stroke-width="1.6" fill="none" marker-end="url(#a-ochre)"/><rect x="555" y="100" width="155" height="60" rx="8" fill="#262320" stroke="#9a6f9c" stroke-width="1.4"/><text x="632.5" y="128" text-anchor="middle" fill="#9a6f9c" font-size="12.5" font-weight="bold" font-family="Consolas, DejaVu Sans Mono, monospace">/data</text><text x="632.5" y="147" text-anchor="middle" fill="#9a8f7d" font-size="9">mounted into the tree</text><text x="360" y="60" text-anchor="middle" fill="#9a8f7d" font-size="11">partition it, format it, then mount it somewhere in the one tree</text><text x="360" y="196" text-anchor="middle" fill="#9a8f7d" font-size="10.5">until it is mounted at a path, a filesystem is not reachable; /etc/fstab makes a mount survive reboot</text></svg>