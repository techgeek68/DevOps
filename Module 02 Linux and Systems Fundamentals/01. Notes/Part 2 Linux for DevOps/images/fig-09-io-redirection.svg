<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" role="img" aria-label="A process with its stdin, stdout, and stderr streams and the operators that redirect them" font-family="Verdana, Geneva, DejaVu Sans, sans-serif"><rect x="0" y="0" width="100%" height="100%" fill="#1c1a17"/><defs><marker id="a-ochre" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#d1972f"/></marker><marker id="a-verd" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#3f9c8b"/></marker><marker id="a-terra" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#c0603f"/></marker><marker id="a-sage" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8aa06a"/></marker><marker id="a-plum" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a6f9c"/></marker><marker id="a-peri" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7f8fc0"/></marker><marker id="a-parch" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e7ddcb"/></marker><marker id="a-faint" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a8f7d"/></marker><marker id="a-rule" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#4a453d"/></marker></defs><rect x="280" y="90" width="160" height="70" rx="8" fill="#151310" stroke="#d1972f" stroke-width="1.4"/><text x="360" y="120" text-anchor="middle" fill="#d1972f" font-size="13" font-weight="bold">a process</text><text x="360" y="142" text-anchor="middle" fill="#9a8f7d" font-size="9.5">three open streams</text><rect x="60" y="60" width="150" height="34" rx="8" fill="#262320" stroke="#7f8fc0" stroke-width="1.4"/><text x="135" y="82" text-anchor="middle" fill="#e7ddcb" font-size="11" font-family="Consolas, DejaVu Sans Mono, monospace">stdin  fd 0</text><line x1="210" y1="77" x2="278" y2="105" stroke="#7f8fc0" stroke-width="1.6" fill="none" marker-end="url(#a-peri)"/><rect x="510" y="60" width="150" height="34" rx="8" fill="#262320" stroke="#3f9c8b" stroke-width="1.4"/><text x="585" y="82" text-anchor="middle" fill="#e7ddcb" font-size="11" font-family="Consolas, DejaVu Sans Mono, monospace">stdout  fd 1</text><line x1="440" y1="105" x2="508" y2="77" stroke="#3f9c8b" stroke-width="1.6" fill="none" marker-end="url(#a-verd)"/><rect x="510" y="150" width="150" height="34" rx="8" fill="#262320" stroke="#c0603f" stroke-width="1.4"/><text x="585" y="172" text-anchor="middle" fill="#e7ddcb" font-size="11" font-family="Consolas, DejaVu Sans Mono, monospace">stderr  fd 2</text><line x1="440" y1="145" x2="508" y2="167" stroke="#c0603f" stroke-width="1.6" fill="none" marker-end="url(#a-terra)"/><text x="40" y="210" text-anchor="start" fill="#3f9c8b" font-size="12" font-weight="bold" font-family="Consolas, DejaVu Sans Mono, monospace">&gt;  file</text><text x="130" y="210" text-anchor="start" fill="#9a8f7d" font-size="10.5">overwrite stdout</text><text x="400" y="210" text-anchor="start" fill="#3f9c8b" font-size="12" font-weight="bold" font-family="Consolas, DejaVu Sans Mono, monospace">&gt;&gt; file</text><text x="490" y="210" text-anchor="start" fill="#9a8f7d" font-size="10.5">append stdout</text><text x="40" y="244" text-anchor="start" fill="#c0603f" font-size="12" font-weight="bold" font-family="Consolas, DejaVu Sans Mono, monospace">2&gt; file</text><text x="130" y="244" text-anchor="start" fill="#9a8f7d" font-size="10.5">capture stderr</text><text x="400" y="244" text-anchor="start" fill="#7f8fc0" font-size="12" font-weight="bold" font-family="Consolas, DejaVu Sans Mono, monospace">&lt;  file</text><text x="490" y="244" text-anchor="start" fill="#9a8f7d" font-size="10.5">feed stdin</text></svg>