<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 230" role="img" aria-label="A systemd timer unit triggering its paired service unit on a schedule" font-family="Verdana, Geneva, DejaVu Sans, sans-serif"><rect x="0" y="0" width="100%" height="100%" fill="#1c1a17"/><defs><marker id="a-ochre" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#d1972f"/></marker><marker id="a-verd" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#3f9c8b"/></marker><marker id="a-terra" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#c0603f"/></marker><marker id="a-sage" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8aa06a"/></marker><marker id="a-plum" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a6f9c"/></marker><marker id="a-peri" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7f8fc0"/></marker><marker id="a-parch" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e7ddcb"/></marker><marker id="a-faint" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a8f7d"/></marker><marker id="a-rule" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#4a453d"/></marker></defs><rect x="80" y="90" width="200" height="80" rx="8" fill="#151310" stroke="#d1972f" stroke-width="1.4"/><text x="180" y="116" text-anchor="middle" fill="#d1972f" font-size="13" font-weight="bold" font-family="Consolas, DejaVu Sans Mono, monospace">backup.timer</text><text x="180" y="138" text-anchor="middle" fill="#e7ddcb" font-size="10" font-family="Consolas, DejaVu Sans Mono, monospace">OnCalendar=daily</text><text x="180" y="156" text-anchor="middle" fill="#9a8f7d" font-size="9" font-family="Consolas, DejaVu Sans Mono, monospace">Persistent=true</text><rect x="440" y="90" width="200" height="80" rx="8" fill="#151310" stroke="#3f9c8b" stroke-width="1.4"/><text x="540" y="116" text-anchor="middle" fill="#3f9c8b" font-size="13" font-weight="bold" font-family="Consolas, DejaVu Sans Mono, monospace">backup.service</text><text x="540" y="138" text-anchor="middle" fill="#e7ddcb" font-size="10" font-family="Consolas, DejaVu Sans Mono, monospace">Type=oneshot</text><text x="540" y="156" text-anchor="middle" fill="#9a8f7d" font-size="9">runs the job</text><line x1="280" y1="130" x2="438" y2="130" stroke="#d1972f" stroke-width="2" fill="none" marker-end="url(#a-ochre)"/><text x="360" y="120" text-anchor="middle" fill="#d1972f" font-size="10">triggers</text><text x="360" y="206" text-anchor="middle" fill="#9a8f7d" font-size="10.5">the timer says when, the service says what; Persistent catches a run the machine missed while off</text></svg>