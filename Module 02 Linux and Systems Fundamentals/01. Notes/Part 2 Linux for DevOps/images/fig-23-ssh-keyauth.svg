<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 236" role="img" aria-label="SSH key based authentication with the private key on the client and the public key in authorized keys on the server" font-family="Verdana, Geneva, DejaVu Sans, sans-serif"><rect x="0" y="0" width="100%" height="100%" fill="#1c1a17"/><defs><marker id="a-ochre" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#d1972f"/></marker><marker id="a-verd" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#3f9c8b"/></marker><marker id="a-terra" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#c0603f"/></marker><marker id="a-sage" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8aa06a"/></marker><marker id="a-plum" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a6f9c"/></marker><marker id="a-peri" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7f8fc0"/></marker><marker id="a-parch" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e7ddcb"/></marker><marker id="a-faint" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a8f7d"/></marker><marker id="a-rule" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#4a453d"/></marker></defs><rect x="40" y="100" width="180" height="80" rx="8" fill="#151310" stroke="#d1972f" stroke-width="1.4"/><text x="130" y="126" text-anchor="middle" fill="#d1972f" font-size="13" font-weight="bold">client</text><rect x="60" y="138" width="140" height="30" rx="8" fill="#262320" stroke="#3f9c8b" stroke-width="1.4"/><text x="130" y="158" text-anchor="middle" fill="#e7ddcb" font-size="10.5">private key</text><rect x="500" y="100" width="180" height="80" rx="8" fill="#151310" stroke="#9a6f9c" stroke-width="1.4"/><text x="590" y="126" text-anchor="middle" fill="#9a6f9c" font-size="13" font-weight="bold">server</text><rect x="520" y="138" width="140" height="30" rx="8" fill="#262320" stroke="#7f8fc0" stroke-width="1.4"/><text x="590" y="158" text-anchor="middle" fill="#e7ddcb" font-size="9.5" font-family="Consolas, DejaVu Sans Mono, monospace">authorized_keys</text><line x1="220" y1="120" x2="498" y2="120" stroke="#9a6f9c" stroke-width="1.6" fill="none" marker-end="url(#a-plum)"/><text x="360" y="112" text-anchor="middle" fill="#9a8f7d" font-size="9.5">1 · server sends a challenge</text><line x1="498" y1="160" x2="220" y2="160" stroke="#3f9c8b" stroke-width="1.6" fill="none" marker-end="url(#a-verd)"/><text x="360" y="176" text-anchor="middle" fill="#9a8f7d" font-size="9.5">2 · client signs it with the private key</text><text x="360" y="214" text-anchor="middle" fill="#9a8f7d" font-size="10.5">the private key never leaves the client, and no password crosses the wire</text></svg>