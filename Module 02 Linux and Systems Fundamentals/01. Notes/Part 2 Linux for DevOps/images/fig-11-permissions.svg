<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 226" role="img" aria-label="The rwx permission bits for owner, group, and other mapped to their octal values" font-family="Verdana, Geneva, DejaVu Sans, sans-serif"><rect x="0" y="0" width="100%" height="100%" fill="#1c1a17"/><defs><marker id="a-ochre" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#d1972f"/></marker><marker id="a-verd" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#3f9c8b"/></marker><marker id="a-terra" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#c0603f"/></marker><marker id="a-sage" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8aa06a"/></marker><marker id="a-plum" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a6f9c"/></marker><marker id="a-peri" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7f8fc0"/></marker><marker id="a-parch" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e7ddcb"/></marker><marker id="a-faint" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a8f7d"/></marker><marker id="a-rule" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#4a453d"/></marker></defs><text x="360" y="34" text-anchor="middle" fill="#e7ddcb" font-size="22" font-weight="bold" font-family="Consolas, DejaVu Sans Mono, monospace">- rwx r-x r--</text><rect x="95" y="70" width="160" height="80" rx="8" fill="#151310" stroke="#d1972f" stroke-width="1.4"/><text x="175" y="96" text-anchor="middle" fill="#d1972f" font-size="12" font-weight="bold">owner</text><text x="175" y="120" text-anchor="middle" fill="#e7ddcb" font-size="16" font-weight="bold" font-family="Consolas, DejaVu Sans Mono, monospace">rwx</text><text x="175" y="140" text-anchor="middle" fill="#9a8f7d" font-size="10" font-family="Consolas, DejaVu Sans Mono, monospace">7 = 4+2+1</text><rect x="280" y="70" width="160" height="80" rx="8" fill="#151310" stroke="#3f9c8b" stroke-width="1.4"/><text x="360" y="96" text-anchor="middle" fill="#3f9c8b" font-size="12" font-weight="bold">group</text><text x="360" y="120" text-anchor="middle" fill="#e7ddcb" font-size="16" font-weight="bold" font-family="Consolas, DejaVu Sans Mono, monospace">r-x</text><text x="360" y="140" text-anchor="middle" fill="#9a8f7d" font-size="10" font-family="Consolas, DejaVu Sans Mono, monospace">5 = 4+0+1</text><rect x="465" y="70" width="160" height="80" rx="8" fill="#151310" stroke="#9a6f9c" stroke-width="1.4"/><text x="545" y="96" text-anchor="middle" fill="#9a6f9c" font-size="12" font-weight="bold">other</text><text x="545" y="120" text-anchor="middle" fill="#e7ddcb" font-size="16" font-weight="bold" font-family="Consolas, DejaVu Sans Mono, monospace">r--</text><text x="545" y="140" text-anchor="middle" fill="#9a8f7d" font-size="10" font-family="Consolas, DejaVu Sans Mono, monospace">4 = 4+0+0</text><text x="360" y="182" text-anchor="middle" fill="#9a8f7d" font-size="11" font-family="Consolas, DejaVu Sans Mono, monospace">r = read (4)     w = write (2)     x = execute (1)</text><text x="360" y="206" text-anchor="middle" fill="#9a8f7d" font-size="10.5">three bits each for owner, group, and everyone else</text></svg>