<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 258" role="img" aria-label="The setuid, setgid, and sticky bit special permissions and what each one does" font-family="Verdana, Geneva, DejaVu Sans, sans-serif"><rect x="0" y="0" width="100%" height="100%" fill="#1c1a17"/><defs><marker id="a-ochre" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#d1972f"/></marker><marker id="a-verd" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#3f9c8b"/></marker><marker id="a-terra" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#c0603f"/></marker><marker id="a-sage" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8aa06a"/></marker><marker id="a-plum" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a6f9c"/></marker><marker id="a-peri" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7f8fc0"/></marker><marker id="a-parch" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e7ddcb"/></marker><marker id="a-faint" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a8f7d"/></marker><marker id="a-rule" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#4a453d"/></marker></defs><rect x="40" y="40" width="620" height="58" rx="8" fill="#262320" stroke="#d1972f" stroke-width="1.4"/><text x="58" y="64" text-anchor="start" fill="#d1972f" font-size="12.5" font-weight="bold" font-family="Consolas, DejaVu Sans Mono, monospace">setuid</text><text x="58" y="84" text-anchor="start" fill="#e7ddcb" font-size="10.5">runs as the file's owner</text><text x="642" y="74" text-anchor="end" fill="#9a8f7d" font-size="10">passwd runs as root</text><rect x="40" y="110" width="620" height="58" rx="8" fill="#262320" stroke="#3f9c8b" stroke-width="1.4"/><text x="58" y="134" text-anchor="start" fill="#3f9c8b" font-size="12.5" font-weight="bold" font-family="Consolas, DejaVu Sans Mono, monospace">setgid</text><text x="58" y="154" text-anchor="start" fill="#e7ddcb" font-size="10.5">runs as the file's group, or new files inherit the dir group</text><text x="642" y="144" text-anchor="end" fill="#9a8f7d" font-size="10">shared team folders</text><rect x="40" y="180" width="620" height="58" rx="8" fill="#262320" stroke="#9a6f9c" stroke-width="1.4"/><text x="58" y="204" text-anchor="start" fill="#9a6f9c" font-size="12.5" font-weight="bold" font-family="Consolas, DejaVu Sans Mono, monospace">sticky bit</text><text x="58" y="224" text-anchor="start" fill="#e7ddcb" font-size="10.5">only the owner may delete their file</text><text x="642" y="214" text-anchor="end" fill="#9a8f7d" font-size="10">/tmp for everyone</text></svg>