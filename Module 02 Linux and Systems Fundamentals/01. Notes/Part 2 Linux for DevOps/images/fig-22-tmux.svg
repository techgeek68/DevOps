<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="A tmux session on the server holding windows and panes, with a laptop attaching and detaching" font-family="Verdana, Geneva, DejaVu Sans, sans-serif"><rect x="0" y="0" width="100%" height="100%" fill="#1c1a17"/><defs><marker id="a-ochre" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#d1972f"/></marker><marker id="a-verd" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#3f9c8b"/></marker><marker id="a-terra" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#c0603f"/></marker><marker id="a-sage" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8aa06a"/></marker><marker id="a-plum" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a6f9c"/></marker><marker id="a-peri" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7f8fc0"/></marker><marker id="a-parch" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e7ddcb"/></marker><marker id="a-faint" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a8f7d"/></marker><marker id="a-rule" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#4a453d"/></marker></defs><rect x="60" y="60" width="300" height="200" rx="12" fill="#151310" stroke="#d1972f" stroke-width="1.4"/><text x="210" y="86" text-anchor="middle" fill="#d1972f" font-size="12" font-weight="bold">tmux session (on the server)</text><rect x="90" y="104" width="240" height="60" rx="8" fill="#1c1a17" stroke="#3f9c8b" stroke-width="1.4"/><text x="210" y="124" text-anchor="middle" fill="#3f9c8b" font-size="10.5" font-weight="bold">window: editor</text><rect x="100" y="132" width="110" height="24" rx="8" fill="#262320" stroke="#3f9c8b" stroke-width="1.4"/><text x="155" y="148" text-anchor="middle" fill="#e7ddcb" font-size="9">pane</text><rect x="215" y="132" width="105" height="24" rx="8" fill="#262320" stroke="#3f9c8b" stroke-width="1.4"/><text x="267" y="148" text-anchor="middle" fill="#e7ddcb" font-size="9">pane</text><rect x="90" y="174" width="240" height="60" rx="8" fill="#1c1a17" stroke="#9a6f9c" stroke-width="1.4"/><text x="210" y="194" text-anchor="middle" fill="#9a6f9c" font-size="10.5" font-weight="bold">window: logs</text><rect x="100" y="202" width="220" height="24" rx="8" fill="#262320" stroke="#9a6f9c" stroke-width="1.4"/><text x="210" y="218" text-anchor="middle" fill="#e7ddcb" font-size="9">pane</text><rect x="500" y="120" width="160" height="50" rx="8" fill="#262320" stroke="#7f8fc0" stroke-width="1.4"/><text x="580" y="150" text-anchor="middle" fill="#e7ddcb" font-size="12" font-weight="bold">your laptop</text><line x1="500" y1="135" x2="362" y2="135" stroke="#8aa06a" stroke-width="1.6" fill="none" marker-end="url(#a-sage)"/><text x="430" y="126" text-anchor="middle" fill="#8aa06a" font-size="9.5">attach</text><line x1="362" y1="175" x2="500" y2="175" stroke="#c0603f" stroke-width="1.6" fill="none" stroke-dasharray="4 3" marker-end="url(#a-terra)"/><text x="430" y="168" text-anchor="middle" fill="#c0603f" font-size="9.5">detach</text><text x="360" y="280" text-anchor="middle" fill="#9a8f7d" font-size="10.5">the session keeps running on the server, so a dropped connection never kills your work</text></svg>