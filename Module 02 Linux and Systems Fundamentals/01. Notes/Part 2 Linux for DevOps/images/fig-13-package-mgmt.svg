<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 226" role="img" aria-label="A package manager fetching from a repository, resolving dependencies, and tracking installed packages" font-family="Verdana, Geneva, DejaVu Sans, sans-serif"><rect x="0" y="0" width="100%" height="100%" fill="#1c1a17"/><defs><marker id="a-ochre" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#d1972f"/></marker><marker id="a-verd" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#3f9c8b"/></marker><marker id="a-terra" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#c0603f"/></marker><marker id="a-sage" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8aa06a"/></marker><marker id="a-plum" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a6f9c"/></marker><marker id="a-peri" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7f8fc0"/></marker><marker id="a-parch" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e7ddcb"/></marker><marker id="a-faint" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a8f7d"/></marker><marker id="a-rule" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#4a453d"/></marker></defs><rect x="40" y="100" width="150" height="60" rx="8" fill="#151310" stroke="#7f8fc0" stroke-width="1.4"/><text x="115" y="126" text-anchor="middle" fill="#7f8fc0" font-size="12" font-weight="bold">repository</text><text x="115" y="146" text-anchor="middle" fill="#9a8f7d" font-size="9">signed packages</text><rect x="280" y="90" width="180" height="80" rx="8" fill="#151310" stroke="#d1972f" stroke-width="1.4"/><text x="370" y="114" text-anchor="middle" fill="#d1972f" font-size="12" font-weight="bold">package manager</text><text x="370" y="136" text-anchor="middle" fill="#e7ddcb" font-size="11" font-family="Consolas, DejaVu Sans Mono, monospace">dnf  or  apt</text><text x="370" y="154" text-anchor="middle" fill="#9a8f7d" font-size="9">resolves dependencies</text><rect x="560" y="100" width="140" height="60" rx="8" fill="#262320" stroke="#8aa06a" stroke-width="1.4"/><text x="630" y="126" text-anchor="middle" fill="#e7ddcb" font-size="12" font-weight="bold">installed</text><text x="630" y="146" text-anchor="middle" fill="#9a8f7d" font-size="9">and tracked</text><line x1="190" y1="130" x2="278" y2="130" stroke="#d1972f" stroke-width="1.6" fill="none" stroke-dasharray="3 3" marker-end="url(#a-ochre)"/><text x="234" y="120" text-anchor="middle" fill="#9a8f7d" font-size="9">fetch</text><line x1="460" y1="130" x2="558" y2="130" stroke="#8aa06a" stroke-width="1.6" fill="none" marker-end="url(#a-sage)"/><text x="360" y="200" text-anchor="middle" fill="#9a8f7d" font-size="10.5">install, remove, and query all go through the manager, which pulls the right dependencies and records what is on the system</text></svg>