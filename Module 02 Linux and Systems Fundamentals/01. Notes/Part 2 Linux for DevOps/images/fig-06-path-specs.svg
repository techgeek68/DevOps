<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 288" role="img" aria-label="The path symbols dot, double dot, tilde, and slash explained" font-family="Verdana, Geneva, DejaVu Sans, sans-serif"><rect x="0" y="0" width="100%" height="100%" fill="#1c1a17"/><defs><marker id="a-ochre" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#d1972f"/></marker><marker id="a-verd" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#3f9c8b"/></marker><marker id="a-terra" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#c0603f"/></marker><marker id="a-sage" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8aa06a"/></marker><marker id="a-plum" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a6f9c"/></marker><marker id="a-peri" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7f8fc0"/></marker><marker id="a-parch" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e7ddcb"/></marker><marker id="a-faint" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a8f7d"/></marker><marker id="a-rule" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#4a453d"/></marker></defs><rect x="60" y="40" width="90" height="38" rx="8" fill="#262320" stroke="#d1972f" stroke-width="1.4"/><text x="105" y="66" text-anchor="middle" fill="#d1972f" font-size="16" font-weight="bold" font-family="Consolas, DejaVu Sans Mono, monospace">.</text><text x="170" y="66" text-anchor="start" fill="#e7ddcb" font-size="12">this directory, where you are now</text><rect x="60" y="90" width="90" height="38" rx="8" fill="#262320" stroke="#3f9c8b" stroke-width="1.4"/><text x="105" y="116" text-anchor="middle" fill="#3f9c8b" font-size="16" font-weight="bold" font-family="Consolas, DejaVu Sans Mono, monospace">..</text><text x="170" y="116" text-anchor="start" fill="#e7ddcb" font-size="12">one directory up</text><rect x="60" y="140" width="90" height="38" rx="8" fill="#262320" stroke="#9a6f9c" stroke-width="1.4"/><text x="105" y="166" text-anchor="middle" fill="#9a6f9c" font-size="16" font-weight="bold" font-family="Consolas, DejaVu Sans Mono, monospace">~</text><text x="170" y="166" text-anchor="start" fill="#e7ddcb" font-size="12">your home directory</text><rect x="60" y="190" width="90" height="38" rx="8" fill="#262320" stroke="#7f8fc0" stroke-width="1.4"/><text x="105" y="216" text-anchor="middle" fill="#7f8fc0" font-size="16" font-weight="bold" font-family="Consolas, DejaVu Sans Mono, monospace">/</text><text x="170" y="216" text-anchor="start" fill="#e7ddcb" font-size="12">the root, top of the tree</text><text x="360" y="246" text-anchor="middle" fill="#9a8f7d" font-size="10.5">an absolute path starts at /, a relative path starts from where you are</text></svg>