<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 264" role="img" aria-label="The Linux process states running, sleeping, uninterruptible, stopped, and zombie" font-family="Verdana, Geneva, DejaVu Sans, sans-serif"><rect x="0" y="0" width="100%" height="100%" fill="#1c1a17"/><defs><marker id="a-ochre" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#d1972f"/></marker><marker id="a-verd" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#3f9c8b"/></marker><marker id="a-terra" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#c0603f"/></marker><marker id="a-sage" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8aa06a"/></marker><marker id="a-plum" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a6f9c"/></marker><marker id="a-peri" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7f8fc0"/></marker><marker id="a-parch" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e7ddcb"/></marker><marker id="a-faint" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a8f7d"/></marker><marker id="a-rule" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#4a453d"/></marker></defs><rect x="15" y="70" width="190" height="54" rx="8" fill="#262320" stroke="#d1972f" stroke-width="1.4"/><text x="110" y="92" text-anchor="middle" fill="#d1972f" font-size="12" font-weight="bold" font-family="Consolas, DejaVu Sans Mono, monospace">R  running</text><text x="110" y="110" text-anchor="middle" fill="#9a8f7d" font-size="9.5">on or waiting for a CPU</text><rect x="265" y="70" width="190" height="54" rx="8" fill="#262320" stroke="#3f9c8b" stroke-width="1.4"/><text x="360" y="92" text-anchor="middle" fill="#3f9c8b" font-size="12" font-weight="bold" font-family="Consolas, DejaVu Sans Mono, monospace">S  sleeping</text><text x="360" y="110" text-anchor="middle" fill="#9a8f7d" font-size="9.5">waiting for an event</text><rect x="15" y="170" width="190" height="54" rx="8" fill="#262320" stroke="#c0603f" stroke-width="1.4"/><text x="110" y="192" text-anchor="middle" fill="#c0603f" font-size="12" font-weight="bold" font-family="Consolas, DejaVu Sans Mono, monospace">D  uninterruptible</text><text x="110" y="210" text-anchor="middle" fill="#9a8f7d" font-size="9.5">waiting on disk I/O</text><rect x="265" y="170" width="190" height="54" rx="8" fill="#262320" stroke="#9a6f9c" stroke-width="1.4"/><text x="360" y="192" text-anchor="middle" fill="#9a6f9c" font-size="12" font-weight="bold" font-family="Consolas, DejaVu Sans Mono, monospace">T  stopped</text><text x="360" y="210" text-anchor="middle" fill="#9a8f7d" font-size="9.5">paused by a signal</text><rect x="515" y="120" width="190" height="54" rx="8" fill="#262320" stroke="#4a453d" stroke-width="1.4"/><text x="610" y="142" text-anchor="middle" fill="#9a8f7d" font-size="12" font-weight="bold" font-family="Consolas, DejaVu Sans Mono, monospace">Z  zombie</text><text x="610" y="160" text-anchor="middle" fill="#9a8f7d" font-size="9.5">finished, not yet reaped</text><line x1="205" y1="90" x2="265" y2="90" stroke="#9a8f7d" stroke-width="1" fill="none" stroke-dasharray="2 3" marker-end="url(#a-faint)"/><line x1="205" y1="140" x2="265" y2="180" stroke="#9a8f7d" stroke-width="1" fill="none" stroke-dasharray="2 3" marker-end="url(#a-faint)"/><text x="360" y="244" text-anchor="middle" fill="#9a8f7d" font-size="10.5">the STAT column in ps and top shows these; a pile of D means disk, a pile of Z means a parent that never waited</text></svg>