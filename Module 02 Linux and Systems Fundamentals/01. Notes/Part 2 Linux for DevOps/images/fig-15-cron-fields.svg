<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 210" role="img" aria-label="The five cron time fields, minute through day of week, followed by the command" font-family="Verdana, Geneva, DejaVu Sans, sans-serif"><rect x="0" y="0" width="100%" height="100%" fill="#1c1a17"/><defs><marker id="a-ochre" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#d1972f"/></marker><marker id="a-verd" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#3f9c8b"/></marker><marker id="a-terra" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#c0603f"/></marker><marker id="a-sage" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8aa06a"/></marker><marker id="a-plum" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a6f9c"/></marker><marker id="a-peri" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7f8fc0"/></marker><marker id="a-parch" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e7ddcb"/></marker><marker id="a-faint" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a8f7d"/></marker><marker id="a-rule" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#4a453d"/></marker></defs><rect x="40" y="70" width="120" height="50" rx="8" fill="#262320" stroke="#d1972f" stroke-width="1.4"/><text x="100.0" y="92" text-anchor="middle" fill="#d1972f" font-size="20" font-weight="bold" font-family="Consolas, DejaVu Sans Mono, monospace">*</text><text x="100.0" y="138" text-anchor="middle" fill="#d1972f" font-size="10.5" font-weight="bold">minute</text><text x="100.0" y="154" text-anchor="middle" fill="#9a8f7d" font-size="9">0 to 59</text><rect x="170" y="70" width="120" height="50" rx="8" fill="#262320" stroke="#3f9c8b" stroke-width="1.4"/><text x="230.0" y="92" text-anchor="middle" fill="#3f9c8b" font-size="20" font-weight="bold" font-family="Consolas, DejaVu Sans Mono, monospace">*</text><text x="230.0" y="138" text-anchor="middle" fill="#3f9c8b" font-size="10.5" font-weight="bold">hour</text><text x="230.0" y="154" text-anchor="middle" fill="#9a8f7d" font-size="9">0 to 23</text><rect x="300" y="70" width="120" height="50" rx="8" fill="#262320" stroke="#9a6f9c" stroke-width="1.4"/><text x="360.0" y="92" text-anchor="middle" fill="#9a6f9c" font-size="20" font-weight="bold" font-family="Consolas, DejaVu Sans Mono, monospace">*</text><text x="360.0" y="138" text-anchor="middle" fill="#9a6f9c" font-size="10.5" font-weight="bold">day of month</text><text x="360.0" y="154" text-anchor="middle" fill="#9a8f7d" font-size="9">1 to 31</text><rect x="430" y="70" width="120" height="50" rx="8" fill="#262320" stroke="#7f8fc0" stroke-width="1.4"/><text x="490.0" y="92" text-anchor="middle" fill="#7f8fc0" font-size="20" font-weight="bold" font-family="Consolas, DejaVu Sans Mono, monospace">*</text><text x="490.0" y="138" text-anchor="middle" fill="#7f8fc0" font-size="10.5" font-weight="bold">month</text><text x="490.0" y="154" text-anchor="middle" fill="#9a8f7d" font-size="9">1 to 12</text><rect x="560" y="70" width="120" height="50" rx="8" fill="#262320" stroke="#8aa06a" stroke-width="1.4"/><text x="620.0" y="92" text-anchor="middle" fill="#8aa06a" font-size="20" font-weight="bold" font-family="Consolas, DejaVu Sans Mono, monospace">*</text><text x="620.0" y="138" text-anchor="middle" fill="#8aa06a" font-size="10.5" font-weight="bold">day of week</text><text x="620.0" y="154" text-anchor="middle" fill="#9a8f7d" font-size="9">0 to 6</text><rect x="690" y="70" width="90" height="50" rx="8" fill="#262320" stroke="#4a453d" stroke-width="1.4"/><text x="735" y="100" text-anchor="middle" fill="#9a8f7d" font-size="10">command</text><text x="360" y="34" text-anchor="middle" fill="#9a8f7d" font-size="11">five time fields, then the command to run</text><text x="360" y="190" text-anchor="middle" fill="#9a8f7d" font-size="10.5">a star means every value, so  30 2 * * *  runs at 02:30 every day</text></svg>