<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" role="img" aria-label="rsync transferring only the changed block between a source and a destination tree" font-family="Verdana, Geneva, DejaVu Sans, sans-serif"><rect x="0" y="0" width="100%" height="100%" fill="#1c1a17"/><defs><marker id="a-ochre" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#d1972f"/></marker><marker id="a-verd" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#3f9c8b"/></marker><marker id="a-terra" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#c0603f"/></marker><marker id="a-sage" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8aa06a"/></marker><marker id="a-plum" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a6f9c"/></marker><marker id="a-peri" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7f8fc0"/></marker><marker id="a-parch" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e7ddcb"/></marker><marker id="a-faint" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a8f7d"/></marker><marker id="a-rule" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#4a453d"/></marker></defs><rect x="60" y="90" width="200" height="120" rx="8" fill="#151310" stroke="#d1972f" stroke-width="1.4"/><text x="160" y="114" text-anchor="middle" fill="#d1972f" font-size="13" font-weight="bold">source</text><rect x="90" y="128" width="140" height="14" rx="8" fill="#262320" stroke="#8aa06a" stroke-width="1.4"/><rect x="90" y="146" width="140" height="14" rx="8" fill="#262320" stroke="#8aa06a" stroke-width="1.4"/><rect x="90" y="164" width="140" height="14" rx="8" fill="#262320" stroke="#c0603f" stroke-width="1.4"/><rect x="90" y="182" width="140" height="14" rx="8" fill="#262320" stroke="#8aa06a" stroke-width="1.4"/><rect x="460" y="90" width="200" height="120" rx="8" fill="#151310" stroke="#9a6f9c" stroke-width="1.4"/><text x="560" y="114" text-anchor="middle" fill="#9a6f9c" font-size="13" font-weight="bold">destination</text><rect x="490" y="128" width="140" height="14" rx="8" fill="#262320" stroke="#8aa06a" stroke-width="1.4"/><rect x="490" y="146" width="140" height="14" rx="8" fill="#262320" stroke="#8aa06a" stroke-width="1.4"/><rect x="490" y="164" width="140" height="14" rx="8" fill="#262320" stroke="#4a453d" stroke-width="1.4"/><rect x="490" y="182" width="140" height="14" rx="8" fill="#262320" stroke="#8aa06a" stroke-width="1.4"/><line x1="260" y1="164" x2="458" y2="164" stroke="#c0603f" stroke-width="2" fill="none" marker-end="url(#a-terra)"/><text x="360" y="156" text-anchor="middle" fill="#c0603f" font-size="10" font-weight="bold">only the changed block</text><text x="360" y="238" text-anchor="middle" fill="#9a8f7d" font-size="10.5">rsync compares the two sides and sends just the differences, which is why syncing a large tree is fast</text></svg>