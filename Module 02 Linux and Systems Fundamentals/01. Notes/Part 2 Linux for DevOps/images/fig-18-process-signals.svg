<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 234" role="img" aria-label="Signals SIGTERM, SIGKILL, SIGHUP, and SIGSTOP sent to a running process" font-family="Verdana, Geneva, DejaVu Sans, sans-serif"><rect x="0" y="0" width="100%" height="100%" fill="#1c1a17"/><defs><marker id="a-ochre" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#d1972f"/></marker><marker id="a-verd" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#3f9c8b"/></marker><marker id="a-terra" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#c0603f"/></marker><marker id="a-sage" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8aa06a"/></marker><marker id="a-plum" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a6f9c"/></marker><marker id="a-peri" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7f8fc0"/></marker><marker id="a-parch" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e7ddcb"/></marker><marker id="a-faint" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a8f7d"/></marker><marker id="a-rule" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#4a453d"/></marker></defs><rect x="290" y="110" width="160" height="70" rx="8" fill="#151310" stroke="#d1972f" stroke-width="1.4"/><text x="370" y="140" text-anchor="middle" fill="#d1972f" font-size="13" font-weight="bold">a process</text><text x="370" y="162" text-anchor="middle" fill="#9a8f7d" font-size="9.5" font-family="Consolas, DejaVu Sans Mono, monospace">pid 4821</text><rect x="40" y="60" width="180" height="44" rx="8" fill="#262320" stroke="#3f9c8b" stroke-width="1.4"/><text x="130" y="80" text-anchor="middle" fill="#3f9c8b" font-size="11" font-weight="bold" font-family="Consolas, DejaVu Sans Mono, monospace">SIGTERM  15</text><text x="130" y="97" text-anchor="middle" fill="#9a8f7d" font-size="8.5">ask it to stop cleanly</text><line x1="220" y1="82" x2="288" y2="140" stroke="#3f9c8b" stroke-width="1.6" fill="none" marker-end="url(#a-verd)"/><rect x="40" y="150" width="180" height="44" rx="8" fill="#262320" stroke="#c0603f" stroke-width="1.4"/><text x="130" y="170" text-anchor="middle" fill="#c0603f" font-size="11" font-weight="bold" font-family="Consolas, DejaVu Sans Mono, monospace">SIGKILL  9</text><text x="130" y="187" text-anchor="middle" fill="#9a8f7d" font-size="8.5">force stop, no cleanup</text><line x1="220" y1="172" x2="288" y2="140" stroke="#c0603f" stroke-width="1.6" fill="none" marker-end="url(#a-terra)"/><rect x="470" y="60" width="180" height="44" rx="8" fill="#262320" stroke="#9a6f9c" stroke-width="1.4"/><text x="560" y="80" text-anchor="middle" fill="#9a6f9c" font-size="11" font-weight="bold" font-family="Consolas, DejaVu Sans Mono, monospace">SIGHUP  1</text><text x="560" y="97" text-anchor="middle" fill="#9a8f7d" font-size="8.5">reload configuration</text><line x1="470" y1="82" x2="452" y2="140" stroke="#9a6f9c" stroke-width="1.6" fill="none" marker-end="url(#a-plum)"/><rect x="470" y="150" width="180" height="44" rx="8" fill="#262320" stroke="#7f8fc0" stroke-width="1.4"/><text x="560" y="170" text-anchor="middle" fill="#7f8fc0" font-size="11" font-weight="bold" font-family="Consolas, DejaVu Sans Mono, monospace">SIGSTOP / CONT</text><text x="560" y="187" text-anchor="middle" fill="#9a8f7d" font-size="8.5">pause and resume</text><line x1="470" y1="172" x2="452" y2="140" stroke="#7f8fc0" stroke-width="1.6" fill="none" marker-end="url(#a-peri)"/><text x="360" y="214" text-anchor="middle" fill="#9a8f7d" font-size="10.5">kill sends SIGTERM and lets the process shut down; kill -9 sends SIGKILL and the kernel just stops it</text></svg>