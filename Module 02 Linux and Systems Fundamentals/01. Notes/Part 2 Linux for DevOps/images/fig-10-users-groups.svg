<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 252" role="img" aria-label="A user belonging to a primary group and supplementary groups, with the passwd, group, and shadow files" font-family="Verdana, Geneva, DejaVu Sans, sans-serif"><rect x="0" y="0" width="100%" height="100%" fill="#1c1a17"/><defs><marker id="a-ochre" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#d1972f"/></marker><marker id="a-verd" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#3f9c8b"/></marker><marker id="a-terra" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#c0603f"/></marker><marker id="a-sage" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8aa06a"/></marker><marker id="a-plum" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a6f9c"/></marker><marker id="a-peri" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7f8fc0"/></marker><marker id="a-parch" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e7ddcb"/></marker><marker id="a-faint" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a8f7d"/></marker><marker id="a-rule" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#4a453d"/></marker></defs><rect x="60" y="100" width="140" height="60" rx="8" fill="#262320" stroke="#d1972f" stroke-width="1.4"/><text x="130" y="126" text-anchor="middle" fill="#e7ddcb" font-size="13" font-weight="bold">user: dev</text><text x="130" y="146" text-anchor="middle" fill="#9a8f7d" font-size="9.5" font-family="Consolas, DejaVu Sans Mono, monospace">uid 1000</text><rect x="320" y="50" width="150" height="44" rx="8" fill="#262320" stroke="#3f9c8b" stroke-width="1.4"/><text x="395" y="77" text-anchor="middle" fill="#e7ddcb" font-size="11" font-weight="bold">primary group</text><rect x="320" y="120" width="220" height="40" rx="8" fill="#262320" stroke="#9a6f9c" stroke-width="1.4"/><text x="430" y="144" text-anchor="middle" fill="#e7ddcb" font-size="10.5">wheel  sudo access</text><line x1="200" y1="130" x2="318" y2="140" stroke="#9a6f9c" stroke-width="1.6" fill="none" stroke-dasharray="3 3" marker-end="url(#a-plum)"/><rect x="320" y="180" width="220" height="40" rx="8" fill="#262320" stroke="#7f8fc0" stroke-width="1.4"/><text x="430" y="204" text-anchor="middle" fill="#e7ddcb" font-size="10.5">docker  run containers</text><line x1="200" y1="130" x2="318" y2="200" stroke="#7f8fc0" stroke-width="1.6" fill="none" stroke-dasharray="3 3" marker-end="url(#a-peri)"/><line x1="200" y1="120" x2="318" y2="72" stroke="#3f9c8b" stroke-width="1.6" fill="none" marker-end="url(#a-verd)"/><text x="590" y="50" text-anchor="start" fill="#9a8f7d" font-size="9.5" font-family="Consolas, DejaVu Sans Mono, monospace">/etc/passwd  identity</text><text x="590" y="78" text-anchor="start" fill="#9a8f7d" font-size="9.5" font-family="Consolas, DejaVu Sans Mono, monospace">/etc/group  memberships</text><text x="590" y="106" text-anchor="start" fill="#9a8f7d" font-size="9.5" font-family="Consolas, DejaVu Sans Mono, monospace">/etc/shadow  password hashes</text><text x="360" y="232" text-anchor="middle" fill="#9a8f7d" font-size="10.5">one primary group plus any number of supplementary groups grant what a user may do</text></svg>