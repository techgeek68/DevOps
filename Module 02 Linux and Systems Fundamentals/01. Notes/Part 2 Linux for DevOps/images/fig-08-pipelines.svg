<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 210" role="img" aria-label="A shell pipeline passing output from cat to grep to sort to uniq" font-family="Verdana, Geneva, DejaVu Sans, sans-serif"><rect x="0" y="0" width="100%" height="100%" fill="#1c1a17"/><defs><marker id="a-ochre" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#d1972f"/></marker><marker id="a-verd" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#3f9c8b"/></marker><marker id="a-terra" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#c0603f"/></marker><marker id="a-sage" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8aa06a"/></marker><marker id="a-plum" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a6f9c"/></marker><marker id="a-peri" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7f8fc0"/></marker><marker id="a-parch" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e7ddcb"/></marker><marker id="a-faint" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a8f7d"/></marker><marker id="a-rule" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#4a453d"/></marker></defs><rect x="30" y="100" width="150" height="50" rx="8" fill="#262320" stroke="#d1972f" stroke-width="1.4"/><text x="105.0" y="130" text-anchor="middle" fill="#e7ddcb" font-size="11" font-weight="bold" font-family="Consolas, DejaVu Sans Mono, monospace">cat access.log</text><line x1="180" y1="125" x2="206" y2="125" stroke="#d1972f" stroke-width="1.6" fill="none" marker-end="url(#a-ochre)"/><text x="193.0" y="116" text-anchor="middle" fill="#d1972f" font-size="13" font-weight="bold">|</text><rect x="206" y="100" width="150" height="50" rx="8" fill="#262320" stroke="#3f9c8b" stroke-width="1.4"/><text x="281.0" y="130" text-anchor="middle" fill="#e7ddcb" font-size="11" font-weight="bold" font-family="Consolas, DejaVu Sans Mono, monospace">grep 500</text><line x1="356" y1="125" x2="382" y2="125" stroke="#d1972f" stroke-width="1.6" fill="none" marker-end="url(#a-ochre)"/><text x="369.0" y="116" text-anchor="middle" fill="#d1972f" font-size="13" font-weight="bold">|</text><rect x="382" y="100" width="150" height="50" rx="8" fill="#262320" stroke="#9a6f9c" stroke-width="1.4"/><text x="457.0" y="130" text-anchor="middle" fill="#e7ddcb" font-size="11" font-weight="bold" font-family="Consolas, DejaVu Sans Mono, monospace">sort</text><line x1="532" y1="125" x2="558" y2="125" stroke="#d1972f" stroke-width="1.6" fill="none" marker-end="url(#a-ochre)"/><text x="545.0" y="116" text-anchor="middle" fill="#d1972f" font-size="13" font-weight="bold">|</text><rect x="558" y="100" width="150" height="50" rx="8" fill="#262320" stroke="#7f8fc0" stroke-width="1.4"/><text x="633.0" y="130" text-anchor="middle" fill="#e7ddcb" font-size="11" font-weight="bold" font-family="Consolas, DejaVu Sans Mono, monospace">uniq -c</text><text x="360" y="60" text-anchor="middle" fill="#9a8f7d" font-size="11">the stdout of each stage becomes the stdin of the next</text><text x="360" y="182" text-anchor="middle" fill="#9a8f7d" font-size="10.5">small tools chained together do what no single command could</text></svg>