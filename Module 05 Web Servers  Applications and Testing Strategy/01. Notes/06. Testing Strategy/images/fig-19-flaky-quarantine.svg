<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 256" role="img" aria-label="A blocking test suite with the flaky test moved into a separate non blocking lane" font-family="Verdana, Geneva, DejaVu Sans, sans-serif"><rect x="0" y="0" width="100%" height="100%" fill="#1c1a17"/><defs><marker id="a-ochre" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#d1972f"/></marker><marker id="a-verd" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#3f9c8b"/></marker><marker id="a-terra" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#c0603f"/></marker><marker id="a-sage" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8aa06a"/></marker><marker id="a-plum" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a6f9c"/></marker><marker id="a-peri" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7f8fc0"/></marker><marker id="a-parch" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e7ddcb"/></marker><marker id="a-faint" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a8f7d"/></marker><marker id="a-rule" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#4a453d"/></marker></defs><rect x="40" y="60" width="300" height="180" rx="12" fill="#151310" stroke="#8aa06a" stroke-width="1.4"/><text x="190" y="86" text-anchor="middle" fill="#8aa06a" font-size="12.5" font-weight="bold">blocking suite · the gate</text><rect x="70" y="104" width="240" height="26" rx="8" fill="#262320" stroke="#8aa06a" stroke-width="1.4"/><text x="190" y="122" text-anchor="middle" fill="#e7ddcb" font-size="10.5">stable test</text><rect x="70" y="138" width="240" height="26" rx="8" fill="#262320" stroke="#8aa06a" stroke-width="1.4"/><text x="190" y="156" text-anchor="middle" fill="#e7ddcb" font-size="10.5">stable test</text><rect x="70" y="172" width="240" height="26" rx="8" fill="#262320" stroke="#8aa06a" stroke-width="1.4"/><text x="190" y="190" text-anchor="middle" fill="#e7ddcb" font-size="10.5">stable test</text><text x="190" y="224" text-anchor="middle" fill="#9a8f7d" font-size="9.5">quarantined tests excluded, so green means green</text><rect x="380" y="60" width="300" height="180" rx="12" fill="#151310" stroke="#c0603f" stroke-width="1.4"/><text x="530" y="86" text-anchor="middle" fill="#c0603f" font-size="12.5" font-weight="bold">non blocking lane</text><rect x="410" y="110" width="240" height="60" rx="8" fill="#262320" stroke="#c0603f" stroke-width="1.4"/><text x="530" y="136" text-anchor="middle" fill="#e7ddcb" font-size="11" font-weight="bold">flaky test</text><text x="530" y="156" text-anchor="middle" fill="#9a8f7d" font-size="9.5">still runs, still reported</text><text x="530" y="200" text-anchor="middle" fill="#9a8f7d" font-size="9.5">its signal is kept without blocking the merge</text><text x="530" y="220" text-anchor="middle" fill="#9a8f7d" font-size="9.5">someone owns fixing it</text></svg>