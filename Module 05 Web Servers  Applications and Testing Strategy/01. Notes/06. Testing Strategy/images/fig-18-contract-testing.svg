<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 244" role="img" aria-label="A consumer and a provider both testing against one shared contract" font-family="Verdana, Geneva, DejaVu Sans, sans-serif"><rect x="0" y="0" width="100%" height="100%" fill="#1c1a17"/><defs><marker id="a-ochre" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#d1972f"/></marker><marker id="a-verd" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#3f9c8b"/></marker><marker id="a-terra" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#c0603f"/></marker><marker id="a-sage" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8aa06a"/></marker><marker id="a-plum" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a6f9c"/></marker><marker id="a-peri" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7f8fc0"/></marker><marker id="a-parch" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e7ddcb"/></marker><marker id="a-faint" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a8f7d"/></marker><marker id="a-rule" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#4a453d"/></marker></defs><rect x="40" y="110" width="180" height="70" rx="8" fill="#262320" stroke="#d1972f" stroke-width="1.4"/><text x="130" y="138" text-anchor="middle" fill="#d1972f" font-size="13" font-weight="bold">consumer</text><text x="130" y="160" text-anchor="middle" fill="#9a8f7d" font-size="9.5">expects a shape</text><rect x="300" y="100" width="140" height="90" rx="10" fill="#151310" stroke="#3f9c8b" stroke-width="1.4"/><text x="370" y="128" text-anchor="middle" fill="#3f9c8b" font-size="13" font-weight="bold">contract</text><text x="370" y="150" text-anchor="middle" fill="#e7ddcb" font-size="10">the agreed</text><text x="370" y="166" text-anchor="middle" fill="#e7ddcb" font-size="10">request and reply</text><rect x="520" y="110" width="180" height="70" rx="8" fill="#262320" stroke="#9a6f9c" stroke-width="1.4"/><text x="610" y="138" text-anchor="middle" fill="#9a6f9c" font-size="13" font-weight="bold">provider</text><text x="610" y="160" text-anchor="middle" fill="#9a8f7d" font-size="9.5">promises the shape</text><line x1="220" y1="145" x2="298" y2="145" stroke="#d1972f" stroke-width="1.6" fill="none" marker-end="url(#a-ochre)"/><line x1="520" y1="145" x2="442" y2="145" stroke="#9a6f9c" stroke-width="1.6" fill="none" marker-end="url(#a-plum)"/><text x="360" y="222" text-anchor="middle" fill="#9a8f7d" font-size="10.5">both sides test against the same contract, so they can deploy independently without breaking each other</text></svg>