<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 280" role="img" aria-label="The test pyramid with a wide unit base, an integration middle, and a narrow end to end top" font-family="Verdana, Geneva, DejaVu Sans, sans-serif"><rect x="0" y="0" width="100%" height="100%" fill="#1c1a17"/><defs><marker id="a-ochre" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#d1972f"/></marker><marker id="a-verd" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#3f9c8b"/></marker><marker id="a-terra" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#c0603f"/></marker><marker id="a-sage" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8aa06a"/></marker><marker id="a-plum" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a6f9c"/></marker><marker id="a-peri" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7f8fc0"/></marker><marker id="a-parch" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e7ddcb"/></marker><marker id="a-faint" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a8f7d"/></marker><marker id="a-rule" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#4a453d"/></marker></defs><polygon points="300,40 230,110 370,110" fill="#151310" stroke="#9a6f9c" stroke-width="1.4"/><text x="300" y="92" text-anchor="middle" fill="#9a6f9c" font-size="11" font-weight="bold">end to end</text><polygon points="230,112 370,112 435,190 165,190" fill="#151310" stroke="#3f9c8b" stroke-width="1.4"/><text x="300" y="160" text-anchor="middle" fill="#3f9c8b" font-size="12" font-weight="bold">integration</text><polygon points="163,192 437,192 500,250 100,250" fill="#151310" stroke="#d1972f" stroke-width="1.4"/><text x="300" y="235" text-anchor="middle" fill="#d1972f" font-size="14" font-weight="bold">unit</text><text x="530" y="240" text-anchor="start" fill="#d1972f" font-size="10">many, fast, cheap</text><text x="450" y="80" text-anchor="start" fill="#9a6f9c" font-size="10">few, slow, costly</text><line x1="520" y1="250" x2="450" y2="70" stroke="#9a8f7d" stroke-width="1" fill="none" stroke-dasharray="2 3"/></svg>