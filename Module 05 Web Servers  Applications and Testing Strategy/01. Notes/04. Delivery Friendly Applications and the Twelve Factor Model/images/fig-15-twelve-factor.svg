<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 296" role="img" aria-label="The twelve factor rules split into enduring factors and dated or debated ones" font-family="Verdana, Geneva, DejaVu Sans, sans-serif"><rect x="0" y="0" width="100%" height="100%" fill="#1c1a17"/><defs><marker id="a-ochre" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#d1972f"/></marker><marker id="a-verd" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#3f9c8b"/></marker><marker id="a-terra" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#c0603f"/></marker><marker id="a-sage" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8aa06a"/></marker><marker id="a-plum" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a6f9c"/></marker><marker id="a-peri" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7f8fc0"/></marker><marker id="a-parch" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e7ddcb"/></marker><marker id="a-faint" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a8f7d"/></marker><marker id="a-rule" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#4a453d"/></marker></defs><rect x="30" y="50" width="320" height="230" rx="12" fill="#151310" stroke="#8aa06a" stroke-width="1.4"/><text x="190" y="76" text-anchor="middle" fill="#8aa06a" font-size="14" font-weight="bold">enduring</text><text x="50" y="104" text-anchor="start" fill="#e7ddcb" font-size="11">III  config in the environment</text><text x="50" y="130" text-anchor="start" fill="#e7ddcb" font-size="11">VI  processes are stateless</text><text x="50" y="156" text-anchor="start" fill="#e7ddcb" font-size="11">IV  backing services attached</text><text x="50" y="182" text-anchor="start" fill="#e7ddcb" font-size="11">V  separate build, release, run</text><text x="50" y="208" text-anchor="start" fill="#e7ddcb" font-size="11">XI  logs as event streams</text><text x="50" y="234" text-anchor="start" fill="#e7ddcb" font-size="11">X  dev and prod parity</text><rect x="380" y="50" width="320" height="230" rx="12" fill="#151310" stroke="#c0603f" stroke-width="1.4"/><text x="540" y="76" text-anchor="middle" fill="#c0603f" font-size="14" font-weight="bold">dated or debated</text><text x="400" y="108" text-anchor="start" fill="#e7ddcb" font-size="11">one codebase maps to one app</text><text x="400" y="138" text-anchor="start" fill="#e7ddcb" font-size="11">XII  admin tasks as one off runs</text><text x="400" y="168" text-anchor="start" fill="#e7ddcb" font-size="11">VII  the app binds a port itself</text><text x="400" y="198" text-anchor="start" fill="#e7ddcb" font-size="11">VIII  scale only by adding processes</text><text x="540" y="262" text-anchor="middle" fill="#9a8f7d" font-size="9.5">the goals still hold, the 2011 mechanisms show their age</text></svg>