<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 234" role="img" aria-label="An httpd request passing SELinux file context, boolean, and port label checks or hitting an AVC denial" font-family="Verdana, Geneva, DejaVu Sans, sans-serif"><rect x="0" y="0" width="100%" height="100%" fill="#1c1a17"/><defs><marker id="a-ochre" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#d1972f"/></marker><marker id="a-verd" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#3f9c8b"/></marker><marker id="a-terra" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#c0603f"/></marker><marker id="a-sage" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8aa06a"/></marker><marker id="a-plum" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a6f9c"/></marker><marker id="a-peri" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7f8fc0"/></marker><marker id="a-parch" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e7ddcb"/></marker><marker id="a-faint" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a8f7d"/></marker><marker id="a-rule" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#4a453d"/></marker></defs><rect x="30" y="110" width="120" height="60" rx="8" fill="#262320" stroke="#d1972f" stroke-width="1.4"/><text x="90" y="144" text-anchor="middle" fill="#e7ddcb" font-size="12" font-weight="bold">httpd</text><rect x="160" y="100" width="140" height="80" rx="8" fill="#151310" stroke="#3f9c8b" stroke-width="1.4"/><text x="230" y="124" text-anchor="middle" fill="#3f9c8b" font-size="11" font-weight="bold">file context</text><text x="230" y="146" text-anchor="middle" fill="#9a8f7d" font-size="8.5" font-family="Consolas, DejaVu Sans Mono, monospace">httpd_sys_content_t</text><text x="230" y="166" text-anchor="middle" fill="#e7ddcb" font-size="9">must match</text><rect x="330" y="100" width="140" height="80" rx="8" fill="#151310" stroke="#9a6f9c" stroke-width="1.4"/><text x="400" y="124" text-anchor="middle" fill="#9a6f9c" font-size="11" font-weight="bold">boolean</text><text x="400" y="146" text-anchor="middle" fill="#9a8f7d" font-size="8.5" font-family="Consolas, DejaVu Sans Mono, monospace">httpd_can_network_connect</text><text x="400" y="166" text-anchor="middle" fill="#e7ddcb" font-size="9">must match</text><rect x="500" y="100" width="140" height="80" rx="8" fill="#151310" stroke="#7f8fc0" stroke-width="1.4"/><text x="570" y="124" text-anchor="middle" fill="#7f8fc0" font-size="11" font-weight="bold">port label</text><text x="570" y="146" text-anchor="middle" fill="#9a8f7d" font-size="8.5" font-family="Consolas, DejaVu Sans Mono, monospace">http_port_t</text><text x="570" y="166" text-anchor="middle" fill="#e7ddcb" font-size="9">must match</text><line x1="150" y1="140" x2="158" y2="140" stroke="#d1972f" stroke-width="1.6" fill="none" marker-end="url(#a-ochre)"/><line x1="300" y1="140" x2="330" y2="140" stroke="#3f9c8b" stroke-width="1.6" fill="none" marker-end="url(#a-verd)"/><line x1="470" y1="140" x2="500" y2="140" stroke="#3f9c8b" stroke-width="1.6" fill="none" marker-end="url(#a-verd)"/><rect x="640" y="110" width="60" height="60" rx="8" fill="#151310" stroke="#c0603f" stroke-width="1.4"/><text x="670" y="138" text-anchor="middle" fill="#c0603f" font-size="11" font-weight="bold">AVC</text><text x="670" y="156" text-anchor="middle" fill="#9a8f7d" font-size="9">denial</text><line x1="640" y1="140" x2="638" y2="140" stroke="#8aa06a" stroke-width="1.6" fill="none" marker-end="url(#a-sage)"/><text x="360" y="214" text-anchor="middle" fill="#9a8f7d" font-size="10.5">if any label or boolean is wrong the request is denied, and the reason is in the audit log</text></svg>