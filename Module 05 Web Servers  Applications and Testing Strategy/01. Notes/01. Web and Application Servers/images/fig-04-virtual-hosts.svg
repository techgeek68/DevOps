<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 306" role="img" aria-label="One IP and port serving three virtual hosts routed by server name to different document roots" font-family="Verdana, Geneva, DejaVu Sans, sans-serif"><rect x="0" y="0" width="100%" height="100%" fill="#1c1a17"/><defs><marker id="a-ochre" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#d1972f"/></marker><marker id="a-verd" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#3f9c8b"/></marker><marker id="a-terra" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#c0603f"/></marker><marker id="a-sage" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8aa06a"/></marker><marker id="a-plum" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a6f9c"/></marker><marker id="a-peri" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7f8fc0"/></marker><marker id="a-parch" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e7ddcb"/></marker><marker id="a-faint" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a8f7d"/></marker><marker id="a-rule" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#4a453d"/></marker></defs><rect x="40" y="110" width="170" height="60" rx="8" fill="#151310" stroke="#d1972f" stroke-width="1.4"/><text x="125" y="136" text-anchor="middle" fill="#d1972f" font-size="13" font-weight="bold">one IP : 443</text><text x="125" y="156" text-anchor="middle" fill="#9a8f7d" font-size="9.5">one server</text><rect x="430" y="50" width="240" height="54" rx="8" fill="#262320" stroke="#3f9c8b" stroke-width="1.4"/><text x="550" y="72" text-anchor="middle" fill="#3f9c8b" font-size="12" font-weight="bold" font-family="Consolas, DejaVu Sans Mono, monospace">shop.example</text><text x="550" y="90" text-anchor="middle" fill="#9a8f7d" font-size="10" font-family="Consolas, DejaVu Sans Mono, monospace">/srv/shop</text><line x1="210" y1="140" x2="428" y2="77" stroke="#3f9c8b" stroke-width="1.6" fill="none" marker-end="url(#a-verd)"/><rect x="430" y="130" width="240" height="54" rx="8" fill="#262320" stroke="#9a6f9c" stroke-width="1.4"/><text x="550" y="152" text-anchor="middle" fill="#9a6f9c" font-size="12" font-weight="bold" font-family="Consolas, DejaVu Sans Mono, monospace">blog.example</text><text x="550" y="170" text-anchor="middle" fill="#9a8f7d" font-size="10" font-family="Consolas, DejaVu Sans Mono, monospace">/srv/blog</text><line x1="210" y1="140" x2="428" y2="157" stroke="#9a6f9c" stroke-width="1.6" fill="none" marker-end="url(#a-plum)"/><rect x="430" y="210" width="240" height="54" rx="8" fill="#262320" stroke="#7f8fc0" stroke-width="1.4"/><text x="550" y="232" text-anchor="middle" fill="#7f8fc0" font-size="12" font-weight="bold" font-family="Consolas, DejaVu Sans Mono, monospace">api.example</text><text x="550" y="250" text-anchor="middle" fill="#9a8f7d" font-size="10" font-family="Consolas, DejaVu Sans Mono, monospace">/srv/api</text><line x1="210" y1="140" x2="428" y2="237" stroke="#7f8fc0" stroke-width="1.6" fill="none" marker-end="url(#a-peri)"/><text x="320" y="100" text-anchor="middle" fill="#9a8f7d" font-size="9.5" font-family="Consolas, DejaVu Sans Mono, monospace">server_name</text><text x="360" y="290" text-anchor="middle" fill="#9a8f7d" font-size="10.5">the Host header picks which site answers, all on the same address</text></svg>