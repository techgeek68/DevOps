<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 210" role="img" aria-label="A request passing from client to Nginx at the edge, to the application server, to the database" font-family="Verdana, Geneva, DejaVu Sans, sans-serif"><rect x="0" y="0" width="100%" height="100%" fill="#1c1a17"/><defs><marker id="a-ochre" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#d1972f"/></marker><marker id="a-verd" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#3f9c8b"/></marker><marker id="a-terra" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#c0603f"/></marker><marker id="a-sage" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8aa06a"/></marker><marker id="a-plum" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a6f9c"/></marker><marker id="a-peri" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7f8fc0"/></marker><marker id="a-parch" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e7ddcb"/></marker><marker id="a-faint" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a8f7d"/></marker><marker id="a-rule" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#4a453d"/></marker></defs><rect x="30" y="90" width="150" height="70" rx="8" fill="#262320" stroke="#4a453d" stroke-width="1.4"/><text x="105.0" y="122" text-anchor="middle" fill="#9a8f7d" font-size="13" font-weight="bold">Client</text><text x="105.0" y="142" text-anchor="middle" fill="#9a8f7d" font-size="9.5">browser</text><line x1="180" y1="125.0" x2="210" y2="125.0" stroke="#d1972f" stroke-width="1.6" fill="none" marker-end="url(#a-ochre)"/><rect x="210" y="90" width="150" height="70" rx="8" fill="#262320" stroke="#d1972f" stroke-width="1.4"/><text x="285.0" y="122" text-anchor="middle" fill="#d1972f" font-size="13" font-weight="bold">Nginx</text><text x="285.0" y="142" text-anchor="middle" fill="#9a8f7d" font-size="9.5">edge: TLS, static, proxy</text><line x1="360" y1="125.0" x2="390" y2="125.0" stroke="#d1972f" stroke-width="1.6" fill="none" marker-end="url(#a-ochre)"/><rect x="390" y="90" width="150" height="70" rx="8" fill="#262320" stroke="#3f9c8b" stroke-width="1.4"/><text x="465.0" y="122" text-anchor="middle" fill="#3f9c8b" font-size="13" font-weight="bold">App server</text><text x="465.0" y="142" text-anchor="middle" fill="#9a8f7d" font-size="9.5">business logic</text><line x1="540" y1="125.0" x2="570" y2="125.0" stroke="#d1972f" stroke-width="1.6" fill="none" marker-end="url(#a-ochre)"/><rect x="570" y="90" width="150" height="70" rx="8" fill="#262320" stroke="#9a6f9c" stroke-width="1.4"/><text x="645.0" y="122" text-anchor="middle" fill="#9a6f9c" font-size="13" font-weight="bold">Database</text><text x="645.0" y="142" text-anchor="middle" fill="#9a8f7d" font-size="9.5">state</text><text x="375.0" y="117.0" text-anchor="middle" fill="#d1972f" font-size="8.5" font-family="Consolas, DejaVu Sans Mono, monospace">proxy_pass</text><text x="285.0" y="74" text-anchor="middle" fill="#9a8f7d" font-size="10">edge, closest to the client</text><text x="505.0" y="74" text-anchor="middle" fill="#9a8f7d" font-size="10">behind, closest to the data</text><text x="370" y="194" text-anchor="middle" fill="#9a8f7d" font-size="10.5">splitting these roles lets you scale, terminate TLS in one place, and fail independently</text></svg>