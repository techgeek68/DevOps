<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" role="img" aria-label="A comparison of Nginx, Apache, and Tomcat by their primary role" font-family="Verdana, Geneva, DejaVu Sans, sans-serif"><rect x="0" y="0" width="100%" height="100%" fill="#1c1a17"/><defs><marker id="a-ochre" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#d1972f"/></marker><marker id="a-verd" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#3f9c8b"/></marker><marker id="a-terra" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#c0603f"/></marker><marker id="a-sage" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8aa06a"/></marker><marker id="a-plum" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a6f9c"/></marker><marker id="a-peri" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7f8fc0"/></marker><marker id="a-parch" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e7ddcb"/></marker><marker id="a-faint" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a8f7d"/></marker><marker id="a-rule" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#4a453d"/></marker></defs><rect x="30" y="50" width="215" height="150" rx="10" fill="#151310" stroke="#d1972f" stroke-width="1.4"/><text x="137.5" y="80" text-anchor="middle" fill="#d1972f" font-size="15" font-weight="bold">Nginx</text><text x="137.5" y="106" text-anchor="middle" fill="#e7ddcb" font-size="11">event driven edge</text><text x="137.5" y="150" text-anchor="middle" fill="#9a8f7d" font-size="10">reverse proxy, TLS, static, load balancing</text><rect x="258" y="50" width="215" height="150" rx="10" fill="#151310" stroke="#3f9c8b" stroke-width="1.4"/><text x="365.5" y="80" text-anchor="middle" fill="#3f9c8b" font-size="15" font-weight="bold">Apache</text><text x="365.5" y="106" text-anchor="middle" fill="#e7ddcb" font-size="11">flexible modules</text><text x="365.5" y="150" text-anchor="middle" fill="#9a8f7d" font-size="10">per directory rules, mod_wsgi, mod_php</text><rect x="486" y="50" width="215" height="150" rx="10" fill="#151310" stroke="#9a6f9c" stroke-width="1.4"/><text x="593.5" y="80" text-anchor="middle" fill="#9a6f9c" font-size="15" font-weight="bold">Tomcat</text><text x="593.5" y="106" text-anchor="middle" fill="#e7ddcb" font-size="11">Java servlet container</text><text x="593.5" y="150" text-anchor="middle" fill="#9a8f7d" font-size="10">runs the application code itself</text><text x="360" y="30" text-anchor="middle" fill="#9a8f7d" font-size="11">pick by the job, and it is normal to run more than one together</text></svg>