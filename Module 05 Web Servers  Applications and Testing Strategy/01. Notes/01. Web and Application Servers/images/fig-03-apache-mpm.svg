text x="80" y="137" text-anchor="middle" fill="#e7ddcb" font-size="8.5">proc</text><rect x="110" y="120" width="40" height="26" rx="8" fill="#262320" stroke="#c0603f" stroke-width="1.4"/><text x="130" y="137" text-anchor="middle" fill="#e7ddcb" font-size="8.5">proc</text><rect x="160" y="120" width="40" height="26" rx="8" fill="#262320" stroke="#c0603f" stroke-width="1.4"/><text x="180" y="137" text-anchor="middle" fill="#e7ddcb" font-size="8.5">proc</text><text x="137.5" y="190" text-anchor="middle" fill="#9a8f7d" font-size="9.5">heavy, fully isolated</text><rect x="258" y="50" width="215" height="150" rx="10" fill="#151310" stroke="#3f9c8b" stroke-width="1.4"/><text x="365.5" y="78" text-anchor="middle" fill="#3f9c8b" font-size="13" font-weight="bold">worker</text><text x="365.5" y="102" text-anchor="middle" fill="#e7ddcb" font-size="10.5">threads inside processes</text><rect x="298" y="120" width="135" height="30" rx="8" fill="#262320" stroke="#3f9c8b" stroke-width="1.4"/><line x1="313" y1="120" x2="313" y2="150" stroke="#3f9c8b" stroke-width="1.4" fill="none"/><line x1="343" y1="120" x2="343" y2="150" stroke="#3f9c8b" stroke-width="1.4" fill="none"/><line x1="373" y1="120" x2="373" y2="150" stroke="#3f9c8b" stroke-width="1.4" fill="none"/><line x1="403" y1="120" x2="403" y2="150" stroke="#3f9c8b" stroke-width="1.4" fill="none"/><text x="365.5" y="168" text-anchor="middle" fill="#9a8f7d" font-size="8.5">threads</text><text x="365.5" y="190" text-anchor="middle" fill="#9a8f7d" font-size="9.5">lighter, shared memory</text><rect x="486" y="50" width="215" height="150" rx="10" fill="#151310" stroke="#d1972f" stroke-width="1.4"/><text x="593.5" y="78" text-anchor="middle" fill="#d1972f" font-size="13" font-weight="bold">event</text><text x="593.5" y="102" text-anchor="middle" fill="#e7ddcb" font-size="10.5">threads plus an event poll</text><rect x="526" y="120" width="135" height="30" rx="8" fill="#262320" stroke="#d1972f" stroke-width="1.4"/><text x="593.5" y="138" text-anchor="middle" fill="#e7ddcb" font-size="8.5">1 thread, N idle conns</text><text x="593.5" y="190" text-anchor="middle" fill="#9a8f7d" font-size="9.5">keeps idle keepalive cheap</text></svg>