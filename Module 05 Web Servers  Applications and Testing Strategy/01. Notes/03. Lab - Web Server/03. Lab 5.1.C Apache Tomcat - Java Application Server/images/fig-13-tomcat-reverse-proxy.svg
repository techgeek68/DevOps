<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 226" role="img" aria-label="Nginx terminating TLS and reverse proxying to a Tomcat backend with no public port" font-family="Verdana, Geneva, DejaVu Sans, sans-serif"><rect x="0" y="0" width="100%" height="100%" fill="#1c1a17"/><defs><marker id="a-ochre" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#d1972f"/></marker><marker id="a-verd" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#3f9c8b"/></marker><marker id="a-terra" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#c0603f"/></marker><marker id="a-sage" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8aa06a"/></marker><marker id="a-plum" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a6f9c"/></marker><marker id="a-peri" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7f8fc0"/></marker><marker id="a-parch" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e7ddcb"/></marker><marker id="a-faint" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a8f7d"/></marker><marker id="a-rule" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#4a453d"/></marker></defs><rect x="30" y="100" width="120" height="60" rx="8" fill="#262320" stroke="#4a453d" stroke-width="1.4"/><text x="90" y="134" text-anchor="middle" fill="#9a8f7d" font-size="12" font-weight="bold">client</text><rect x="250" y="80" width="180" height="100" rx="8" fill="#151310" stroke="#d1972f" stroke-width="1.4"/><text x="340" y="106" text-anchor="middle" fill="#d1972f" font-size="13" font-weight="bold">Nginx</text><text x="340" y="130" text-anchor="middle" fill="#e7ddcb" font-size="10" font-family="Consolas, DejaVu Sans Mono, monospace">:443 TLS</text><text x="340" y="148" text-anchor="middle" fill="#9a8f7d" font-size="9.5">one public surface</text><text x="340" y="166" text-anchor="middle" fill="#9a8f7d" font-size="9">static + headers</text><rect x="540" y="90" width="160" height="70" rx="8" fill="#262320" stroke="#9a6f9c" stroke-width="1.4"/><text x="620" y="118" text-anchor="middle" fill="#e7ddcb" font-size="13" font-weight="bold">Tomcat</text><text x="620" y="140" text-anchor="middle" fill="#9a8f7d" font-size="9.5" font-family="Consolas, DejaVu Sans Mono, monospace">:8080, no public IP</text><line x1="150" y1="130" x2="248" y2="130" stroke="#d1972f" stroke-width="1.6" fill="none" marker-end="url(#a-ochre)"/><line x1="430" y1="125" x2="538" y2="125" stroke="#9a6f9c" stroke-width="1.6" fill="none" marker-end="url(#a-plum)"/><text x="485" y="116" text-anchor="middle" fill="#9a6f9c" font-size="8.5" font-family="Consolas, DejaVu Sans Mono, monospace">proxy_pass</text><text x="360" y="206" text-anchor="middle" fill="#9a8f7d" font-size="10.5">TLS and the public port live on Nginx; Tomcat only ever hears plain local traffic</text></svg>