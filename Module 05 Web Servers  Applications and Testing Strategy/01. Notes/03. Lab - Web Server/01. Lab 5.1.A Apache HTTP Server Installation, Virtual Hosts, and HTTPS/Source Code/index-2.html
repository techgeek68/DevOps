<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>myapp.local</title>
<style>
  /* Plain page, one soft background, nothing competing for attention. */
  body {
    font-family: sans-serif;
    max-width: 700px;
    margin: 3rem auto;
    padding: 32px 28px;
    color: #333;
    background: #fafaf8;
    border: 1px solid #e6e4df;
    border-radius: 10px;
    line-height: 1.5;
  }

  h1 {
    color: #2c3e50;
    margin: 0 0 10px;
    font-size: 1.5rem;
  }

  /* A short human line instead of a bare status message. */
  p {
    color: #5c5c5c;
    margin: 0;
  }

  code {
    background: #f0f0ec;
    padding: 2px 6px;
    border-radius: 4px;
    font-family: monospace;
    font-size: 0.95em;
    color: #333;
  }
</style>
</head>
<body>
  <h1>Virtual Host: myapp.local</h1>
  <p>This one's served from <code>/var/www/myapp.local</code>.</p>
</body>
</html>
