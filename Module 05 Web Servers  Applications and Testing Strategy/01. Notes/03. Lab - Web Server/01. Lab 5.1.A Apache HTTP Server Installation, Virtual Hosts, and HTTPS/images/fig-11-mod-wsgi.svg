<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 226" role="img" aria-label="Apache with mod_wsgi calling a Python application through the WSGI interface" font-family="Verdana, Geneva, DejaVu Sans, sans-serif"><rect x="0" y="0" width="100%" height="100%" fill="#1c1a17"/><defs><marker id="a-ochre" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#d1972f"/></marker><marker id="a-verd" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#3f9c8b"/></marker><marker id="a-terra" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#c0603f"/></marker><marker id="a-sage" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8aa06a"/></marker><marker id="a-plum" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a6f9c"/></marker><marker id="a-peri" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7f8fc0"/></marker><marker id="a-parch" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e7ddcb"/></marker><marker id="a-faint" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a8f7d"/></marker><marker id="a-rule" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#4a453d"/></marker></defs><rect x="60" y="100" width="180" height="70" rx="8" fill="#151310" stroke="#d1972f" stroke-width="1.4"/><text x="150" y="128" text-anchor="middle" fill="#d1972f" font-size="13" font-weight="bold">Apache</text><text x="150" y="150" text-anchor="middle" fill="#9a8f7d" font-size="9.5" font-family="Consolas, DejaVu Sans Mono, monospace">mod_wsgi loaded in</text><rect x="330" y="100" width="120" height="70" rx="8" fill="#262320" stroke="#3f9c8b" stroke-width="1.4"/><text x="390" y="130" text-anchor="middle" fill="#3f9c8b" font-size="13" font-weight="bold">WSGI</text><text x="390" y="150" text-anchor="middle" fill="#9a8f7d" font-size="9.5">callable</text><rect x="520" y="100" width="150" height="70" rx="8" fill="#262320" stroke="#9a6f9c" stroke-width="1.4"/><text x="595" y="128" text-anchor="middle" fill="#e7ddcb" font-size="12" font-weight="bold">Python app</text><text x="595" y="150" text-anchor="middle" fill="#9a8f7d" font-size="9.5">same process</text><line x1="240" y1="135" x2="328" y2="135" stroke="#d1972f" stroke-width="1.6" fill="none" marker-end="url(#a-ochre)"/><line x1="450" y1="135" x2="518" y2="135" stroke="#3f9c8b" stroke-width="1.6" fill="none" marker-end="url(#a-verd)"/><text x="360" y="206" text-anchor="middle" fill="#9a8f7d" font-size="10.5">mod_wsgi loads the Python application inside Apache and calls it through the WSGI interface</text></svg>