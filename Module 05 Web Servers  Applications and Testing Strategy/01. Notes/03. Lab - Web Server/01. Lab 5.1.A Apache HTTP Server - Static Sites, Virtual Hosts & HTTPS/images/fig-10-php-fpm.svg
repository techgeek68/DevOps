<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 234" role="img" aria-label="Nginx forwarding requests over a FastCGI socket to a PHP FPM worker pool" font-family="Verdana, Geneva, DejaVu Sans, sans-serif"><rect x="0" y="0" width="100%" height="100%" fill="#1c1a17"/><defs><marker id="a-ochre" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#d1972f"/></marker><marker id="a-verd" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#3f9c8b"/></marker><marker id="a-terra" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#c0603f"/></marker><marker id="a-sage" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8aa06a"/></marker><marker id="a-plum" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a6f9c"/></marker><marker id="a-peri" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7f8fc0"/></marker><marker id="a-parch" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e7ddcb"/></marker><marker id="a-faint" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a8f7d"/></marker><marker id="a-rule" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#4a453d"/></marker></defs><rect x="30" y="100" width="150" height="60" rx="8" fill="#151310" stroke="#d1972f" stroke-width="1.4"/><text x="105" y="126" text-anchor="middle" fill="#d1972f" font-size="13" font-weight="bold">Nginx</text><text x="105" y="146" text-anchor="middle" fill="#9a8f7d" font-size="9.5">or Apache</text><rect x="300" y="70" width="180" height="120" rx="10" fill="#151310" stroke="#3f9c8b" stroke-width="1.4"/><text x="390" y="94" text-anchor="middle" fill="#3f9c8b" font-size="13" font-weight="bold">PHP-FPM pool</text><rect x="320" y="110" width="140" height="18" rx="8" fill="#262320" stroke="#3f9c8b" stroke-width="1.4"/><text x="390" y="124" text-anchor="middle" fill="#e7ddcb" font-size="9">worker 1</text><rect x="320" y="134" width="140" height="18" rx="8" fill="#262320" stroke="#3f9c8b" stroke-width="1.4"/><text x="390" y="148" text-anchor="middle" fill="#e7ddcb" font-size="9">worker 2</text><rect x="320" y="158" width="140" height="18" rx="8" fill="#262320" stroke="#3f9c8b" stroke-width="1.4"/><text x="390" y="172" text-anchor="middle" fill="#e7ddcb" font-size="9">worker 3</text><rect x="600" y="100" width="90" height="60" rx="8" fill="#262320" stroke="#9a6f9c" stroke-width="1.4"/><text x="645" y="126" text-anchor="middle" fill="#e7ddcb" font-size="12" font-weight="bold">.php</text><text x="645" y="144" text-anchor="middle" fill="#9a8f7d" font-size="9">files</text><line x1="180" y1="130" x2="298" y2="130" stroke="#d1972f" stroke-width="1.6" fill="none" marker-end="url(#a-ochre)"/><text x="240" y="120" text-anchor="middle" fill="#9a8f7d" font-size="8.5" font-family="Consolas, DejaVu Sans Mono, monospace">FastCGI socket</text><line x1="480" y1="130" x2="598" y2="130" stroke="#3f9c8b" stroke-width="1.6" fill="none" marker-end="url(#a-verd)"/><text x="360" y="214" text-anchor="middle" fill="#9a8f7d" font-size="10.5">the web server speaks FastCGI to a pool of PHP workers instead of running PHP itself</text></svg>