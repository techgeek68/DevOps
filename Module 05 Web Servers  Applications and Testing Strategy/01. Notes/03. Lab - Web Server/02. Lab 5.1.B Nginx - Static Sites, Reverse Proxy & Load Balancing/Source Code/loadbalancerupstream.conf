# This file is MANAGED by the nginx-healthcheck sidecar (Step 8).
# It is included by nginx.conf's `include /etc/nginx/conf.d/*.conf;`,
# which places it in the http context — upstream blocks are valid there,
# and ONLY there. Never include this file from inside a server or location.
upstream backend_servers {
    zone backend 64k;             # shared state across worker processes

    # Round robin is the default; no directive needed.
    #
    # max_fails=3      three failures inside fail_timeout...
    # fail_timeout=30s ...takes the node out for 30s, then probes it again
    server 10.10.130.241:80 max_fails=3 fail_timeout=30s;
    server 10.10.130.242:80 max_fails=3 fail_timeout=30s;

    keepalive 32;                 # pool of idle connections to reuse
}
