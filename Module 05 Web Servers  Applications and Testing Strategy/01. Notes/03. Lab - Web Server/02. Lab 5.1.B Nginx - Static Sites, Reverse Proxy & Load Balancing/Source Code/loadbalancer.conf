# $upstream_addr is the whole reason for a custom format: it names the node
log_format upstreamlog '$remote_addr -> $upstream_addr "$request" $status '
                       'upstream=$upstream_status rt=$request_time urt=$upstream_response_time';

# --- Port 80: health check + redirect everything else to HTTPS ---
server {
    listen 80 default_server;
    server_name lb.test 10.10.130.243;

    # Answered by Nginx itself, over plain HTTP, so external monitors
    # don't need to trust the self-signed cert. Says nothing about backends.
    location = /lb-health {
        access_log off;
        default_type text/plain;
        return 200 "lb ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- Port 443: the actual front door ---
server {
    listen 443 ssl;
    http2 on;         # on nginx >= 1.25.1 prefer `listen 443 ssl;` + `http2 on;`
    server_name lb.test 10.10.130.243;

    ssl_certificate     /etc/nginx/tls/lb.crt;
    ssl_certificate_key /etc/nginx/tls/lb.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:TLS:10m;
    ssl_session_timeout 10m;

    # Headers a browser actually enforces
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        proxy_pass http://backend_servers;

        # Pass original request context to the backend
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;   # backends learn it was https

        # HTTP/1.1 keepalive to the upstream (required for keepalive 32 above)
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # One dead node should be invisible to the client
        proxy_next_upstream         error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries   2;
        proxy_next_upstream_timeout 15s;

        proxy_connect_timeout 30s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    # Connection counters for this Nginx, trusted networks only
    location = /nginx_status {
        stub_status on;
        access_log off;
        allow 10.10.130.0/24;    # lab network
        allow 10.10.129.182;     # host machine
        deny all;
    }

    location ~ /\. {
        deny all;
    }

    access_log /var/log/nginx/lb_access.log upstreamlog;
    error_log  /var/log/nginx/lb_error.log;
}
