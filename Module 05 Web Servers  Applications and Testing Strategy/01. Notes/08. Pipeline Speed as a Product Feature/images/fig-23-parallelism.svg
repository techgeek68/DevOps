<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 266" role="img" aria-label="A trigger fanning out into parallel lint, unit, and integration jobs that fan back into one gate" font-family="Verdana, Geneva, DejaVu Sans, sans-serif"><rect x="0" y="0" width="100%" height="100%" fill="#1c1a17"/><defs><marker id="a-ochre" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#d1972f"/></marker><marker id="a-verd" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#3f9c8b"/></marker><marker id="a-terra" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#c0603f"/></marker><marker id="a-sage" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8aa06a"/></marker><marker id="a-plum" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a6f9c"/></marker><marker id="a-peri" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7f8fc0"/></marker><marker id="a-parch" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e7ddcb"/></marker><marker id="a-faint" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a8f7d"/></marker><marker id="a-rule" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#4a453d"/></marker></defs><rect x="30" y="120" width="110" height="50" rx="8" fill="#262320" stroke="#d1972f" stroke-width="1.4"/><text x="85" y="150" text-anchor="middle" fill="#e7ddcb" font-size="12" font-weight="bold">trigger</text><rect x="280" y="60" width="180" height="40" rx="8" fill="#262320" stroke="#3f9c8b" stroke-width="1.4"/><text x="370" y="85" text-anchor="middle" fill="#e7ddcb" font-size="11" font-weight="bold">lint</text><line x1="140" y1="145" x2="278" y2="80" stroke="#3f9c8b" stroke-width="1.6" fill="none" marker-end="url(#a-verd)"/><line x1="460" y1="80" x2="588" y2="145" stroke="#3f9c8b" stroke-width="1.6" fill="none" marker-end="url(#a-sage)"/><rect x="280" y="120" width="180" height="40" rx="8" fill="#262320" stroke="#d1972f" stroke-width="1.4"/><text x="370" y="145" text-anchor="middle" fill="#e7ddcb" font-size="11" font-weight="bold">unit</text><line x1="140" y1="145" x2="278" y2="140" stroke="#d1972f" stroke-width="1.6" fill="none" marker-end="url(#a-ochre)"/><line x1="460" y1="140" x2="588" y2="145" stroke="#d1972f" stroke-width="1.6" fill="none" marker-end="url(#a-sage)"/><rect x="280" y="180" width="180" height="40" rx="8" fill="#262320" stroke="#9a6f9c" stroke-width="1.4"/><text x="370" y="205" text-anchor="middle" fill="#e7ddcb" font-size="11" font-weight="bold">integration</text><line x1="140" y1="145" x2="278" y2="200" stroke="#9a6f9c" stroke-width="1.6" fill="none" marker-end="url(#a-plum)"/><line x1="460" y1="200" x2="588" y2="145" stroke="#9a6f9c" stroke-width="1.6" fill="none" marker-end="url(#a-sage)"/><rect x="590" y="120" width="110" height="50" rx="8" fill="#262320" stroke="#8aa06a" stroke-width="1.4"/><text x="645" y="150" text-anchor="middle" fill="#e7ddcb" font-size="12" font-weight="bold">gate</text><text x="365" y="244" text-anchor="middle" fill="#9a8f7d" font-size="10.5">independent jobs run at the same time, so total time is the slowest lane, not the sum</text></svg>