<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="A path filter running only the jobs affected by a change and skipping the rest" font-family="Verdana, Geneva, DejaVu Sans, sans-serif"><rect x="0" y="0" width="100%" height="100%" fill="#1c1a17"/><defs><marker id="a-ochre" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#d1972f"/></marker><marker id="a-verd" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#3f9c8b"/></marker><marker id="a-terra" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#c0603f"/></marker><marker id="a-sage" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8aa06a"/></marker><marker id="a-plum" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a6f9c"/></marker><marker id="a-peri" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7f8fc0"/></marker><marker id="a-parch" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e7ddcb"/></marker><marker id="a-faint" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a8f7d"/></marker><marker id="a-rule" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#4a453d"/></marker></defs><rect x="30" y="110" width="150" height="60" rx="8" fill="#151310" stroke="#d1972f" stroke-width="1.4"/><text x="105" y="136" text-anchor="middle" fill="#d1972f" font-size="12" font-weight="bold">a change in</text><text x="105" y="156" text-anchor="middle" fill="#9a8f7d" font-size="8.5" font-family="Consolas, DejaVu Sans Mono, monospace">refapp/pricing.py</text><rect x="250" y="110" width="120" height="60" rx="8" fill="#151310" stroke="#3f9c8b" stroke-width="1.4"/><text x="310" y="136" text-anchor="middle" fill="#3f9c8b" font-size="12" font-weight="bold">path filter</text><line x1="180" y1="140" x2="248" y2="140" stroke="#d1972f" stroke-width="1.6" fill="none" marker-end="url(#a-ochre)"/><rect x="470" y="90" width="200" height="44" rx="8" fill="#262320" stroke="#8aa06a" stroke-width="1.4"/><text x="490" y="117" text-anchor="start" fill="#e7ddcb" font-size="11">unit + integration</text><text x="660" y="117" text-anchor="end" fill="#8aa06a" font-size="10" font-weight="bold">runs</text><line x1="370" y1="140" x2="468" y2="112" stroke="#8aa06a" stroke-width="1.6" fill="none" marker-end="url(#a-sage)"/><rect x="470" y="150" width="200" height="44" rx="8" fill="#262320" stroke="#4a453d" stroke-width="1.4"/><text x="490" y="177" text-anchor="start" fill="#9a8f7d" font-size="11">docs build</text><text x="660" y="177" text-anchor="end" fill="#9a8f7d" font-size="10">skipped</text><line x1="370" y1="140" x2="468" y2="172" stroke="#4a453d" stroke-width="1.6" fill="none" stroke-dasharray="3 3" marker-end="url(#a-faint)"/><rect x="470" y="210" width="200" height="44" rx="8" fill="#262320" stroke="#4a453d" stroke-width="1.4"/><text x="490" y="237" text-anchor="start" fill="#9a8f7d" font-size="11">mobile build</text><text x="660" y="237" text-anchor="end" fill="#9a8f7d" font-size="10">skipped</text><line x1="370" y1="140" x2="468" y2="232" stroke="#4a453d" stroke-width="1.6" fill="none" stroke-dasharray="3 3" marker-end="url(#a-faint)"/><text x="360" y="278" text-anchor="middle" fill="#9a8f7d" font-size="10.5">only the jobs affected by the change actually run, the rest are skipped</text></svg>