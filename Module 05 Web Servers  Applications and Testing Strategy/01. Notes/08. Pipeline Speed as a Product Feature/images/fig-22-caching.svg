<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 246" role="img" aria-label="A pipeline job restoring a cache before work and saving it after, keyed on the lockfile" font-family="Verdana, Geneva, DejaVu Sans, sans-serif"><rect x="0" y="0" width="100%" height="100%" fill="#1c1a17"/><defs><marker id="a-ochre" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#d1972f"/></marker><marker id="a-verd" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#3f9c8b"/></marker><marker id="a-terra" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#c0603f"/></marker><marker id="a-sage" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8aa06a"/></marker><marker id="a-plum" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a6f9c"/></marker><marker id="a-peri" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7f8fc0"/></marker><marker id="a-parch" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e7ddcb"/></marker><marker id="a-faint" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a8f7d"/></marker><marker id="a-rule" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#4a453d"/></marker></defs><rect x="40" y="110" width="140" height="60" rx="8" fill="#151310" stroke="#3f9c8b" stroke-width="1.4"/><text x="110" y="136" text-anchor="middle" fill="#3f9c8b" font-size="12" font-weight="bold">restore cache</text><text x="110" y="156" text-anchor="middle" fill="#9a8f7d" font-size="8.5" font-family="Consolas, DejaVu Sans Mono, monospace">key = lockfile hash</text><rect x="280" y="110" width="150" height="60" rx="8" fill="#262320" stroke="#d1972f" stroke-width="1.4"/><text x="355" y="136" text-anchor="middle" fill="#e7ddcb" font-size="12" font-weight="bold">build and test</text><rect x="530" y="110" width="140" height="60" rx="8" fill="#151310" stroke="#3f9c8b" stroke-width="1.4"/><text x="600" y="136" text-anchor="middle" fill="#3f9c8b" font-size="12" font-weight="bold">save cache</text><line x1="180" y1="140" x2="278" y2="140" stroke="#d1972f" stroke-width="1.6" fill="none" marker-end="url(#a-ochre)"/><line x1="430" y1="140" x2="528" y2="140" stroke="#d1972f" stroke-width="1.6" fill="none" marker-end="url(#a-ochre)"/><text x="110" y="196" text-anchor="middle" fill="#8aa06a" font-size="10">hit: skip the slow install</text><text x="600" y="196" text-anchor="middle" fill="#9a8f7d" font-size="10">only on a miss</text><text x="360" y="224" text-anchor="middle" fill="#9a8f7d" font-size="10.5">reuse dependencies and build output across runs instead of rebuilding the world every time</text></svg>