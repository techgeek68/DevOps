<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" role="img" aria-label="The feedback loop from commit through pipeline to feedback and back to the next commit" font-family="Verdana, Geneva, DejaVu Sans, sans-serif"><rect x="0" y="0" width="100%" height="100%" fill="#1c1a17"/><defs><marker id="a-ochre" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#d1972f"/></marker><marker id="a-verd" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#3f9c8b"/></marker><marker id="a-terra" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#c0603f"/></marker><marker id="a-sage" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8aa06a"/></marker><marker id="a-plum" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a6f9c"/></marker><marker id="a-peri" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7f8fc0"/></marker><marker id="a-parch" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e7ddcb"/></marker><marker id="a-faint" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a8f7d"/></marker><marker id="a-rule" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#4a453d"/></marker></defs><rect x="60" y="110" width="120" height="54" rx="8" fill="#262320" stroke="#d1972f" stroke-width="1.4"/><text x="120" y="142" text-anchor="middle" fill="#e7ddcb" font-size="12" font-weight="bold">commit</text><rect x="300" y="110" width="120" height="54" rx="8" fill="#262320" stroke="#3f9c8b" stroke-width="1.4"/><text x="360" y="142" text-anchor="middle" fill="#e7ddcb" font-size="12" font-weight="bold">pipeline</text><rect x="540" y="110" width="120" height="54" rx="8" fill="#262320" stroke="#8aa06a" stroke-width="1.4"/><text x="600" y="142" text-anchor="middle" fill="#e7ddcb" font-size="12" font-weight="bold">feedback</text><line x1="180" y1="137" x2="298" y2="137" stroke="#d1972f" stroke-width="1.6" fill="none" marker-end="url(#a-ochre)"/><line x1="420" y1="137" x2="538" y2="137" stroke="#d1972f" stroke-width="1.6" fill="none" marker-end="url(#a-ochre)"/><path d="M600,164 C600,230 120,230 120,166" fill="none" stroke="#c0603f" stroke-width="1.8" marker-end="url(#a-terra)"/><text x="360" y="214" text-anchor="middle" fill="#c0603f" font-size="10.5">the next change waits on this loop</text><text x="360" y="60" text-anchor="middle" fill="#9a8f7d" font-size="11">a shorter loop is a faster team, so pipeline speed is a product feature</text></svg>