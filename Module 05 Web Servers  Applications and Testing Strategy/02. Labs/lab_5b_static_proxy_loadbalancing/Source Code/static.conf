server {
    listen 80;
    server_name static.local;

    root  /var/www/edge-static;
    index index.html;

    location ~ /\. {          # never serve dotfiles like .env or .git
        deny all;
    }

    access_log /var/log/nginx/static_access.log;
    error_log  /var/log/nginx/static_error.log;
}
