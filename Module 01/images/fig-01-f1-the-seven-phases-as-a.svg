xt-anchor="middle" fill="#9a8f7d" font-size="10">05</text><text x="604" y="116" text-anchor="middle" font-size="11.5">Testing</text></g><g><rect x="680" y="70" width="112" height="72" rx="8" fill="#262320" stroke="#3f9c8b" stroke-width="1.4"/><text x="736" y="92" text-anchor="middle" fill="#9a8f7d" font-size="10">06</text><text x="736" y="116" text-anchor="middle" font-size="11.5">Deployment</text></g><g><rect x="680" y="192" width="112" height="72" rx="8" fill="#262320" stroke="#8aa06a" stroke-width="1.4"/><text x="736" y="214" text-anchor="middle" fill="#9a8f7d" font-size="10">07</text><text x="736" y="238" text-anchor="middle" font-size="11.5">Maintenance</text></g></g><!-- arrows --><g stroke="#d1972f" stroke-width="1.6" fill="none"><line x1="132" y1="106" x2="150" y2="106" marker-end="url(#ar)"/><line x1="264" y1="106" x2="282" y2="106" marker-end="url(#ar)"/><line x1="396" y1="106" x2="414" y2="106" marker-end="url(#ar)"/><line x1="528" y1="106" x2="546" y2="106" marker-end="url(#ar)"/><line x1="660" y1="106" x2="678" y2="106" marker-end="url(#ar)"/><path d="M736 142 L736 190" marker-end="url(#ar)"/></g><!-- feedback loop --><path d="M680 228 C 300 228, 76 228, 76 150" stroke="#c0603f" stroke-width="1.5" fill="none" stroke-dasharray="5 5" marker-end="url(#ar-amber)"/><text x="360" y="245" fill="#c0603f" font-size="11">feedback from Maintenance re enters planning</text></svg>
