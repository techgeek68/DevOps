<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 190" role="img" aria-label="A 25 percent increase in AI adoption associated with small throughput drop and larger stability drop"><rect x="0" y="0" width="100%" height="100%" fill="#1c1a17"/><line x1="120" y1="95" x2="860" y2="95" stroke="#4a453d"/><text x="120" y="30" fill="#9a8f7d" font-size="10.5">effect of a 25% increase in AI adoption (2024 data)</text><!-- throughput --><text x="20" y="70" fill="#e7ddcb" font-size="11">throughput</text><rect x="120" y="56" width="60" height="24" rx="4" fill="#c0603f" opacity="0.7"/><text x="195" y="73" fill="#c0603f" font-size="11">−1.5%</text><!-- stability --><text x="20" y="130" fill="#e7ddcb" font-size="11">stability</text><rect x="120" y="116" width="200" height="24" rx="4" fill="#c0603f"/><text x="335" y="133" fill="#c0603f" font-size="11">−7.2%</text><text x="500" y="73" fill="#9a8f7d" font-size="10">individuals felt faster ...</text><text x="500" y="133" fill="#9a8f7d" font-size="10">... teams shipped less reliably</text><text x="120" y="172" fill="#9a8f7d" font-size="9.5">Source: Google Cloud Blog, "Announcing the 2024 DORA Report," Oct 22 2024 · full report at dora.dev</text></svg>
