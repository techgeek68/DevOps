<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" role="img" aria-label="Traditional siloed teams versus one cross-functional DevOps team"><rect x="0" y="0" width="100%" height="100%" fill="#1c1a17"/><text x="20" y="28" fill="#9a8f7d" font-size="12">TRADITIONAL · walls between teams</text><g font-size="11" fill="#e7ddcb"><rect x="20" y="44" width="120" height="46" rx="6" fill="#262320" stroke="#4a453d"/><text x="80" y="72" text-anchor="middle">Dev team</text><rect x="200" y="44" width="120" height="46" rx="6" fill="#262320" stroke="#4a453d"/><text x="260" y="72" text-anchor="middle">QA team</text><rect x="380" y="44" width="120" height="46" rx="6" fill="#262320" stroke="#4a453d"/><text x="440" y="72" text-anchor="middle">Ops team</text></g><!-- walls --><g stroke="#c0603f" stroke-width="2.5"><line x1="170" y1="38" x2="170" y2="96"/><line x1="350" y1="38" x2="350" y2="96"/></g><g stroke="#9a8f7d" stroke-width="1.3" fill="none" stroke-dasharray="4 4"><line x1="140" y1="67" x2="198" y2="67"/><line x1="320" y1="67" x2="378" y2="67"/></g><text x="560" y="72" fill="#c0603f" font-size="11">slow, manual handoffs · blame</text><text x="20" y="150" fill="#9a8f7d" font-size="12">DEVOPS · one cross functional team owns the lifecycle</text><rect x="20" y="166" width="480" height="56" rx="10" fill="#262320" stroke="#3f9c8b" stroke-width="1.6"/><text x="260" y="190" text-anchor="middle" fill="#e7ddcb" font-size="12">Plan · Code · Build · Test · Release · Deploy · Operate · Monitor</text><text x="260" y="209" text-anchor="middle" fill="#9a8f7d" font-size="10.5">automation connects the phases · feedback flows continuously</text><text x="560" y="198" fill="#3f9c8b" font-size="11">shared goals · no walls</text></svg>
