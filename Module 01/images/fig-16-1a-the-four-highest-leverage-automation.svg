<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 170" role="img" aria-label="Four automation points: code to build, test gate, deploy, rollback"><rect x="0" y="0" width="100%" height="100%" fill="#1c1a17"/><g font-size="10.5" fill="#e7ddcb"><rect x="20" y="50" width="190" height="70" rx="10" fill="#1c1a17" stroke="#d1972f"/><text x="115" y="76" text-anchor="middle" fill="#d1972f">Code → Build</text><text x="115" y="96" text-anchor="middle" font-size="9" fill="#9a8f7d">push triggers it,</text><text x="115" y="109" text-anchor="middle" font-size="9" fill="#9a8f7d">zero human action</text><rect x="235" y="50" width="190" height="70" rx="10" fill="#1c1a17" stroke="#3f9c8b"/><text x="330" y="76" text-anchor="middle" fill="#3f9c8b">Test gates</text><text x="330" y="96" text-anchor="middle" font-size="9" fill="#9a8f7d">must block, not</text><text x="330" y="109" text-anchor="middle" font-size="9" fill="#9a8f7d">just report</text><rect x="450" y="50" width="190" height="70" rx="10" fill="#1c1a17" stroke="#c0603f"/><text x="545" y="76" text-anchor="middle" fill="#c0603f">Deploy to prod</text><text x="545" y="96" text-anchor="middle" font-size="9" fill="#9a8f7d">exactly one human</text><text x="545" y="109" text-anchor="middle" font-size="9" fill="#9a8f7d">approval, zero steps</text><rect x="665" y="50" width="190" height="70" rx="10" fill="#1c1a17" stroke="#9a6f9c"/><text x="760" y="76" text-anchor="middle" fill="#9a6f9c">Rollback</text><text x="760" y="96" text-anchor="middle" font-size="9" fill="#9a8f7d">as fast &amp; automated</text><text x="760" y="109" text-anchor="middle" font-size="9" fill="#9a8f7d">as deployment</text></g><text x="20" y="30" fill="#9a8f7d" font-size="10.5">manual work at any of these four points is a process smell</text></svg>
