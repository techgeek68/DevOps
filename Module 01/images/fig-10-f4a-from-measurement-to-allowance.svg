<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 210" role="img" aria-label="SLI feeds SLO which derives the error budget, plus toil and blameless postmortem"><rect x="0" y="0" width="100%" height="100%" fill="#1c1a17"/><defs><marker id="ars" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#3f9c8b"/></marker></defs><g font-size="11" fill="#e7ddcb"><rect x="20" y="60" width="150" height="90" rx="10" fill="#262320" stroke="#d1972f"/><text x="95" y="86" text-anchor="middle" fill="#d1972f" font-size="13">SLI</text><text x="95" y="108" text-anchor="middle" font-size="10">what you measure</text><text x="95" y="126" text-anchor="middle" font-size="9.5" fill="#9a8f7d">% requests succeeding</text><rect x="230" y="60" width="150" height="90" rx="10" fill="#262320" stroke="#3f9c8b"/><text x="305" y="86" text-anchor="middle" fill="#3f9c8b" font-size="13">SLO</text><text x="305" y="108" text-anchor="middle" font-size="10">your target</text><text x="305" y="126" text-anchor="middle" font-size="9.5" fill="#9a8f7d">e.g. 99.9% / 30 days</text><rect x="440" y="60" width="170" height="90" rx="10" fill="#262320" stroke="#c0603f"/><text x="525" y="86" text-anchor="middle" fill="#c0603f" font-size="13">ERROR BUDGET</text><text x="525" y="108" text-anchor="middle" font-size="10">100% − SLO</text><text x="525" y="126" text-anchor="middle" font-size="9.5" fill="#9a8f7d">≈ 43 min/month</text></g><g stroke="#3f9c8b" stroke-width="1.6" fill="none"><line x1="170" y1="105" x2="228" y2="105" marker-end="url(#ars)"/><line x1="380" y1="105" x2="438" y2="105" marker-end="url(#ars)"/></g><text x="95" y="40" fill="#9a8f7d" font-size="10">measured</text><text x="305" y="40" fill="#9a8f7d" font-size="10">agreed</text><text x="525" y="40" fill="#9a8f7d" font-size="10">derived</text><!-- side concepts --><g font-size="10.5" fill="#e7ddcb"><rect x="650" y="55" width="230" height="42" rx="8" fill="#1c1a17" stroke="#4a453d"/><text x="665" y="74" fill="#9a6f9c" font-size="11">TOIL</text><text x="665" y="90" fill="#9a8f7d" font-size="9.5">repetitive manual work · keep &lt; 50%</text><rect x="650" y="107" width="230" height="42" rx="8" fill="#1c1a17" stroke="#4a453d"/><text x="665" y="126" fill="#9a6f9c" font-size="11">BLAMELESS POSTMORTEM</text><text x="665" y="142" fill="#9a8f7d" font-size="9.5">fix the system, not the person</text></g></svg>
