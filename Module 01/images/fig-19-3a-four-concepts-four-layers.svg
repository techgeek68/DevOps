<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" role="img" aria-label="SLI measure, SLO internal target, error budget derived allowance, SLA external commitment"><rect x="0" y="0" width="100%" height="100%" fill="#1c1a17"/><g font-size="11" fill="#e7ddcb"><rect x="20" y="24" width="860" height="40" rx="8" fill="#1c1a17" stroke="#d1972f"/><text x="40" y="49" fill="#d1972f">SLI</text><text x="120" y="49" fill="#9a8f7d" font-size="10">what you measure · numerator / denominator / window / collection method</text><rect x="20" y="72" width="860" height="40" rx="8" fill="#1c1a17" stroke="#3f9c8b"/><text x="40" y="97" fill="#3f9c8b">SLO</text><text x="120" y="97" fill="#9a8f7d" font-size="10">your internal target for the SLI · set below 100% on purpose</text><rect x="20" y="120" width="860" height="40" rx="8" fill="#1c1a17" stroke="#c0603f"/><text x="40" y="145" fill="#c0603f">ERROR BUDGET</text><text x="200" y="145" fill="#9a8f7d" font-size="10">the derived allowance = 100% − SLO · governs risk vs. velocity</text><rect x="20" y="168" width="860" height="40" rx="8" fill="#1c1a17" stroke="#9a6f9c"/><text x="40" y="193" fill="#9a6f9c">SLA</text><text x="120" y="193" fill="#9a8f7d" font-size="10">the external contract · set below the SLO, financial penalties on breach</text></g></svg>
