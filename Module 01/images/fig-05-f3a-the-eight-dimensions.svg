<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" role="img" aria-label="Eight dimensions of DevOps as a grid of tiles"><rect x="0" y="0" width="100%" height="100%" fill="#1c1a17"/><g font-size="11.5"><g><rect x="20" y="20" width="205" height="46" rx="8" fill="#262320" stroke="#d1972f"/><text x="34" y="40" fill="#d1972f" font-size="10">01</text><text x="34" y="56" fill="#e7ddcb">Culture &amp; Collaboration</text></g><g><rect x="240" y="20" width="205" height="46" rx="8" fill="#262320" stroke="#d1972f"/><text x="254" y="40" fill="#d1972f" font-size="10">02</text><text x="254" y="56" fill="#e7ddcb">Automation</text></g><g><rect x="460" y="20" width="205" height="46" rx="8" fill="#262320" stroke="#d1972f"/><text x="474" y="40" fill="#d1972f" font-size="10">03</text><text x="474" y="56" fill="#e7ddcb">CI / CD</text></g><g><rect x="680" y="20" width="200" height="46" rx="8" fill="#262320" stroke="#d1972f"/><text x="694" y="40" fill="#d1972f" font-size="10">04</text><text x="694" y="56" fill="#e7ddcb">Observability</text></g><g><rect x="20" y="80" width="205" height="46" rx="8" fill="#262320" stroke="#3f9c8b"/><text x="34" y="100" fill="#3f9c8b" font-size="10">05</text><text x="34" y="116" fill="#e7ddcb">Lean Flow</text></g><g><rect x="240" y="80" width="205" height="46" rx="8" fill="#262320" stroke="#3f9c8b"/><text x="254" y="100" fill="#3f9c8b" font-size="10">06</text><text x="254" y="116" fill="#e7ddcb">Reliability Engineering</text></g><g><rect x="460" y="80" width="205" height="46" rx="8" fill="#262320" stroke="#3f9c8b"/><text x="474" y="100" fill="#3f9c8b" font-size="10">07</text><text x="474" y="116" fill="#e7ddcb">Security Shift Left</text></g><g><rect x="680" y="80" width="200" height="46" rx="8" fill="#262320" stroke="#3f9c8b"/><text x="694" y="100" fill="#3f9c8b" font-size="10">08</text><text x="694" y="116" fill="#e7ddcb">Continuous Learning</text></g></g><line x1="20" y1="150" x2="880" y2="150" stroke="#4a453d" stroke-width="1"/><text x="20" y="18