<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-label="The DevOps infinite loop with eight stages, Dev on the left, Ops on the right"><rect x="0" y="0" width="100%" height="100%" fill="#1c1a17"/><defs><marker id="loopgrad" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#c0603f"/></marker></defs><defs><linearGradient id="loopgrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#d1972f"/><stop offset="0.5" stop-color="#c0603f"/><stop offset="1" stop-color="#3f9c8b"/></linearGradient></defs><!-- infinity path --><path d="M450 150
           C 450 60, 330 60, 250 60
           C 150 60, 90 100, 90 150
           C 90 200, 150 240, 250 240
           C 330 240, 450 240, 450 150
           C 450 60, 570 60, 650 60
           C 750 60, 810 100, 810 150
           C 810 200, 750 240, 650 240
           C 570 240, 450 240, 450 150 Z"
        fill="none" stroke="url(#loopgrad)" stroke-width="3" class="anim-dash"/><text x="250" y="24" text-anchor="middle" fill="#d1972f" font-size="12" letter-spacing="2">DEV</text><text x="650" y="24" text-anchor="middle" fill="#3f9c8b" font-size="12" letter-spacing="2">OPS</text><!-- stage dots + labels: left loop --><g font-size="11.5" fill="#e7ddcb"><circle cx="180" cy="72" r="5" fill="#d1972f"/><text x="180" y="63" text-anchor="middle">Plan</text><circle cx="105" cy="130" r="5" fill="#d1972f"/><text x="70" y="126" text-anchor="middle">Code</text><circle cx="105" cy="172" r="5" fill="#d1972f"/><text x="66" y="190" text-anchor="middle">Build</text><circle cx="180" cy="228" r="5" fill="#d1972f"/><text x="180" y="248" text-anchor="middle">Test</text><circle cx="720" cy="72" r="5" fill="#3f9c8b"/><text x="720" y="63" text-anchor="middle">Release</text><circle cx="795" cy="130" r="5" fill="#3f9c8b"/><text x="835" y="126" text-anchor="middle">Deploy</text><circle cx="795" cy="172" r="5" fill="#3f9c8b"/><text x="835" y="190" text-anchor="middle">Operate</text><circle cx="720" cy="228" r="5" fill="#3f9c8b"/><text x="720" y="248" text-anchor="middle">Monitor</text></g><circle cx="450" cy="150" r="6" fill="#c0603f"/><text x="450" y="286" text-anchor="middle" fill="#c0603f" font-size="11">Monitor → Plan: the loop never ends</text></svg>
