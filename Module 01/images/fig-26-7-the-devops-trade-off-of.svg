<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" role="img" aria-label="What gets harder versus what gets easier when moving to microservices"><rect x="0" y="0" width="100%" height="100%" fill="#1c1a17"/><rect x="20" y="24" width="420" height="190" rx="12" fill="#1c1a17" stroke="#c0603f"/><text x="40" y="52" fill="#c0603f" font-size="13">HARDER</text><g font-size="10" fill="#e7ddcb"><text x="40" y="78">▸ pipeline count (1 → dozens)</text><text x="40" y="100">▸ deployment coordination / order</text><text x="40" y="122">▸ distributed tracing required</text><text x="40" y="144">▸ network failure is first class</text><text x="40" y="166">▸ secret &amp; config sprawl</text><text x="40" y="196" fill="#9a8f7d" font-size="9">without the platform first ▸ "distributed monolith"</text></g><rect x="460" y="24" width="420" height="190" rx="12" fill="#1c1a17" stroke="#3f9c8b"/><text x="480" y="52" fill="#3f9c8b" font-size="13">EASIER</text><g font-size="10" fill="#e7ddcb"><text x="480" y="82">▸ independent scaling per service</text><text x="480" y="112">▸ independent deploy &amp; rollback</text><text x="480" y="142">▸ technology heterogeneity</text><text x="480" y="196" fill="#9a8f7d" font-size="9">smaller blast radius for any one change</text></g></svg>
